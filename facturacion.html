<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>RENMAD Dispatch Center — Facturación</title>
<style>
  :root{--orange:#FF4A00;--charcoal:#2B2B2B;--ink:#3a3a3a;--muted:#7c7c78;--bg:#f3f2ee;--card:#fff;--line:#e3e1da;--red:#D32230;--purple:#8E5BC9;--green:#3E8C28;--amber:#C77800;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
  .app{padding:16px 22px 90px;max-width:1500px;margin:0 auto}
  .nav{display:flex;align-items:center;gap:3px;margin-bottom:8px}
  .nav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:12.5px;padding:5px 8px;border-radius:8px}
  .nav a.on{background:var(--orange);color:#fff}
  .nav .brandlet{margin-left:auto;font-size:13px;color:var(--muted)}
  h1{margin:6px 0 2px;font-size:22px;font-weight:700;color:var(--charcoal)}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
  button{font:inherit;cursor:pointer}
  .btn{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--charcoal);font-size:13px}
  .btn.primary{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:600}
  .btn.sm{padding:3px 9px;font-size:12px}
  .btn:hover{filter:brightness(.97)}
  .btn:disabled{opacity:.55;cursor:default}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .panel h3{margin:0 0 8px;font-size:15px}
  .hint{font-size:12px;color:var(--muted);font-weight:400}
  .warn{background:#FFF3E8;border:1px solid #F3C49B;color:#8a4a12;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}
  .cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .cardk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:120px}
  .cardk .v{font-size:18px;font-weight:800;color:var(--charcoal);font-variant-numeric:tabular-nums}
  .cardk .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .flt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .flt input,.flt select{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:7px}
  .tblwrap{overflow-x:auto}
  /* a second horizontal scrollbar ABOVE the table, synced with the real one below —
     Belén 30 Jul: "it is hard to have to go all the way down just to scroll" */
  .topscroll{overflow-x:auto;overflow-y:hidden;height:14px;margin-bottom:2px}
  .topscroll>div{height:1px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td,th{text-align:left;padding:4px 6px;border-bottom:1px solid #eee;white-space:nowrap}
  .invnum{color:var(--orange);cursor:pointer;text-decoration:none}
  .invnum:hover{text-decoration:underline}
  th{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px}
  th.sortable{cursor:pointer;user-select:none} th.sortable:hover{background:#e2dfd6;color:var(--charcoal)}
  th.sorton{background:#ded8c8;color:var(--charcoal)}
  .sarr{font-size:9px;margin-left:2px} .sarr-dim{opacity:.32;font-weight:400}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.abono td{background:#EFE3FB}   /* invoice-level colour: Abono = purple */
  tr.cancelado td{background:#F8D7D7} /* Cancelado = red */
  td select.inl{font-size:11.5px;padding:2px 4px;border:1px solid var(--line);border-radius:6px}
  .allocchip{display:inline-block;background:#f0eee8;border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:11px;margin:1px 2px}
  .paybadge{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;font-weight:700}
  .paybadge.pd{background:#dff3e4;color:#1c7a3e}    /* paid in full */
  .paybadge.pt{background:#fdeccb;color:#9a6a11}    /* partially paid */
  .ytabs{display:flex;gap:4px;margin:2px 0 10px;flex-wrap:wrap}
  .ytab{border:1px solid var(--line);background:#f4f2ec;color:#6a675e;border-radius:8px 8px 0 0;padding:6px 16px;font-weight:700;font-size:13px;cursor:pointer}
  .ytab.on{background:#fff;color:var(--charcoal);border-bottom-color:#fff;box-shadow:0 -2px 0 var(--orange) inset}
  .stbadge{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700}
  .del{border:none;background:none;color:#c9c6bd;font-size:14px;cursor:pointer}
  .del:hover{color:var(--red)}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:999;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:14px 12px}
  #modal.on{display:flex}
  #modal .card{background:#fff;border-radius:14px;padding:14px 20px 16px;width:1160px;max-width:97vw}
  #modal h3{margin:0 0 8px;font-size:16px}
  .frm{display:grid;grid-template-columns:repeat(6,1fr);gap:5px 9px}
  .frm label{font-size:9.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;overflow:hidden}
  .frm label.w2{grid-column:span 2}
  .frm label.w3{grid-column:span 3}
  .frm label.w4{grid-column:1/-1}
  .frm input,.frm select{font:inherit;font-size:12.5px;padding:4px 7px;border:1px solid var(--line);border-radius:7px;color:var(--ink);min-width:0}
  .frm input[readonly]{background:#f6f5f1;color:var(--muted)}
  .mrow{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;align-items:center}
  .amsg{margin-right:auto;font-size:12px;min-height:15px}
  .lntbl td,.lntbl th{padding:2px 5px}
  .lntbl input,.lntbl select{font:inherit;font-size:12.5px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;width:100%}
  .lntbl input.auto{background:#eef4ff;border-color:#cfe0f7;color:#185FA5;font-weight:600}
  .sect{grid-column:1/-1;border-top:1px solid var(--line);padding-top:5px;margin-top:1px;font-size:10.5px;font-weight:700;color:var(--charcoal);text-transform:uppercase;letter-spacing:.5px}
  .totbox{background:#faf9f6;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:290px}
  .totline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 0;font-size:13px}
  .totline.big{font-size:15px;font-weight:700;color:var(--charcoal);border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
  .totline input,.totline select{font:inherit;font-size:12.5px;padding:3px 6px;border:1px solid var(--line);border-radius:6px}
  .draftbar{background:#FFF3E8;border:1px solid #F3C49B;color:#8a4a12;border-radius:10px;padding:9px 14px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
  <div id="nav"></div>
  <h1>🧾 Facturación</h1>
  <p class="sub">El motor de facturación — cada euro nace aquí como línea de factura. Las líneas alimentan las cifras de 💶 Money, las listas de delegados por evento (catering) y la atribución de ventas. Cada cambio queda registrado.</p>
  <div id="warnbox"></div>
  <div id="draftbox"></div>
  <div id="content"></div>
</div>

<div id="modal"><div class="card"><div id="modalbody"></div></div></div>

<script src="store.js?v=104"></script>
<script>
document.getElementById('nav').innerHTML=navBar('fact');
let editingId=null, allocRows=[], flt={item:'all',prod:'all',status:'all',text:'',from:'',to:'',year:(new Date().getFullYear()+'')};
/* invoices are shown one YEAR at a time (by issue date) so 2025 cross-year invoices
   don't clutter 2026 — the € Dashboard still aggregates each event across all years */
function invYears(){return [...new Set(DB.invoices.map(i=>(''+(i.fecha||'')).slice(0,4)).filter(y=>/^\d{4}$/.test(y)))].sort().reverse();}
/* outstanding € on invoices ISSUED in a year (credit notes netted against their invoice) —
   used to badge the other year tabs so old unpaid money is never silently hidden */
function yearOutstanding(y){
  let s=0;
  DB.invoices.forEach(i=>{
    if(i.status==='abono'||i.status==='cancelado')return;
    if((''+(i.fecha||'')).slice(0,4)!==y)return;
    const credits=DB.invoices.filter(x=>x.abono_de==i.id&&x.status==='abono').reduce((a,x)=>a+(+x.total_factura||0),0);
    s+=Math.max(0,(+i.total_factura||0)+credits-cobrado(i));
  });
  return Math.round(s*100)/100;
}
function yearTabsHtml(){
  const ys=invYears();if(flt.year!=='all'&&ys.length&&ys.indexOf(flt.year)<0)flt.year=ys[0];
  const mk=(v,lab,tip)=>'<button class="ytab'+(flt.year===v?' on':'')+'" data-year="'+v+'"'+(tip?' title="'+esc(tip)+'"':'')+'>'+lab+'</button>';
  return ys.map(y=>{const out=flt.year===y?0:yearOutstanding(y);
    return mk(y,y+(out>0.005?' <span style="color:#D32230">●</span>':''),out>0.005?(eurF(out)+' pendiente de cobro en facturas de '+y):'');}).join('')+mk('all','Todos los años','');
}
/* Collected = CASH view: ledger payments count in the year they were PAID (a 2026
   instalment on a 2025 invoice belongs to 2026); legacy invoices without a ledger
   attribute their cobrado to fecha_cobro (or issue date as last resort). Credit notes
   only count as cash when a refund was actually recorded. */
function collectedFor(year){
  let s=0;
  DB.invoices.forEach(i=>{
    if(hasLedger(i)){
      DB.paymentsFor(i.id).forEach(p=>{const y=(''+(p.fecha||i.fecha||'')).slice(0,4);
        if(year==='all'||y===year)s+=(+p.importe||0);});
      return;
    }
    let amt;
    if(i.status==='abono')amt=(i.importe_cobrado!=null&&i.importe_cobrado!=='')?+i.importe_cobrado:0;
    else if(i.status==='cancelado')amt=(i.importe_cobrado!=null&&i.importe_cobrado!=='')?+i.importe_cobrado:0;
    else amt=cobrado(i);
    if(!amt)return;
    const y=(''+(i.fecha_cobro||i.fecha||'')).slice(0,4);
    if(year==='all'||y===year)s+=amt;
  });
  return Math.round(s*100)/100;
}
const todayISO=()=>toISO(new Date());
/* European display format DD/MM/YYYY (inputs stay type=date; this is for tables/exports) */
function ddmmyyyy(iso){if(!iso)return '';const p=(''+iso).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:(''+iso);}
function actorName(){const u=DB.currentUser;return u?(u.name||u.email||''):'';}
function finById(id){return DB.finance.find(f=>f.id==id);}
/* clean event label — no location (Jesús: "Invest Italia 2026", not "· Milan"; keeps Excel exports clean) */
function finLabelClean(f){return f?((f.name||'?')+' '+(f.year||'')).replace(/\s+/g,' ').trim():'';}
/* Money on this board is to the CENT — Jesús squares the accounting with it, and finFmt's
   rounded figures made the board disagree with the invoice ("IVA 3.748,50 / total 21.598,50"
   showed as 3.749 / 21.599). Everywhere else keeps the rounded finFmt.
   useGrouping:'always' because es-ES leaves four-digit numbers ungrouped by default — the
   VAT line would otherwise read "3748,50" next to a total of "21.598,50". */
function eurF(n){if(n==null||n===''||isNaN(+n))return '—';
  return new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:'always'}).format(+n)+' €';}
function num2(v){return Math.round((+v||0)*100)/100;}
function isAbono(i){return i.producto==='abono'||i.status==='abono';}
/* collected on an invoice — the split-payment ledger when it has payments, else legacy */
function cobrado(i){return DB.paidTotal(i);}
function remainingOf(i){return DB.remainingOf(i);}
function hasLedger(i){return DB.hasLedger(i);}
/* status cell: an invoice with a payment ledger shows a derived Paid/Partial badge
   (+ outstanding) instead of the manual dropdown — payments are edited in ✎ */
function statusCell(i,stSel){
  if(!hasLedger(i)||i.status==='cancelado'||i.status==='abono')return stSel+statusGlyph(i);
  const rem=remainingOf(i),full=rem<=0.005;
  return '<span class="paybadge '+(full?'pd':'pt')+'" title="'+(full?'Paid in full via the payments ledger':'Partially paid — '+eurF(rem)+' outstanding')+'">'+
    (full?'Pagado ✓':'Parcial')+'</span>'+(full?'':'<div class="hint" style="font-size:11px;margin-top:2px">'+eurF(rem)+' left</div>');
}
/* ✓/✗ right after the status so paid vs unpaid reads at a glance (Jesús, 31 Jul) */
function statusGlyph(i){
  if(i.status==='pagado')return ' <span style="color:#1c7a3e;font-weight:900" title="Pagada">✓</span>';
  if(i.status==='no_pagado')return ' <span style="color:#D32230;font-weight:900" title="No pagada">✗</span>';
  return '';
}
/* items ordered by EVENT DATE (Belén, 31 Jul: "order them by date please … across the
   board"); the label stays código-first (Jesús's A5). Items whose event has no date —
   or no event at all — go last, ordered by código as before. */
function codsSorted(){
  const dk=c=>{const f=c.eventId!=null?DB.finance.find(x=>x.id==c.eventId):null;return f?DB.finStartKey(f):Infinity;};
  return DB.codigos.slice().sort((a,b)=>(dk(a)-dk(b))||(''+(a.codigo||'')).localeCompare(''+(b.codigo||''),undefined,{numeric:true}));
}
function codLabel(c){return c.codigo?('('+c.codigo+') '+(c.item||'#'+c.id)):((c.item||'#'+c.id)+' — código pending');}
/* Credit notes carry their OWN sequence, ONE DRAWER PER YEAR.
   Jesús, 28 jul — the rule, from him: "Los abonos no deben tener sufijos, por eso
   decía de separar las numeraciones por año. Siempre es R1, R2, etc y en cada año
   se reinicia." So the number is ALWAYS bare R<n> and every year restarts at R1.
   That is safe precisely because the duplicate check is now per-year: 2027's R1 and
   2026's R1 are different documents in different drawers.
   The legacy 2025 rows typed as R22/25 still COUNT toward 2025's sequence (see
   rNumRe) so back-dating into that year continues at R26 rather than reusing R1. */
function invYearOf(inv){return (''+((inv&&inv.fecha)||'')).slice(0,4);}
function curYear(){return new Date().getFullYear()+'';}
function rNumRe(year){return new RegExp('^R(\\d+)(?:\\/'+(''+year).slice(2)+')?$','i');}
function nextRNumber(year){
  const y=(''+(year||curYear())),re=rNumRe(y);
  let mx=0;
  DB.invoices.forEach(i=>{if(invYearOf(i)!==y)return;const m=re.exec((i.numero_factura||'').trim());if(m)mx=Math.max(mx,+m[1]);});
  return 'R'+(mx+1);
}
/* any R-shaped number, with or without the legacy /yy suffix — keeps R reserved for abonos */
function looksLikeRNumber(n){return /^R\d+(\/\d{2})?$/i.test((''+n).trim());}
/* Next invoice number in a year's drawer (Jesús, 28 jul): "si la última es 20260400,
   pues que ponga 20260401 al crear una nueva factura". Only numeric numbers that
   belong to that year count, and the width is preserved so 2025's 7-digit series
   (2025461) and 2026's 8-digit one (20260483) each continue in their own shape.
   It is only a PROPOSAL — the field stays editable. */
function nextInvoiceNumber(year){
  const y=(''+(year||curYear())),re=new RegExp('^'+y+'\\d+$');
  let best=null;
  DB.invoices.forEach(i=>{
    const n=(''+(i.numero_factura||'')).trim();
    if(invYearOf(i)!==y||!re.test(n))return;
    if(best===null||n.length>best.length||(n.length===best.length&&n>best))best=n;
  });
  if(best===null)return y+'0001';
  const seq=best.slice(y.length);
  return y+String(+seq+1).padStart(seq.length,'0');
}
/* per-line amount = Qty × Price (the maths does itself — Jesús's model) */
function lineAmount(r){return num2((+r.qty||0)*(+r.price||0));}
function lineHasData(r){return lineAmount(r)!==0||(+r.passes||0)!==0||(+r.amount||0)!==0;}
/* line product with legacy fallback: pre-2.0 alloc rows have no producto of their own */
function lineProd(a,inv){return a.producto||(inv?inv.producto:'')||'';}
function invPasses(i){return DB.allocsFor(i.id).reduce((s,a)=>s+(+a.passes||0),0);}
/* Σ net of every invoice linked to an SPX contract — the A11 check reads this.
   Pair rule (30 Jul): a cancelled-by-abono invoice counts and its abono rides along
   (inheriting the link when only the original carries it) so the pair nets to zero. */
function linkedNet(propId,exceptId){
  const ids={};DB.invoices.forEach(x=>{if(x.spxProposalId==propId)ids[x.id]=1;});
  return DB.invoices.filter(x=>(x.spxProposalId==propId||(x.abono_de&&ids[x.abono_de]&&x.status==='abono'))
    &&DB.invCountsMoney(x)&&x.id!=exceptId).reduce((s,x)=>s+(+x.importe_base||0),0);}

/* ---------- main render ---------- */
function render(){
  const W=document.getElementById('warnbox'),C=document.getElementById('content');
  /* Belén, 29 Jul: "everybody needs access to the invoicing, but only Jesús and accounts
     can edit". The page used to lock everyone else out entirely — even though the database
     already worked exactly that way (SELECT = whole roster, INSERT/UPDATE = dc_can_bill()).
     So the book is open to read and every control that WRITES is gated instead. */
  const RO=!DB.canBill();
  W.innerHTML=(RO?'<div class="banner" style="background:#EEF3FB;border:1px solid #cfe0f5;color:#1c4f8f;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px">👁 Puedes consultar el libro de facturas — buscar, filtrar y descargar. Solo los editores de facturación (contabilidad) pueden crear o cambiar cosas.</div>':'')+
    (DB.billReady()?'':'<div class="warn">The invoicing module is not active yet — run <b>dispatch_facturacion.sql</b> in the Supabase SQL editor, then reload. You can look around, but nothing will save.</div>')+
    (DB.billReady()&&window._inv2Ready===false?'<div class="warn">Invoicing 2.0 line details (product · qty · price per line) will not persist until <b>dispatch_invoicing2.sql</b> is run in Supabase. Amounts, códigos and passes still save fine.</div>':'');
  renderDraftBar();
  const rows=filtered();
  /* the cards follow the pair rule (30 Jul): a cancelled invoice stays in as long as its
     abono is in — together they add zero. Excluding the cancelled one while counting the
     abono made Base/Total drop TWICE per cancellation. A cancelled invoice with no live
     credit note (legacy states) stays excluded. NOTE the year tabs are drawers by issue
     date, so a cross-year pair nets to zero only on "Todos los años". */
  const live=rows.filter(i=>DB.invCountsMoney(i));
  const base=live.reduce((a,i)=>a+(+i.importe_base||0),0), tot=live.reduce((a,i)=>a+(+i.total_factura||0),0);
  /* Collected: CASH received in the tab's year, whatever year its invoice was issued
     (see collectedFor). Outstanding: what is still owed on the invoices ISSUED in the
     tab's year, with credit notes netted against their invoice — a partial abono on an
     unpaid invoice reduces the debt instead of faking negative cash. */
  const cob=collectedFor(flt.year||'all');
  const pend=live.reduce((a,i)=>{
    if(i.status==='abono')return a;
    const credits=DB.invoices.filter(x=>x.abono_de==i.id&&x.status==='abono').reduce((s,x)=>s+(+x.total_factura||0),0);
    return a+Math.max(0,(+i.total_factura||0)+credits-cobrado(i));
  },0);
  const yearLab=(flt.year&&flt.year!=='all')?flt.year:'all years';
  /* the item filter lists only items actually used in an analítica (E1) — so Webinars/ATA are filterable too */
  const usedIds={};DB.invoiceAllocs.forEach(a=>{const c=DB.codigoById(a.codigoId)||DB.codigoForEvent(a.eventId);if(c)usedIds[c.id]=1;});
  const itemOpts=codsSorted().filter(c=>usedIds[c.id]).map(c=>'<option value="'+c.id+'" '+(flt.item==c.id?'selected':'')+'>'+esc(codLabel(c))+'</option>').join('');
  C.innerHTML=
    '<div class="cards">'+
      '<div class="cardk"><div class="v">'+rows.length+'</div><div class="k">Facturas</div></div>'+
      '<div class="cardk"><div class="v">'+eurF(base)+'</div><div class="k">Base</div></div>'+
      '<div class="cardk"><div class="v">'+eurF(tot)+'</div><div class="k">Total (IVA incl.)</div></div>'+
      '<div class="cardk"><div class="v" style="color:var(--green)">'+eurF(cob)+'</div><div class="k">Cobrado <span style="font-weight:400;opacity:.75">— caja de '+yearLab+'</span></div></div>'+
      '<div class="cardk"><div class="v" style="color:'+(pend>0?'var(--red)':'var(--charcoal)')+'">'+eurF(pend)+'</div><div class="k">Pendiente <span style="font-weight:400;opacity:.75">— facturas de '+yearLab+'</span></div></div>'+
    '</div>'+
    '<div class="panel"><h3>Facturas '+(RO?'':'<button class="btn primary sm" id="addInv">+ Nueva factura</button> <button class="btn sm" id="addCredit" style="background:#D32230;border-color:#D32230;color:#fff" title="Pick an invoice → total or partial → it is created automatically in negative, numbered R1, R2, R3…">+ Abono</button> <button class="btn sm" id="cfgCod">⚙ Artículos y códigos</button> <button class="btn sm" id="cfgProd" title="The products a line can be sold as — add your own (Pase Online…) without asking anyone">🏷 Productos</button> ')+'<button class="btn sm" id="xls" title="Download the invoices under the current filters + an Analítica sheet (one row per line: product · item · código · qty · price)">⬇ Excel</button>'+(RO?'':' <button class="btn sm" id="histLoad" title="Load historical invoices from the Excel template — rows sharing an invoice nº become one invoice with several lines">⬆ Cargar histórico</button>')+'</h3>'+
    '<div class="ytabs">'+yearTabsHtml()+'</div>'+
    '<div class="flt">'+
      '<select id="f_item"><option value="all">— item —</option>'+itemOpts+'</select>'+

function filtered(){
  const t=(flt.text||'').toLowerCase();
  return DB.invoices.filter(i=>{
    if(flt.item!=='all'&&!DB.allocsFor(i.id).some(a=>{const c=DB.codigoById(a.codigoId)||DB.codigoForEvent(a.eventId);return c&&c.id==flt.item;}))return false;
    if(flt.prod!=='all'&&i.producto!==flt.prod&&!DB.allocsFor(i.id).some(a=>a.producto===flt.prod))return false;
    if(flt.status!=='all'&&i.status!==flt.status)return false;
    if(flt.year&&flt.year!=='all'&&(''+(i.fecha||'')).slice(0,4)!==flt.year)return false;
    if(flt.from&&(i.fecha||'')<flt.from)return false;
    if(flt.to&&(i.fecha||'')>flt.to)return false;
    if(t&&!([i.razon_social,i.numero_factura,i.pedido,i.comentarios,i.entered_by,i.codigo_contable,i.producto].join(' ').toLowerCase().includes(t)))return false;
    return true;
  }).sort((a,b)=>((a.fecha||'').localeCompare(b.fecha||''))||((a.numero_factura||'').localeCompare(b.numero_factura||'',undefined,{numeric:true})));
}
/* which products live on an invoice — line products first, invoice product as legacy fallback */
function prodCell(i){
  const set={},out=[];
  DB.allocsFor(i.id).forEach(a=>{const p=lineProd(a,i);if(p&&!set[p]){set[p]=1;out.push(PRODUCTO_LABEL[p]||p);}});
  if(!out.length&&i.producto)out.push(PRODUCTO_LABEL[i.producto]||i.producto);
  return out.join(' + ');
}
/* ---------- Excel-style column sort (Jesús, 28 jul: "¿se puede poner el ordenar columnas
   como lo tiene SPX en el de Invoices? A veces me es útil"). Same behaviour as the SPX
   board: click to sort, click again to reverse, blanks always sink to the bottom. The
   default (no column picked) stays date → invoice nº. ---------- */
let SORT={col:null,dir:1};
function isBlankV(v){return v==null||v===''||(typeof v==='number'&&isNaN(v));}
function cmpV(a,b,type,dir){
  const ab=isBlankV(a),bb=isBlankV(b);
  if(ab&&bb)return 0; if(ab)return 1; if(bb)return -1;
  let r;
  if(type==='num')r=(+a)-(+b);
  else if(type==='date')r=(''+a).localeCompare(''+b);            // ISO YYYY-MM-DD sorts chronologically as text
  else r=(''+a).localeCompare(''+b,undefined,{sensitivity:'base',numeric:true});
  return r*dir;
}
/* the board's columns, in the order they are rendered below — label, type and the value
   the sort reads. Change one here and the header follows. */
function contractOwnerVal(i){
  const p=i.spxProposalId?(DB.spxProps||[]).find(x=>x.id==i.spxProposalId):null;
  return p?(p.responsableName||p.responsable||''):'';
}
function allocSortVal(i){
  const a=DB.allocsFor(i.id)[0];if(!a)return '';
  const c=DB.codigoById(a.codigoId)||DB.codigoForEvent(a.eventId);
  return c?(c.item||c.codigo||''):'';
}
const INV_COLS=[
  {k:'num',   label:'Nº factura',            get:i=>i.numero_factura},
  {k:'fecha', label:'Fecha',      type:'date',get:i=>i.fecha},
  {k:'venc',  label:'Vencimiento',  type:'date',get:i=>i.vencimiento},
  {k:'rs',    label:'Empresa',               get:i=>i.razon_social},
  {k:'prod',  label:'Producto',               get:i=>prodCell(i)},
  {k:'pases', label:'Pases',    type:'num', cls:'num', get:i=>invPasses(i)},
  {k:'base',  label:'Subtotal €',type:'num', cls:'num', get:i=>i.importe_base},
  {k:'usd',   label:'Subtotal US$',type:'num',cls:'num',get:i=>i.en_usd?i.importe_usd:null},
  {k:'iva',   label:'IVA',       type:'num', cls:'num', get:i=>i.iva_importe},
  {k:'total', label:'Total',     type:'num', cls:'num', get:i=>i.total_factura},
  {k:'st',    label:'Estado',                get:i=>INV_STATUS[i.status]||i.status},
  {k:'ctr',   label:'Contrato',              get:i=>contractOwnerVal(i)},
  {k:'alloc', label:'Analítica (item · código)', get:i=>allocSortVal(i)},
  {k:'com',   label:'Comentarios',              get:i=>i.comentarios},
];
function applyInvSort(rows){
  if(!SORT.col)return rows;                                       // no column picked → the caller's default order
  const col=INV_COLS.find(c=>c.k===SORT.col); if(!col)return rows;
  return rows.slice().sort((a,b)=>cmpV(col.get(a),col.get(b),col.type||'text',SORT.dir));
}
function invThCells(cols){
  return cols.map(c=>{
    const active=SORT.col===c.k;
    const arr=active?(SORT.dir>0?'<span class="sarr">▲</span>':'<span class="sarr">▼</span>'):'<span class="sarr sarr-dim">↕</span>';
    return '<th class="sortable'+(c.cls?' '+c.cls:'')+(active?' sorton':'')+'" data-sort="'+c.k+'" title="Sort by '+esc(c.label)+'">'+esc(c.label)+' '+arr+'</th>';
  }).join('')+'<th style="width:26px"></th>';
}
function setSort(key){if(SORT.col===key)SORT.dir=-SORT.dir;else{SORT.col=key;SORT.dir=1;}renderTable(filtered());}
/* keep the top scrollbar the same width as the table and the two in lockstep */
function wireTopScroll(){
  const top=document.getElementById('tscroll'),inner=document.getElementById('tscroll_i'),
        wrap=document.getElementById('twrap'),tbl=document.getElementById('itbl');
  if(!top||!wrap||!tbl)return;
  inner.style.width=tbl.scrollWidth+'px';
  top.style.display=tbl.scrollWidth>wrap.clientWidth+2?'':'none';
  let lock=false;
  top.onscroll=()=>{if(lock)return;lock=true;wrap.scrollLeft=top.scrollLeft;lock=false;};
  wrap.onscroll=()=>{if(lock)return;lock=true;top.scrollLeft=wrap.scrollLeft;lock=false;};
}
function renderTable(rows){
  /* "Entered by" left the board (Jesús 28 Jul): it pushed the edit control off-screen.
     The pen itself left on 30 Jul (Belén): the INVOICE NUMBER is the edit link now, so
     there is nothing to scroll right for. "Contract salesperson" → "Contract" for width.
     Subtotal US$ only appears when the filtered list actually has a USD invoice. */
  const canWrite=DB.canBill();      // everyone reads the book; only accounting changes it
  rows=applyInvSort(rows);
  const showUsd=rows.some(i=>i.en_usd&&i.importe_usd!=null&&i.importe_usd!=='');

  rows.forEach(i=>{
    const allocs=DB.allocsFor(i.id);
    const chips=allocs.map(a=>{const c=DB.codigoById(a.codigoId)||DB.codigoForEvent(a.eventId);const f=finById(a.eventId);
      const label=c?(esc(c.item||'?')+(c.codigo?' · '+esc(c.codigo):'')):(f?esc(finLabelClean(f)):('#'+(a.eventId||'?')));
      /* passes live in their own column (Jesús 2.5) — the chip stays item · código · amount */
      return '<span class="allocchip">'+label+' · '+eurF(DB.allocEur(a))+'</span>';}).join('')||'<span class="hint">—</span>'; // USD lines shown in their € value
    /* C2: Cancelled is NOT offered by hand — it only arrives via a total credit note.
       Credit-note rows are locked too (Jesús 2.5): an R-document is always a credit note. */
    const stOpts=Object.keys(INV_STATUS).filter(s=>(s!=='cancelado'||i.status==='cancelado')&&(s!=='abono'||i.status==='abono'));
    const stLock=i.status==='cancelado'?'disabled title="Cancelada por abono total — definitivo"':i.status==='abono'?'disabled title="Abono — el estado es fijo"':'';
    /* read-only reader: the status is a fact to look at, not a control */
    const stSel=canWrite?'<select class="inl" data-st="'+i.id+'" '+stLock+'>'+stOpts.map(s=>'<option value="'+s+'" '+(i.status===s?'selected':'')+'>'+INV_STATUS[s]+'</option>').join('')+'</select>'
                        :esc(INV_STATUS[i.status]||i.status||'');
    const passes=invPasses(i);
    /* the invoice number IS the edit link (Belén 30 Jul — the pen at the far right
       forced a horizontal scroll for every edit) */
    const numCell=canWrite
      ?'<b class="invnum" data-edit="'+i.id+'" title="Abrir y editar esta factura">'+esc(i.numero_factura||'')+'</b>'
      :'<b>'+esc(i.numero_factura||'')+'</b>';
    h+='<tr class="'+(i.status==='abono'?'abono':i.status==='cancelado'?'cancelado':'')+'">'+
      '<td>'+numCell+(i.abono_de?' <span class="hint" title="credit note for invoice '+esc((DB.invoice(i.abono_de)||{}).numero_factura||'#'+i.abono_de)+'">↩</span>':'')+'</td>'+
      '<td>'+ddmmyyyy(i.fecha)+'</td><td>'+ddmmyyyy(i.vencimiento)+'</td><td style="white-space:normal">'+esc(i.razon_social||'')+'</td>'+
      '<td>'+prodCell(i)+'</td>'+
      '<td class="num">'+(passes?passes:'<span class="hint">—</span>')+'</td>'+
      '<td class="num">'+eurF(i.importe_base)+'</td>'+
      (showUsd?'<td class="num">'+(i.en_usd&&i.importe_usd!=null&&i.importe_usd!==''?'$'+(+i.importe_usd).toFixed(2):'<span class="hint">—</span>')+'</td>':'')+
      '<td class="num">'+eurF(i.iva_importe)+' <span class="hint">'+(i.iva_pct!=null?i.iva_pct+'%':'')+'</span></td>'+
      '<td class="num"><b>'+eurF(i.total_factura)+'</b></td>'+
      '<td>'+statusCell(i,stSel)+'</td>'+
      '<td style="white-space:normal">'+contractOwnerCell(i)+'</td>'+
      '<td style="white-space:normal">'+chips+'</td>'+
      '<td style="white-space:normal;max-width:180px;overflow:hidden;text-overflow:ellipsis" title="'+esc(i.comentarios||'')+'">'+esc(i.comentarios||'')+'</td>'+
      '<td>'+(canWrite?'<button class="del" data-kill="'+i.id+'" title="Delete (recoverable from the audit log)">×</button>':'')+'</td></tr>';
  });
  document.getElementById('itbl').innerHTML=h;
  wireTopScroll();
  document.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>setSort(th.dataset.sort));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal(DB.invoice(b.dataset.edit)));
  document.querySelectorAll('[data-ctr]').forEach(b=>{b.onclick=e=>{e.stopPropagation();openModal(DB.invoice(b.dataset.ctr));};});
  document.querySelectorAll('[data-st]').forEach(s=>s.onchange=()=>{
    const i=DB.invoice(s.dataset.st);if(!i)return;
    if(s.value==='abono'&&!(''+(i.numero_factura||'')).toUpperCase().startsWith('R')){alert('A credit note must have an invoice number starting with R — use “+ Abono”.');s.value=i.status;return;}
    i.status=s.value;
    if(i.status==='pagado'){if(!i.fecha_cobro)i.fecha_cobro=todayISO();}

    DB.save();render();
  });
  document.querySelectorAll('[data-kill]').forEach(b=>b.onclick=()=>{
    const i=DB.invoice(b.dataset.kill);if(!i)return;

       to Unpaid — the cancellation existed only because of that credit note. */
    const orig=(i.status==='abono'&&i.abono_de)?DB.invoice(i.abono_de):null;

    if(!confirm('Delete invoice '+(i.numero_factura||'')+' with its analítica lines'+(dl?' and its '+dl+' delegate seats':'')+'?'+(revert?' Invoice '+(orig.numero_factura||'')+' will go back to Unpaid.':'')+' (recoverable from the audit log)'))return;
    if(revert){orig.status='no_pagado';orig.fecha_cobro=null;}
    DB.data.invoices=DB.invoices.filter(x=>x.id!=i.id);
    DB.data.invalloc=DB.invoiceAllocs.filter(a=>a.invoice_id!=i.id);
    DB.data.delegates=DB.delegates.filter(d=>d.invoice_id!=i.id);
    DB.save();render();
  });
}

/* Contract salesperson — derived from the SPX link (the "who sold it" Jesús kept, B1).
   A11: the ⚠ now compares the CONTRACT VALUE vs the linked invoices' net — warn only, never block. */
function contractOwnerCell(i){
  if(!i.spxProposalId){
    if(DB.canBill()&&(i.producto==='sponsorship'||i.producto==='upgrade'||DB.allocsFor(i.id).some(a=>a.producto==='sponsorship'||a.producto==='upgrade'))&&i.status!=='cancelado')
      return '<button class="btn sm" data-ctr="'+i.id+'" title="Link this invoice to the contract the salesperson sent — mandatory for new SPX/upgrade invoices" style="color:#C77800">link contract</button>';
    return '<span class="hint">—</span>';
  }
  const p=(DB.spxProps||[]).find(x=>x.id==i.spxProposalId);
  if(!p)return '<span class="hint">#'+esc(''+i.spxProposalId)+'</span>';
  const owner=p.responsableName||p.responsable||'';
  const cVal=+p.valueEur||0;
  const invTot=linkedNet(i.spxProposalId,null);
  if(cVal&&Math.abs(invTot-cVal)>0.01)
    return '<span style="color:#C77800;font-weight:700" title="Invoiced so far on this contract: '+eurF(invTot)+' vs contract value '+eurF(cVal)+' — double-check (the fault can sit on either side)">⚠ '+esc(owner||'?')+'</span>';
  return esc(owner||'—');
}

/* ---------- códigos contables (mini-BD, hand-maintained) ---------- */
/* Opens as a POP-UP (Jesús, 23 jul). It used to render at the very bottom of the page,
   so reaching it meant scrolling past every invoice — fine with 3, a chore with 500.
   Códigos are NOT split per year: they must be unique forever and the analítica keys
   off the item → € Dashboard event link, so a year drawer would orphan old invoices.
   Retiring an item instead hides it from new invoices while history keeps resolving. */
function codigoDupOf(id,codigo){
  const v=(''+(codigo||'')).trim().toLowerCase();
  if(!v)return null;
  return DB.codigos.find(x=>x.id!=id&&(''+(x.codigo||'')).trim().toLowerCase()===v)||null;
}
/* items offered on an invoice line: live ones, plus whichever is already selected */
function codsForPicker(sel){return codsSorted().filter(c=>!c.archived||(sel&&c.id==sel));}
function codigosBodyHtml(msg){
  const evOpts=sel=>'<option value="">— no event —</option>'+DB.finance.slice().sort((a,b)=>(DB.finStartKey(b)-DB.finStartKey(a))||(a.name||'').localeCompare(b.name||'')).map(f=>'<option value="'+f.id+'" '+(f.id==sel?'selected':'')+'>'+esc(finLabelClean(f))+'</option>').join(''); // date order, newest first (Belén, 31 Jul)
  const dups={};DB.codigos.forEach(c=>{const v=(''+(c.codigo||'')).trim().toLowerCase();if(v)dups[v]=(dups[v]||0)+1;});
  let h='<h3>Artículos y códigos contables</h3>'+
    '<p class="hint" style="margin:0 0 10px">The mini-database of every billable item (events, Webinars, ATA, consultancy…) linked to its código contable; the analítica picks from this list. '+

  codsSorted().forEach(c=>{
    const isDup=(''+(c.codigo||'')).trim()&&dups[(''+c.codigo).trim().toLowerCase()]>1;
    h+='<tr'+(c.archived?' style="opacity:.55"':'')+'><td><input data-cf="item" data-id="'+c.id+'" value="'+esc(c.item||'')+'" style="width:190px" placeholder="e.g. Almacenamiento 26"></td>'+
    '<td><input data-cf="codigo" data-id="'+c.id+'" value="'+esc(c.codigo||'')+'" placeholder="pending" style="width:90px'+(isDup?';background:#F8D7D7;font-weight:700':(c.codigo?'':';background:#ffe2c4'))+'" title="'+(isDup?'DUPLICATE código — two items cannot share one code':(c.codigo?'':'Código pending — fill it in when accounting assigns it; it also fills the event&#39;s hour-allocation project'))+'"></td>'+
    '<td><select data-cf="eventId" data-id="'+c.id+'" style="width:220px">'+evOpts(c.eventId)+'</select></td>'+
    '<td style="text-align:center"><input type="checkbox" data-cf="live" data-id="'+c.id+'"'+(c.archived?'':' checked')+'></td>'+
    '<td><button class="del" data-cdel="'+c.id+'">×</button></td></tr>';});
  h+='</table></div><div class="mrow"><span class="amsg" id="cod_msg"></span><button class="btn sm" id="addCod">+ Add item</button><button class="btn primary" id="cod_close">Done</button></div>';
  return h;
}
function openCodigosModal(msg){
  document.getElementById('modalbody').innerHTML=codigosBodyHtml(msg);
  document.getElementById('modal').classList.add('on');

}
function wireCodigos(){
  const say=t=>{const m=document.getElementById('cod_msg');if(m){m.style.color='var(--red)';m.textContent=t||'';}};
  document.querySelectorAll('[data-cf]').forEach(el=>el.onchange=()=>{
    const c=DB.codigos.find(x=>x.id==el.dataset.id);if(!c)return;
    const f=el.dataset.cf;
    if(f==='live'){c.archived=!el.checked;DB.save();openCodigosModal();return;}
    if(f==='codigo'){
      const v=el.value.trim();
      const clash=codigoDupOf(c.id,v);
      if(clash){                                   // Jesús spotted 70321 twice — never again
        say('Código '+v+' is already used by "'+(clash.item||'#'+clash.id)+'". Códigos must be unique.');
        el.value=c.codigo||'';el.focus();return;
      }
      c.codigo=v;DB.syncEventCodes();              // a código filled here flows to the event's hour-project too
      DB.save();openCodigosModal();return;
    }
    c[f]=f==='eventId'?(el.value?+el.value:null):el.value;
    DB.save();say('');
  });
  document.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{
    const c=DB.codigos.find(x=>x.id==b.dataset.cdel);
    const used=DB.invoiceAllocs.filter(a=>a.codigoId==b.dataset.cdel).length;
    if(used){say('"'+((c&&c.item)||'that item')+'" is used on '+used+' invoice line(s) — untick Live to retire it instead of deleting.');return;}
    if(!confirm('Remove this item?'))return;
    DB.data.codigos=DB.codigos.filter(x=>x.id!=b.dataset.cdel);DB.save();openCodigosModal();
  });
  const ac=document.getElementById('addCod');
  if(ac)ac.onclick=()=>{DB.codigos.push({id:DB.newId(),item:'',codigo:'',descripcion:'',eventId:null,archived:false});DB.save();openCodigosModal();};
  const cc=document.getElementById('cod_close');
  if(cc)cc.onclick=()=>{closeModal();render();};
}

/* ---------- products (the "Producto" column of a line) ---------- */
/* Belén, 29 jul: "hay que añadir Pase Online para los Talks… o un botón para no estar
   pidiendo productos". So accounting adds its own here instead of asking for a deploy.
   The ten built-in products stay in the code because they carry behaviour (tickets counts
   passes, abono is a credit note, sponsorship opens a delegate seat) — they are listed
   read-only for context. A custom product ticked "counts passes" behaves exactly like
   Tickets: pass-type column, passes on the board, delegate seats, ticket money on SPX. */
function prodSlug(label){
  const s=(''+(label||'')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  return s||'producto';
}
function prodKeyFree(base,id){
  let k=base,n=2;
  while(isBuiltinProd(k)||DB.productos.some(p=>p.id!=id&&p.key===k)){k=base+'_'+n;n++;}
  return k;
}
function prodUsage(key){
  return DB.invoiceAllocs.filter(a=>a.producto===key).length+DB.invoices.filter(i=>i.producto===key).length;
}
function productosBodyHtml(msg){

    'Add your own below: tick <b>Counts passes</b> when it is a seat someone attends with (that gives it the pass-type column, the Passes total and a delegate seat, exactly like Tickets). '+
    'Untick <b>Live</b> to retire one — it drops out of new invoices while old ones still read correctly.</p>'+

    (DB.prodReady()?'':'<div class="warn" style="margin:0 0 10px">The products table is not in the database yet — nothing added here can be saved.</div>')+

  PRODUCTOS_BUILTIN.forEach(k=>{
    h+='<tr><td>'+esc(PRODUCTO_LABEL_BUILTIN[k])+' <span class="hint">· built in</span></td>'+
      '<td style="text-align:center">'+(k==='tickets'?'✓':'<span class="hint">—</span>')+'</td>'+
      '<td style="text-align:center"><span class="hint">always</span></td>'+
      '<td class="num">'+(prodUsage(k)||'<span class="hint">—</span>')+'</td><td></td></tr>';
  });
  if(!mine.length)h+='<tr><td colspan="5" class="hint">No products of your own yet — add one below.</td></tr>';
  mine.forEach(p=>{
    h+='<tr'+(p.archived?' style="opacity:.55"':'')+'><td><input data-pf="label" data-id="'+p.id+'" value="'+esc(p.label||'')+'" style="width:220px" placeholder="e.g. Pase Online">'+
      (p.key?' <span class="hint" title="Internal name, fixed once created so old invoices keep resolving">'+esc(p.key)+'</span>':'')+'</td>'+
      '<td style="text-align:center"><input type="checkbox" data-pf="pases" data-id="'+p.id+'"'+(p.pases?' checked':'')+'></td>'+
      '<td style="text-align:center"><input type="checkbox" data-pf="live" data-id="'+p.id+'"'+(p.archived?'':' checked')+'></td>'+
      '<td class="num">'+(prodUsage(p.key)||'<span class="hint">—</span>')+'</td>'+
      '<td><button class="del" data-pdel="'+p.id+'">×</button></td></tr>';
  });
  h+='</table></div><div class="mrow"><span class="amsg" id="prod_msg"></span><button class="btn sm" id="addProd">+ Add product</button><button class="btn primary" id="prod_close">Done</button></div>';
  return h;
}
function openProductosModal(msg){
  document.getElementById('modalbody').innerHTML=productosBodyHtml(msg);
  document.getElementById('modal').classList.add('on');
  wireProductos();
}
function wireProductos(){
  const say=t=>{const m=document.getElementById('prod_msg');if(m){m.style.color='var(--red)';m.textContent=t||'';}};
  document.querySelectorAll('[data-pf]').forEach(el=>el.onchange=()=>{
    const p=DB.productos.find(x=>x.id==el.dataset.id);if(!p)return;
    const f=el.dataset.pf;
    if(f==='label'){
      const v=el.value.trim();
      if(!v){say('Give the product a name.');el.value=p.label||'';return;}
      if(PRODUCTOS_BUILTIN.some(k=>PRODUCTO_LABEL_BUILTIN[k].toLowerCase()===v.toLowerCase())||
         DB.productos.some(x=>x.id!=p.id&&(''+(x.label||'')).toLowerCase()===v.toLowerCase())){
        say('There is already a product called "'+v+'".');el.value=p.label||'';return;}
      p.label=v;
      /* the key is minted once, from the first name given, and then never moves — invoice
         lines store the key, so renaming the product must not orphan them */
      if(!p.key)p.key=prodKeyFree(prodSlug(v),p.id);
    }
    else if(f==='pases')p.pases=el.checked;
    else if(f==='live')p.archived=!el.checked;
    rebuildProductos();DB.save();openProductosModal();
  });
  document.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{
    const p=DB.productos.find(x=>x.id==b.dataset.pdel);if(!p)return;
    const used=prodUsage(p.key);
    if(used){say('"'+(p.label||p.key)+'" is on '+used+' invoice line(s) — untick Live to retire it instead of deleting.');return;}
    if(!confirm('Remove the product "'+(p.label||p.key)+'"?'))return;
    DB.data.productos=DB.productos.filter(x=>x.id!=p.id);
    rebuildProductos();DB.save();openProductosModal();
  });
  const ap=document.getElementById('addProd');
  if(ap)ap.onclick=()=>{
    if(!DB.prodReady()){say('The products table is not in the database yet.');return;}
    /* asked for up front: the key is minted from the name, and a nameless row would
       collide with the next nameless row on the unique index */
    const name=(prompt('Name of the new product — e.g. Pase Online')||'').trim();
    if(!name)return;
    if(PRODUCTOS_BUILTIN.some(k=>PRODUCTO_LABEL_BUILTIN[k].toLowerCase()===name.toLowerCase())||
       DB.productos.some(x=>(''+(x.label||'')).toLowerCase()===name.toLowerCase())){
      say('There is already a product called "'+name+'".');return;}
    const sort=DB.productos.reduce((m,p)=>Math.max(m,+p.sort||0),0)+10;
    DB.productos.push({id:DB.newId(),key:prodKeyFree(prodSlug(name),null),label:name,pases:false,sort:sort,archived:false});
    rebuildProductos();DB.save();openProductosModal();
  };
  const pc=document.getElementById('prod_close');
  if(pc)pc.onclick=()=>{closeModal();render();};
}

/* contracts to link an invoice to = live WON proposals (the one already
   linked stays listed even if its status later changes, so edits never wipe it) */
function spxContractOpts(sel){
  const won=(DB.spxProps||[]).filter(p=>p.active!==false&&!p.superseded&&(p.salesStatus==='Confirmed'||(sel&&p.id==sel)))
    .sort((a,b)=>(''+(a.company||'')).localeCompare(''+(b.company||'')));
  return '<option value="">— none —</option>'+won.map(p=>'<option value="'+p.id+'" '+(sel&&p.id==sel?'selected':'')+'>'
    +esc(p.company||'?')+' · '+esc(p.responsableName||p.responsable||'')+' · '+finFmt(+p.valueEur||0)+'</option>').join('');
}
/* ---------- SPX billing fragments — one contract, several invoices ----------
   Jesús, 24 jul: "romper los SPX en dos y que me permita linkear cada factura a cada
   fragmento". The partial-PAYMENT ledger is a different thing (instalments on ONE
   invoice); this splits the CONTRACT so each slice gets its own invoice. A contract
   with no fragments behaves exactly as before: one invoice for the whole value. */
function fragNet(fragId,exceptId){
  return DB.invoices.filter(x=>x.spxFragmentId==fragId&&x.status!=='cancelado'&&x.id!=exceptId)
    .reduce((s,x)=>s+(+x.importe_base||0),0);
}
function fragLabel(f){
  const inv=fragNet(f.id,null);
  return (f.label||'instalment')+' · '+eurF(+f.amount||0)+(f.expected?' · '+ddmmyyyy(f.expected):'')+(Math.abs(inv)>0.005?' · '+eurF(inv)+' invoiced':'');
}
function fragOpts(propId,sel){
  if(!propId)return '<option value="">— whole contract —</option>';
  const fr=DB.spxFragsFor(propId);
  if(!fr.length)return '<option value="">— whole contract (not split) —</option>';
  return '<option value="">— whole contract —</option>'+fr.map(f=>'<option value="'+f.id+'" '+(sel&&f.id==sel?'selected':'')+'>'+esc(fragLabel(f))+'</option>').join('');
}
function openFragEditor(propId,backTo){
  const p=(DB.spxProps||[]).find(x=>x.id==propId);
  if(!p){alert('Pick the contract first.');return;}
  if(!DB.spxFragsReady()){alert('Contract splitting needs dispatch_spx_fragments.sql to be run in Supabase first.');return;}
  const draw=msg=>{
    const fr=DB.spxFragsFor(propId),cVal=+p.valueEur||0;   // running totals live in foot()
    let h='<h3>✂ Split contract — '+esc(p.company||'?')+'</h3>'+
      '<p class="hint" style="margin:0 0 10px">Contract value <b>'+eurF(cVal)+'</b>. Break it into the invoices it will really be billed in '+
      '(Verdian: 6.000 € now, the rest in October). Each invoice then links to its own slice, and the SPX board shows how much of the contract is actually invoiced and collected.</p>'+
      (msg?'<div class="warn" style="margin:0 0 10px">'+esc(msg)+'</div>':'')+
      '<table><tr><th>Etiqueta</th><th style="width:110px" class="num">Importe €</th><th style="width:150px">Previsto</th><th style="width:120px">Facturado</th><th style="width:24px"></th></tr>';
    fr.forEach(f=>{const inv=fragNet(f.id,null);
      h+='<tr><td><input data-ff="label" data-id="'+f.id+'" value="'+esc(f.label||'')+'" placeholder="e.g. 1st invoice" style="width:100%"></td>'+
      '<td><input type="number" step="any" data-ff="amount" data-id="'+f.id+'" value="'+(f.amount!=null?f.amount:'')+'" style="text-align:right;width:100%"></td>'+
      '<td><input type="date" data-ff="expected" data-id="'+f.id+'" value="'+(f.expected||'')+'" style="width:100%"></td>'+
      '<td>'+(Math.abs(inv)>0.005?'<b style="color:var(--green)">'+eurF(inv)+'</b>':'<span class="hint">—</span>')+'</td>'+
      '<td><button class="del" data-fdel="'+f.id+'">×</button></td></tr>';});
    h+='</table><div id="fr_foot"></div>';
    document.getElementById('modalbody').innerHTML=h;
    document.getElementById('modal').classList.add('on');
    foot();
    /* Jesús, 28 jul: "para meter la fecha a mano, cuando escribes un número rápidamente se
       deselecciona". A native date input fires `change` the moment the three segments make a
       valid date — i.e. WHILE he is still typing — and the old handler redrew the whole table,
       destroying the input under his cursor. Only the totals below actually depend on a
       change, so only the totals are redrawn now. */
    document.querySelectorAll('[data-ff]').forEach(el=>el.onchange=()=>{
      const f=DB.spxFragById(el.dataset.id);if(!f)return;
      f[el.dataset.ff]=el.dataset.ff==='amount'?num2(el.value):el.value;
      DB.save();foot();});
    document.querySelectorAll('[data-fdel]').forEach(b=>b.onclick=()=>{
      const used=fragNet(b.dataset.fdel,null);
      if(Math.abs(used)>0.005){draw('That fragment already carries '+eurF(used)+' of invoices — unlink them first.');return;}
      DB.data.spxFrags=DB.spxFrags.filter(x=>x.id!=b.dataset.fdel);DB.save();draw('');});
  };
  /* the only part of the editor that changes as you type: the running total and the
     buttons that depend on it. Redrawn on its own so the inputs above keep their focus. */
  const foot=()=>{
    const box=document.getElementById('fr_foot');if(!box)return;
    const fr=DB.spxFragsFor(propId),cVal=+p.valueEur||0;
    const sum=fr.reduce((s,f)=>s+(+f.amount||0),0),diff=num2(cVal-sum);
    box.innerHTML='<p class="hint" style="margin:8px 0 0">Fragments total <b>'+eurF(sum)+'</b> of '+eurF(cVal)+
        (Math.abs(diff)>0.01?' — <b style="color:var(--amber)">'+eurF(Math.abs(diff))+(diff>0?' still unallocated':' over the contract value')+'</b>':' — <b style="color:var(--green)">matches ✓</b>')+'</p>'+
      '<div class="mrow"><span class="amsg" id="fr_msg"></span><button class="btn sm" id="fr_add">+ Add fragment</button>'+
        (Math.abs(diff)>0.01&&fr.length?'<button class="btn sm" id="fr_rest">+ Rest ('+eurF(diff)+')</button>':'')+
        '<button class="btn primary" id="fr_done">Done</button></div>';
    const add=amt=>{const n=DB.spxFragsFor(propId).length;
      DB.spxFrags.push({id:DB.newId(),proposalId:propId,label:(n===0?'1st invoice':n===1?'2nd invoice':(n+1)+'th invoice'),
        amount:num2(amt),expected:null,notes:null,sort:n});
      DB.save();draw('');};
    const a=document.getElementById('fr_add');if(a)a.onclick=()=>add(fr.length?0:cVal);
    const r=document.getElementById('fr_rest');if(r)r.onclick=()=>add(diff);
    document.getElementById('fr_done').onclick=()=>{closeModal();if(backTo)backTo();else render();};
  };
  draw('');
}

/* build editable line rows from an invoice's stored allocs (legacy rows get qty=1, price=amount) */
function rowsFromInvoice(inv){
  return DB.allocsFor(inv.id).map(a=>{let cid=a.codigoId,cod=a.codigo;
    if(!cid&&a.eventId!=null&&a.eventId!==''){const m=DB.codigoForEvent(a.eventId);if(m){cid=m.id;cod=cod||m.codigo;}}
    const qty=(a.qty!=null&&a.qty!=='')?+a.qty:1;
    const price=(a.price!=null&&a.price!=='')?+a.price:num2((+a.amount||0)/(qty||1));
    return {id:a.id,producto:lineProd(a,inv),tipo_pase:a.tipo_pase||(isTicketProd(lineProd(a,inv))?(inv.tipo_pase||''):''),
      qty:qty,price:price,codigoId:cid||'',codigo:cod||'',eventId:a.eventId,passes:a.passes!=null?a.passes:''};});
}
function blankRow(){return {id:null,producto:'',tipo_pase:'',qty:1,price:'',codigoId:'',codigo:'',eventId:'',passes:''};}

function renderLines(){
  /* retired items stay selectable only where they are already in use, so history edits
     never lose their código while new lines only see the live list */
  const itemOpts=sel=>'<option value="">— item —</option>'+codsForPicker(sel).map(c=>'<option value="'+c.id+'" '+(c.id==sel?'selected':'')+'>'+esc(codLabel(c))+(c.archived?' · retired':'')+'</option>').join('');
  const prodOpts=sel=>'<option value="">—</option>'+PRODUCTOS.filter(p=>p!=='abono').map(p=>'<option value="'+p+'" '+(p===sel?'selected':'')+'>'+PRODUCTO_LABEL[p]+'</option>').join('');
  const paseOpts=sel=>'<option value="">—</option>'+Object.keys(TIPO_PASES).map(t=>'<option value="'+t+'" '+(t===sel?'selected':'')+'>'+t.charAt(0).toUpperCase()+t.slice(1)+' ('+TIPO_PASES[t]+')</option>').join('');

/* net from the lines; VAT/total off the accounting base (EUR — manual when USD) */
function calcTotals(){
  const usd=document.getElementById('m_usd').checked;
  const net=num2(allocRows.reduce((s,r)=>s+lineAmount(r),0));
  const baseEur=usd?(+document.getElementById('m_eur').value||0):net;
  const pct=+document.getElementById('m_iva').value||0;
  return {usd,net,baseEur,iva:num2(baseEur*pct/100),tot:num2(baseEur*(1+pct/100))};
}

/* ---------- split-payment ledger (inside the invoice modal) ---------- */
const PM_LABEL={tarjeta:'Tarjeta',transferencia:'Transferencia',abono:'Abono',na:'N/D'};
/* re-derive the invoice's status / collected / stamp from its payment rows */
function syncInvoiceFromPayments(invId){
  const inv=DB.invoice(invId);if(!inv)return;
  if(inv.status==='abono'||inv.status==='cancelado')return; // credit notes / cancelled aren't governed by the ledger
  const ps=DB.paymentsFor(invId);
  const total=+inv.total_factura||0,paid=num2(ps.reduce((s,p)=>s+(+p.importe||0),0));
  const last=ps.slice().sort((a,b)=>(''+(a.fecha||'')).localeCompare(''+(b.fecha||''))).pop();
  inv.importe_cobrado=ps.length?paid:null;
  inv.status=ps.length?((total>0&&paid+0.005>=total)?'pagado':'no_pagado'):inv.status;
  inv.fecha_cobro=(inv.status==='pagado'&&last)?last.fecha:(ps.length?null:inv.fecha_cobro);
  if(last&&last.metodo)inv.metodo_pago=last.metodo;
}

async function saveInvoice(){
  const $=id=>document.getElementById(id),msg=$('m_msg');
  const err=t=>{msg.style.color='var(--red)';msg.textContent=t;};
  const num=$('m_num').value.trim(),st=$('m_st').value;
  if(!num)return err('Falta el nº de factura.');
  if(!$('m_rs').value.trim())return err('Falta la razón social.');
  const lines=allocRows.filter(lineHasData);
  if(!lines.length)return err('The invoice needs at least one line (product · qty · price).');
  if(lines.some(r=>!r.producto))return err('Every line needs a product.');
  /* analítica: every line MUST have an item (código contable) — mandatory */
  if(lines.some(r=>!r.codigoId))return err('Every line needs an item / código contable — it is mandatory.');
  const fecha=$('m_fecha').value;
  if(!fecha)return err('Date is missing.');
  /* duplicate invoice numbers are BLOCKED WITHIN THE SAME YEAR DRAWER (Jesús, 23 jul):
     each year runs its own sequence, so 2027 may legitimately restart at R1 without
     colliding with 2026's R1. Cross-year duplicates are a warning, not a block. */
  const numYear=fecha.slice(0,4);
  if(DB.invoices.some(x=>x.id!=editingId&&invYearOf(x)===numYear&&(x.numero_factura||'').trim().toLowerCase()===num.toLowerCase()))
    return err('Invoice nº '+num+' ya existe en '+numYear+' — los duplicados están bloqueados dentro del año.');
  const yr=+fecha.slice(0,4);
  if(yr>new Date().getFullYear())return err('The date cannot go beyond the current year.');
  if(yr<2020)return err('That date looks wrong ('+fecha.slice(0,4)+') — check the year.');
  /* A6: a due date before the invoice date is now blocked */
  if($('m_venc').value&&$('m_venc').value<fecha)return err('The due date cannot be before the invoice date.');
  if($('m_iva').value==='0'&&!$('m_motivo').value)return err('0% VAT: choose the reason (exempt / not subject / reverse charge / export).');
  const esAbono=(st==='abono');
  /* abonos must start with R (own sequence — use “+ Abono” to get the next one) */
  if(esAbono&&!num.toUpperCase().startsWith('R'))return err('A credit note must start with R (e.g. '+nextRNumber(numYear)+').');
  if(!esAbono&&looksLikeRNumber(num))return err('R-numbers are reserved for credit notes.');
  /* A7: SPX & upgrade invoices must carry their contract — enforced on NEW invoices ONLY.
     Imported/historical rows predate the link, and blocking their save locked Jesús out of
     correcting them at all (HERBERT SMITH 20260373, 23 jul: "no puedo corregirlo porque me
     pide linkear el SPX"). Unlinked old rows stay visible via the amber "link contract"
     button in the table, so nothing is silently lost. */
  const needsSpx=lines.some(r=>r.producto==='sponsorship'||r.producto==='upgrade');
  if(needsSpx&&!$('m_spx').value&&!esAbono&&!editingId)
    return err('Sponsorship / upgrade invoices must be linked to their SPX contract — pick it under Contract.');
  const t=calcTotals();
  if(t.usd&&$('m_eur').value==='')return err('Facturada en USD: escribe el importe final en EUR para contabilidad en la caja de totales.');
  /* credit notes are stored NEGATIVE — everywhere downstream (Money, KPIs, Excel) sums
     them, so a positive abono would double-count revenue instead of reversing it. */
  if(esAbono&&t.net>0){
    allocRows.forEach(r=>{if((+r.price||0)>0)r.price=-Math.abs(+r.price);if((+r.passes||0)>0)r.passes=-Math.abs(+r.passes);});
    renderLines();
  }
  const t2=calcTotals();
  const baseEur=esAbono&&t2.baseEur>0?-Math.abs(t2.baseEur):t2.baseEur;
  /* invoice-level product, derived from the lines (legacy filters + the SPX crosswalk read it) */
  const lineProds=lines.map(r=>r.producto);
  const producto=esAbono?'abono':(lineProds.includes('sponsorship')?'sponsorship':lineProds.includes('upgrade')?'upgrade':lineProds.includes('tickets')?'tickets':lineProds[0]);
  stashDraft();   /* from here the network is involved — the draft survives any failure */
  const prev=editingId?Object.assign({},DB.invoice(editingId)):null;
  const row={
    id:editingId||DB.newId(),
    codigo_contable:(DB.codigoById(+lines[0].codigoId)||{}).codigo||null,
    producto,cantidad:null,
    tipo_pase:null,pase_cantidad:null,
    fecha,numero_factura:num,
    pedido:$('m_pedido').value.trim()||'N/A',
    vencimiento:$('m_venc').value||fecha,
    responsable_comercial:prev?prev.responsable_comercial:null, /* A10: field gone, legacy data preserved */
    spxProposalId:needsSpx&&$('m_spx').value?+$('m_spx').value:(prev?prev.spxProposalId:null),
    /* the fragment only survives while its contract does — re-pointing an invoice at
       another contract must not leave it linked to the old one's instalment */
    spxFragmentId:(needsSpx&&$('m_spx').value&&$('m_frag').value)?+$('m_frag').value:null,
    razon_social:$('m_rs').value.trim(),importe_base:baseEur,
    en_usd:t2.usd,
    importe_usd:t2.usd?(esAbono?-Math.abs(t2.net):t2.net):null,
    usd_rate:null,usd_rate_date:null,
    iva_pct:+$('m_iva').value,iva_motivo:$('m_iva').value==='0'?$('m_motivo').value:null,
    iva_importe:num2(baseEur*(+$('m_iva').value)/100),total_factura:num2(baseEur*(1+(+$('m_iva').value)/100)),
    descuento_pct:$('m_dto').value===''?null:+$('m_dto').value,
    status:st,
    fecha_cobro:st==='pagado'?((prev&&prev.fecha_cobro)||todayISO()):null,
    importe_cobrado:prev?(prev.importe_cobrado!=null?prev.importe_cobrado:null):null,
    metodo_pago:$('m_pago').value,
    comentarios:$('m_com').value.trim(),
    abono_de:esAbono&&$('m_abde').value?+$('m_abde').value:null,
    entered_by:$('m_by').value.trim()||actorName(),
  };
  if(editingId){const old=DB.invoice(editingId);Object.assign(old,row);}
  else DB.invoices.push(row);
  /* an edit can change the total (add a line, fix a price) — a fully-paid invoice may
     no longer be fully paid. Re-derive status from the payments ledger when one exists. */
  syncInvoiceFromPayments(row.id);
  /* sync allocations: update kept rows, add new, drop removed */
  const keep={};
  lines.forEach(a=>{
    const c=DB.codigoById(+a.codigoId)||{};
    const evId=(c.eventId!=null&&c.eventId!=='')?+c.eventId:null; // RENMAD item → feeds the € Dashboard; Webinars/ATA/etc → null
    const codStr=c.codigo||a.codigo||'';
    const vals={eventId:evId,amount:lineAmount(a)||(+a.amount||0),passes:+a.passes||0,codigo:codStr,codigoId:+a.codigoId,
      producto:a.producto||null,tipo_pase:isTicketProd(a.producto)?(a.tipo_pase||null):null,
      qty:a.qty===''||a.qty==null?null:+a.qty,price:a.price===''||a.price==null?null:+a.price};
    if(a.id){const ex=DB.invoiceAllocs.find(x=>x.id==a.id);if(ex){Object.assign(ex,vals);keep[ex.id]=1;return;}}
    const na=Object.assign({id:DB.newId(),invoice_id:row.id},vals);
    DB.invoiceAllocs.push(na);keep[na.id]=1;
  });
  DB.data.invalloc=DB.invoiceAllocs.filter(x=>x.invoice_id!=row.id||keep[x.id]);
  /* C2: a TOTAL credit note cancels its invoice automatically — the only road to Cancelled */
  let cancelledOriginal=null;
  if(esAbono&&row.abono_de){
    const orig=DB.invoice(row.abono_de);
    if(orig&&orig.status!=='cancelado'&&Math.abs(Math.abs(baseEur)-Math.abs(+orig.importe_base||0))<=0.01){
      orig.status='cancelado';orig.fecha_cobro=null;cancelledOriginal=orig.numero_factura;
    }
  }
  syncDelegates(row);
  /* audit Critical 3: WAIT for the database before telling anyone it saved */
  const btn=$('m_save');btn.disabled=true;btn.textContent='Saving…';msg.style.color='var(--muted)';msg.textContent='Saving…';
  const ok=await DB.saveNow();
  btn.disabled=false;btn.textContent='Save';
  if(!ok){err('Could not save — your draft is kept.');return;}
  clearDraft();
  closeModal();render();
  if(cancelledOriginal)alert('Invoice '+cancelledOriginal+' queda Cancelada — cubierta por este abono total '+num+'.');
}

/* ---------- C1: + Abono — pick invoice → total or partial → auto-negative draft ---------- */
/* The invoice a credit note reverses is picked from ONE YEAR's drawer, not from all
   660 invoices at once (Jesús, 23 jul: "el listado va a ser infinito"). Default = the
   year tab you are standing on; the one documented exception — a credit note that
   cancels LAST year's invoice — is opened deliberately with the checkbox. */
function creditYear(){return (flt.year&&flt.year!=='all')?flt.year:curYear();}
function cnCandidates(year){
  return DB.invoices.filter(i=>i.status!=='cancelado'&&i.status!=='abono'&&i.producto!=='abono'&&invYearOf(i)===year)
    .sort((a,b)=>((b.fecha||'').localeCompare(a.fecha||'')));
}
function cnOptsHtml(year,q){
  const t=(q||'').trim().toLowerCase();
  const list=cnCandidates(year).filter(x=>!t||[x.numero_factura,x.razon_social,x.pedido].join(' ').toLowerCase().includes(t));
  if(!list.length)return '<option value="">— no invoices in '+year+(t?' matching that search':'')+' —</option>';
  return '<option value="">—</option>'+list.map(x=>'<option value="'+x.id+'">'+esc(x.numero_factura||('#'+x.id))+' · '+esc(x.razon_social||'')+' · '+eurF(x.importe_base)+'</option>').join('');
}

    '<div class="mrow"><span class="amsg" id="cn_msg"></span><button class="btn" id="cn_cancel">Cancelar</button><button class="btn primary" id="cn_go">Create draft →</button></div>';
  document.getElementById('modal').classList.add('on');
  const $=id=>document.getElementById(id);
  const refill=()=>{const y=$('cn_prev').checked?yPrev:yNow;
    $('cn_inv').innerHTML=cnOptsHtml(y,$('cn_q').value);
    $('cn_ylab').textContent='— '+y+' drawer';};
  $('cn_prev').onchange=refill;
  $('cn_q').oninput=refill;

    const inv=DB.invoice($('cn_inv').value);
    if(!inv){$('cn_msg').style.color='var(--red)';$('cn_msg').textContent='Elige la factura a abonar.';return;}
    const total=$('cn_type').value==='total';
    const origNet=Math.abs(+inv.importe_base||0);
    let credit=total?origNet:Math.abs(+$('cn_amt').value||0);
    if(!credit){$('cn_msg').style.color='var(--red)';$('cn_msg').textContent='Enter the net amount to credit.';return;}
    if(credit>origNet+0.01){$('cn_msg').style.color='var(--red)';$('cn_msg').textContent='That is more than the invoice net ('+eurF(origNet)+').';return;}
    const ratio=origNet?credit/origNet:1;
    /* proportional lines, negated — then fully editable (Jesús Q8) */
    const lines=rowsFromInvoice(inv).map(r=>{
      const q=+r.qty||1;
      const scaledAmt=num2(lineAmount(r)*ratio);
      return Object.assign({},r,{id:null,price:-num2(scaledAmt/q),passes:-(Math.round((+r.passes||0)*ratio)),amount:-scaledAmt});
    }).filter(r=>lineAmount(r)!==0||(+r.passes||0)!==0);
    /* price = amount/qty rounds per line, so with odd qtys the note can drift cents off
       the promised credit — enough to miss the 0,01 auto-cancel tolerance on a TOTAL
       note. Fold the remainder into the last line's price (unrounded: qty×price is
       re-rounded downstream, so the line amount lands exactly). */
    if(lines.length){
      const sum=lines.reduce((s,r)=>s+lineAmount(r),0);        // negative
      const rem=num2(-credit-sum);
      if(Math.abs(rem)>0.001){const L=lines[lines.length-1];const q=+L.qty||1;L.price=(+L.price)+rem/q;L.amount=num2((+L.qty||0)*L.price);}
    }
    openModal(null,{title:'New credit note for '+esc(inv.numero_factura||''),lines,fields:{
      numero_factura:nextRNumber(),fecha:todayISO(),vencimiento:todayISO(),
      razon_social:inv.razon_social,pedido:inv.pedido,en_usd:!!inv.en_usd,
      importe_base:inv.en_usd?-num2(credit):'',
      iva_pct:inv.iva_pct!=null?inv.iva_pct:21,iva_motivo:inv.iva_motivo||'',
      status:'abono',metodo_pago:'abono',abono_de:inv.id,spxProposalId:inv.spxProposalId||'',spxFragmentId:inv.spxFragmentId||'',
      comentarios:(total?'Total':'Partial')+' credit note for '+(inv.numero_factura||'')}});
  };
}

/* tickets & sponsorship: top the event's delegate rows up to each line's pass count
   (never duplicates on re-save; extra rows are left alone — remove them on the event page). */
function syncDelegates(inv){
  if(inv.status==='cancelado'||inv.status==='abono')return;
  if(!(isTicketProd(inv.producto)||inv.producto==='sponsorship'))return;
  const src=isTicketProd(inv.producto)?'ticket':'sponsor';
  /* passes are summed PER EVENT first: two analítica lines on the same event (e.g. stand +
     extra passes) used to top up to the max of the two instead of the total. */
  const wantByEvent={};
  DB.allocsFor(inv.id).forEach(a=>{
    if(a.eventId==null||a.eventId==='')return; // non-event item (Webinars/ATA/…) → no delegate seats
    wantByEvent[a.eventId]=(wantByEvent[a.eventId]||0)+(+a.passes||0);
  });
  Object.keys(wantByEvent).forEach(evId=>{
    const want=wantByEvent[evId];if(want<=0)return;
    const have=DB.delegates.filter(d=>d.invoice_id==inv.id&&d.eventId==evId).length;
    for(let k=have;k<want;k++){
      DB.delegates.push({id:DB.newId(),eventId:+evId,source:src,invoice_id:inv.id,
        sponsor_name:src==='sponsor'?(inv.razon_social||''):null,
        name:'',email:'',company:src==='ticket'?(inv.razon_social||''):'',job_title:'',
        seller:inv.responsable_comercial||null,crm_tagged:false,materials_sent:false,
        added_by:'invoicing · '+(inv.entered_by||''),notes:''});
    }
  });
}

/* ---------- ⬆ Cargar histórico: Jesús's Excel template → historical invoices ----------
   ONE template covers simple AND multi-line invoices: each row is one analítica line;
   rows sharing an invoice nº merge into one invoice. Credit notes (R…) and USD invoices
   stay MANUAL — they need linking/judgement and history has few of them. Re-running a
   file is safe: invoice numbers that already exist are skipped, never duplicated. */
const IMP_HEADERS=['Nº factura','Fecha','Vencimiento','Razón social','Pedido','Producto','Tipo pase','Cantidad','Precio €','Código contable','IVA %','Motivo IVA 0%','Estado','Fecha cobro','Método pago','Comentarios'];
function impNorm(s){return (''+(s==null?'':s)).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');}
function impDate(v){ // Excel serial, ISO, or dd/mm/yyyy → ISO (null when unreadable)
  if(v==null||v==='')return null;
  if(typeof v==='number'&&isFinite(v))return new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000).toISOString().slice(0,10);
  const s=(''+v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(s);
  if(m){const d=+m[1],mo=+m[2];if(d<1||d>31||mo<1||mo>12)return null; // 13/25/2025-style junk must not become "valid" ISO
    const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+(''+m[2]).padStart(2,'0')+'-'+(''+m[1]).padStart(2,'0');}
  return null;
}
/* Spanish-aware number: Excel sometimes hands prices as TEXT — "9.000" is nine thousand,
   "1.234,56" is 1234.56. A plain +"9.000" silently imported 9 € (1000× off). */
function impNum(v){
  if(typeof v==='number')return v;
  const s=(''+(v==null?'':v)).trim();if(!s)return NaN;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)||/,\d+$/.test(s))return +s.replace(/\./g,'').replace(',','.');
  return +s;
}
function impProducto(v){
  const n=impNorm(v);if(!n)return null;
  for(const p of PRODUCTOS){if(p==='abono')continue;if(impNorm(p)===n||impNorm(PRODUCTO_LABEL[p]||'')===n)return p;}
  return null;
}
function impEstado(v){
  const n=impNorm(v);
  if(!n||n==='pagado'||n==='paid')return 'pagado';           // history defaults to Paid (Léeme says so)
  if(n==='nopagado'||n==='unpaid'||n==='no'||n==='pendiente')return 'no_pagado';
  return null;
}

function parseImportFile(file){
  const msg=document.getElementById('imp_msg');msg.style.color='var(--muted)';msg.textContent='Reading…';

function buildImportPreview(raw){
  const msg=document.getElementById('imp_msg'),prev=document.getElementById('imp_prev');
  /* map whatever headers the sheet has onto our keys, accent/case/space-insensitive */
  const KEY={nfactura:'num',fecha:'fecha',vencimiento:'venc',razonsocial:'rs',pedido:'pedido',producto:'prod',tipopase:'tp',cantidad:'qty',precio:'price',codigocontable:'cod',iva:'iva',motivoiva0:'motivo',estado:'st',fechacobro:'cobro',metodopago:'pago',comentarios:'com'};
  const rows=raw.map(r=>{const o={};Object.keys(r).forEach(h=>{const k=KEY[impNorm(h)];if(k)o[k]=r[h];});return o;})
    .filter(r=>impNorm(r.num)!==''); // blank lines out
  if(!rows.length){msg.style.color='var(--red)';msg.textContent='No rows found — is the sheet called "Facturas" with the template headers?';return;}
  const existing={};DB.invoices.forEach(i=>{existing[(''+(i.numero_factura||'')).trim().toLowerCase()]=1;});
  const byNum={},order=[];
  rows.forEach(r=>{const k=(''+r.num).trim();if(!byNum[k]){byNum[k]=[];order.push(k);}byNum[k].push(r);});
  const groups=[];
  order.forEach(num=>{
    const rs=byNum[num],first=rs[0],errs=[],warns=[];
    if(/^R\d+$/i.test(num)){groups.push({num,skip:'credit note — enter by hand',rows:rs});return;}
    if(existing[num.toLowerCase()]){groups.push({num,skip:'already exists — skipped',rows:rs});return;}
    const fecha=impDate(first.fecha);
    if(!fecha)errs.push('unreadable date "'+first.fecha+'"');
    else{const y=+fecha.slice(0,4);if(y<2020||y>new Date().getFullYear())errs.push('date year '+y+' out of range');}
    const razon=(''+(first.rs||'')).trim();if(!razon)errs.push('missing razón social');
    const st=impEstado(first.st);if(!st)errs.push('unknown estado "'+first.st+'"');
    const ivaRaw=impNorm(first.iva)===''?21:impNum(first.iva);
    if(ivaRaw!==21&&ivaRaw!==0)errs.push('IVA must be 21 or 0');
    let motivo=null;
    if(ivaRaw===0){
      const mn=impNorm(first.motivo);
      /* the stored motivos are English — accept Jesús's Spanish too */
      const ES2EN={exenta:'exempt',exento:'exempt',nosujeta:'not subject',nosujeto:'not subject',isp:'reverse charge (ISP)',inversiondelsujetopasivo:'reverse charge (ISP)',inversionsujetopasivo:'reverse charge (ISP)',exportacion:'export'};
      const target=ES2EN[mn]||null;
      motivo=IVA_MOTIVOS.find(m=>impNorm(m)===mn||m===target||(mn&&impNorm(m).includes(mn)))||null;
      if(!motivo)errs.push('IVA 0% needs a valid motivo (exenta / no sujeta / ISP / exportación)');
    }
    ['fecha','rs','iva','st'].forEach(f=>{rs.slice(1).forEach(r2=>{if(impNorm(r2[f])!==''&&impNorm(r2[f])!==impNorm(first[f]))warns.push('row values for "'+f+'" differ — using the first row');});});
    const lines=[];
    rs.forEach((r,ix)=>{
      const prod=impProducto(r.prod);
      if(!prod){errs.push('line '+(ix+1)+': unknown producto "'+r.prod+'"');return;}
      const qty=impNorm(r.qty)===''?1:impNum(r.qty);
      if(!(qty>0))errs.push('line '+(ix+1)+': cantidad must be > 0');
      const price=impNum(r.price);
      if(impNorm(r.price)===''||!isFinite(price))errs.push('line '+(ix+1)+': precio unreadable ("'+r.price+'")');
      const codStr=(''+(r.cod||'')).trim();
      const c=DB.codigos.find(x=>(''+(x.codigo||'')).trim()===codStr)||DB.codigos.find(x=>impNorm(x.item)===impNorm(r.cod));
      if(!c)errs.push('line '+(ix+1)+': código "'+codStr+'" not in Items & codes');
      let tp='',passes=0;
      if(isTicketProd(prod)){tp=impNorm(r.tp);if(tp&&!TIPO_PASES[tp]){errs.push('line '+(ix+1)+': tipo pase "'+r.tp+'"?');tp='';}passes=(TIPO_PASES[tp]||0)*(qty||0);}
      lines.push({producto:prod,tipo_pase:tp||null,qty,price:num2(price),amount:num2(qty*price),passes,codigoId:c?c.id:null,codigo:c?(c.codigo||''):codStr,eventId:c&&c.eventId!=null&&c.eventId!==''?+c.eventId:null});
    });
    if(!lines.length&&!errs.length)errs.push('no readable lines');
    const net=num2(lines.reduce((a,l)=>a+l.amount,0));
    groups.push({num,rows:rs,errs,warns,lines,fecha,venc:impDate(first.venc)||fecha,razon,pedido:(''+(first.pedido||'')).trim(),
      iva:ivaRaw,motivo,st,cobro:st==='pagado'?(impDate(first.cobro)||fecha):null,
      pago:impNorm(first.pago)==='tarjeta'||impNorm(first.pago)==='card'?'tarjeta':'transferencia',
      com:(''+(first.com||'')).trim(),net,iva_imp:num2(net*ivaRaw/100),tot:num2(net*(1+ivaRaw/100))});
  });
  _impGroups=groups;
  const ready=groups.filter(g=>!g.skip&&!g.errs.length);
  let h='<table class="lntbl"><tr><th>Invoice nº</th><th>Company</th><th>Date</th><th class="num">Lines</th><th class="num">Net €</th><th class="num">Total €</th><th>Status</th><th style="min-width:220px">Result</th></tr>';
  groups.forEach(g=>{
    const res=g.skip?'<span style="color:#8a6d1a">⏭ '+esc(g.skip)+'</span>'
      :g.errs.length?'<span style="color:var(--red)">✗ '+esc(g.errs.join(' · '))+'</span>'
      :'<span style="color:var(--green)">✓ ready'+(g.warns.length?' · ⚠ '+esc(g.warns.join(' · ')):'')+'</span>';
    h+='<tr><td><b>'+esc(g.num)+'</b></td><td>'+esc(g.razon||(g.rows[0].rs||''))+'</td><td>'+(g.fecha?ddmmyyyy(g.fecha):'—')+'</td><td class="num">'+(g.lines?g.lines.length:g.rows.length)+'</td><td class="num">'+(g.net!=null?eurF(g.net):'—')+'</td><td class="num">'+(g.tot!=null?eurF(g.tot):'—')+'</td><td>'+(g.st?INV_STATUS[g.st]:'—')+'</td><td style="white-space:normal">'+res+'</td></tr>';
  });
  h+='</table>';
  prev.innerHTML=h;
  msg.style.color=ready.length?'var(--green)':'var(--red)';
  msg.textContent=ready.length+' invoice(s) ready · '+groups.filter(g=>g.skip).length+' skipped · '+groups.filter(g=>!g.skip&&g.errs.length).length+' with errors (fix the file or the Items list and re-drop)';
  const go=document.getElementById('imp_go');
  go.disabled=!ready.length;go.textContent='Import '+ready.length+' invoice'+(ready.length===1?'':'s');
  go.onclick=()=>commitImport(ready);
}
async function commitImport(ready){
  const msg=document.getElementById('imp_msg'),go=document.getElementById('imp_go');
  go.disabled=true;go.textContent='Importing…';msg.style.color='var(--muted)';msg.textContent='Writing…';
  ready.forEach(g=>{
    const lineProds=g.lines.map(l=>l.producto);
    const producto=lineProds.includes('sponsorship')?'sponsorship':lineProds.includes('upgrade')?'upgrade':lineProds.includes('tickets')?'tickets':lineProds[0];
    const row={id:DB.newId(),codigo_contable:g.lines[0].codigo||null,producto,cantidad:null,tipo_pase:null,pase_cantidad:null,
      fecha:g.fecha,numero_factura:g.num,pedido:g.pedido||'N/A',vencimiento:g.venc,
      responsable_comercial:null,spxProposalId:null,razon_social:g.razon,importe_base:g.net,
      en_usd:false,importe_usd:null,usd_rate:null,usd_rate_date:null,
      iva_pct:g.iva,iva_motivo:g.iva===0?g.motivo:null,iva_importe:g.iva_imp,total_factura:g.tot,
      descuento_pct:null,status:g.st,fecha_cobro:g.cobro,importe_cobrado:null,metodo_pago:g.pago,
      comentarios:g.com,abono_de:null,entered_by:actorName()+' · history load'};
    DB.invoices.push(row);
    g.lines.forEach(l=>DB.invoiceAllocs.push({id:DB.newId(),invoice_id:row.id,eventId:l.eventId,amount:l.amount,passes:l.passes,
      codigo:l.codigo,codigoId:l.codigoId,producto:l.producto,tipo_pase:isTicketProd(l.producto)?l.tipo_pase:null,qty:l.qty,price:l.price}));
    syncDelegates(row);
  });
  const ok=await DB.saveNow();
  if(!ok){msg.style.color='var(--red)';msg.textContent='Saved locally but the database has not confirmed yet — it will retry automatically (banner). Do not re-drop the file.';go.textContent='Import';return;}
  msg.style.color='var(--green)';msg.textContent='✓ '+ready.length+' invoice(s) imported.';
  go.textContent='Done';
  render();
  document.getElementById('imp_cancel').textContent='Close';
}

boot(render);
window.addEventListener('dc-remote',()=>{if(!document.getElementById('modal').classList.contains('on'))render();});
</script>
