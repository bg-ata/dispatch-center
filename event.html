<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>RENMAD Dispatch Center — Event</title>
<style>
  :root{--orange:#FF4A00;--charcoal:#2B2B2B;--ink:#3a3a3a;--muted:#7c7c78;--bg:#f3f2ee;--card:#fff;--line:#e3e1da;--red:#ee2233;--purple:#8E5BC9;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
  .app{padding:16px 22px 90px;max-width:1300px;margin:0 auto}
  .nav{display:flex;align-items:center;gap:3px;margin-bottom:8px}
  .nav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:12.5px;padding:5px 8px;border-radius:8px}
  .nav a.on{background:var(--orange);color:#fff}
  .nav .brandlet{margin-left:auto;font-size:13px;color:var(--muted)}
  button{font:inherit;cursor:pointer}
  .btn{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--charcoal);font-size:13px}
  .btn.primary{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:600}
  .btn.sm{padding:3px 9px;font-size:12px}
  .btn:hover{filter:brightness(.97)}
  h1{margin:6px 0 2px;font-size:22px;font-weight:700;color:var(--charcoal);display:flex;align-items:center;gap:8px}
  .chip{width:13px;height:13px;border-radius:4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .panel h3{margin:0 0 6px;font-size:15px}
  .team{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .member{display:flex;align-items:center;gap:6px;background:#f6f5f1;border:1px solid var(--line);border-radius:20px;padding:3px 5px 3px 11px;font-size:13px}
  .member b{font-weight:600} .member select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:12px;padding:2px 5px;background:#fff}
  .member .x{border:none;background:none;color:#bbb;cursor:pointer;font-size:15px} .member .x:hover{color:var(--red)}
  .addmem{display:flex;gap:6px;align-items:center}
  select,input{font:inherit}
  .hint{font-size:12px;color:var(--muted);font-weight:400}
  .tlwrap{overflow-x:auto;border:1px solid var(--line);border-radius:0;background:#fff}
  .tlflex{display:flex;align-items:stretch;border:1px solid var(--line);background:#fff;overflow:hidden}
  .tlflex .tlwrap{border:0;border-left:1px solid var(--line);flex:1 1 auto;min-width:0}
  .lanerail{position:relative;flex:0 0 142px;background:#faf9f6}
  .lanetog{position:absolute;left:0;width:142px;box-sizing:border-box;padding:3px 10px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid #eee}
  .lanetog:hover{background:#f2f0ea}
  .lanetog.exp{background:#fff;box-shadow:inset 3px 0 0 var(--orange)}
  .lanetog .nm{font-size:12.5px;font-weight:700;color:var(--charcoal);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lanetog .nm .cv{color:var(--muted);font-size:10px;flex:0 0 auto;transition:transform .12s}
  .lanetog .sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
  .lanetog .ct{font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap}
  .tl{position:relative}
  .thd{border-bottom:1px solid var(--line);background:#faf9f6}
  .mo{position:absolute;top:2px;font-size:11px;font-weight:600;color:var(--charcoal);border-left:1px solid var(--line);padding-left:4px;height:15px}
  .wn{position:absolute;top:18px;font-size:9px;color:#a9a79f;text-align:center;border-left:1px solid #eee}
  .ll{position:absolute;left:4px;font-size:9px;font-weight:800;color:#b4b1a8;z-index:2}
  .stg{position:absolute;border-radius:0;overflow:hidden;z-index:2}
  .stglab{position:absolute;font-size:11px;font-weight:700;color:#43414d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:15px;z-index:11;pointer-events:none}
  .rb{position:absolute;border:none;background:rgba(255,255,255,.85);color:#222;font-size:11px;font-weight:800;padding:0;cursor:pointer;border-radius:0;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
  .rb:hover{background:#fff}
  .subpill{position:absolute;border-radius:0;font-size:11px;color:#2b2b2b;font-weight:600;padding:0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;user-select:none;border:1px solid rgba(0,0,0,.25)}
  .subpill:active{cursor:grabbing}
  .subpill.sel{outline:2px solid var(--charcoal);outline-offset:-1px;font-weight:700}
  .subpill.open{white-space:normal;line-height:1.16;display:flex;align-items:center;padding:3px 22px 3px 10px;overflow:hidden;border-radius:5px;font-size:11.5px}
  .pb{position:absolute;height:17px;width:12px;border:none;background:rgba(255,255,255,.85);color:#222;font-size:11px;font-weight:800;line-height:15px;text-align:center;padding:0;cursor:pointer;z-index:12;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
  .pb:hover{background:#fff}
  .addsub{position:absolute;height:17px;border:1px dashed #c9c6bd;background:#fff;color:#8a887f;font-size:9px;border-radius:0;padding:0 6px;cursor:pointer;z-index:6}
  .addsub:hover{border-color:var(--orange);color:var(--orange)}
  .colband{position:absolute;z-index:4;opacity:.34;cursor:grab}
  .colchip{position:absolute;height:14px;z-index:8;color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;border-radius:0;cursor:grab;user-select:none;box-shadow:0 0 0 1px #fff}
  .colchip .x{margin-left:3px;background:rgba(255,255,255,.9);color:#333;border-radius:50%;width:11px;height:11px;line-height:10px;text-align:center;font-size:9px;cursor:pointer}
  .today{position:absolute;z-index:7;width:2px;background:var(--orange)}
  .todaylab{position:absolute;z-index:9;background:var(--orange);color:#fff;font-size:8px;font-weight:800;padding:0 4px;border-radius:2px;top:1px}
  .etabs{display:flex;gap:4px;margin:2px 0 14px;border-bottom:2px solid var(--line)}
  .etabs button{border:none;background:none;padding:7px 15px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
  .etabs button.on{color:var(--charcoal);border-bottom-color:var(--orange)}
  .cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .cardk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:120px}
  .cardk .v{font-size:18px;font-weight:800;color:var(--charcoal);font-variant-numeric:tabular-nums}
  .cardk .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .etbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .etbl th,.etbl td{text-align:right;padding:5px 8px;border-bottom:1px solid #f0eee9;font-variant-numeric:tabular-nums}
  .etbl th{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px}
  .etbl td:first-child,.etbl th:first-child,.etbl td:nth-child(2),.etbl th:nth-child(2){text-align:left}
  .etbl tr.now td{background:#FFF3E8}
  .neg{color:#D32230}.pos{color:#3E8C28}
  .funrow{display:flex;gap:18px;flex-wrap:wrap}
  .funcol{flex:1 1 220px;max-width:340px}
  .funcol h4{margin:0 0 8px;font-size:13px;color:var(--charcoal)}
  .fstage{margin-bottom:7px}
  .fbar{height:26px;border-radius:4px;min-width:2%;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:11px;font-weight:700;white-space:nowrap;overflow:visible}
  .fmeta{font-size:10.5px;color:var(--muted);margin-top:1px}
  .fmeta b{color:var(--charcoal)}
  .fconv{color:var(--orange);font-weight:700}
  .subedit{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .subedit input{padding:4px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{text-align:left;padding:5px 7px;border-bottom:1px solid #eee}
  th{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px}
  td input,td select{font-size:12px;padding:3px 5px;border:1px solid var(--line);border-radius:6px;width:100%}
  td .del{border:none;background:none;color:#c9c6bd;font-size:14px;cursor:pointer}
  .empty{color:var(--muted);font-size:12px;font-style:italic;padding:4px 2px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>
<body>
<div class="app"><div id="nav"></div><div id="content"></div></div>
<script src="store.js?v=114"></script>
<script>/* not a service account page - store.js boot() sends outside logins home */ window.DC_NEEDS='proj.board';</script>
<script>
document.getElementById('nav').innerHTML=navBar('');
const id=+new URLSearchParams(location.search).get('id');
let ev=null, selSub=null, dragMk=null, dragW0=null, dragSub=null, expandedLane=null, curTab='time', delFilter='all';
/* 6 Aug 2026 — a STAGE can now be selected (click it to get its whole task list, no
   substage required) and dragged (move the whole stage earlier or later). selStage is
   {lane,key}; the two selections are exclusive — you are either looking at a stage or at
   one of its substages. */
let selStage=null, dragStage=null;
let ZOOM=(parseFloat(localStorage.getItem('evZoom'))||1);
let WEEKW=Math.round(55*ZOOM), WD=WEEKW/5;
const TOPH=30, STGH=21, SUBH=21, GAP=1, LANEPAD=3;
function setZoom(z){ZOOM=Math.max(0.5,Math.min(2.6,Math.round(z*100)/100));WEEKW=Math.round(55*ZOOM);WD=WEEKW/5;try{localStorage.setItem('evZoom',ZOOM);}catch(e){}renderTimeline();const zl=document.getElementById('zLbl');if(zl)zl.textContent=Math.round(ZOOM*100)+'%';}
const LANE_LETTER={project:'PM',marketing:'MKT',sales:'SAL',logistics:'LOG'};
/* which stage covers a given week (used to colour/assign substages by position) */
function stageKeyAtWeek(lane,wk){
  const start=addDays(monday(ymd(ev.date)),-(preExtent(ev)+2)*7);
  const evIdx=Math.round((+monday(ymd(ev.date))-+start)/(7*86400000));
  const c=evIdx-wk, bars=layLane(ev,lane,evIdx);
  for(const b of bars){if(c>=b.x&&c<b.x+b.w)return b.s.key;}
  return bars.length?bars[bars.length-1].s.key:null;
}
/* substages = a shade darker than their stage: clearly a different row, same colour family */
function darken(hex,f){if(typeof hex!=='string'||hex[0]!=='#'||hex.length<7)return hex;const c=i=>Math.round(parseInt(hex.slice(i,i+2),16)*f),h=v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0');return '#'+h(c(1))+h(c(3))+h(c(5));}
function lum(hex){if(typeof hex!=='string'||hex[0]!=='#'||hex.length<7)return 1;return (0.299*parseInt(hex.slice(1,3),16)+0.587*parseInt(hex.slice(3,5),16)+0.114*parseInt(hex.slice(5,7),16))/255;}
function addSubstage(lane){
  expandedLane=lane; // opening the lane so the new item is visible
  const start=addDays(monday(ymd(ev.date)),-(preExtent(ev)+2)*7);
  const evIdx=Math.round((+monday(ymd(ev.date))-+start)/(7*86400000));
  const bars=layLane(ev,lane,evIdx);
  const subs=DB.substages.filter(s=>s.eventId==ev.id&&s.lane===lane&&s.week!=null);
  const span=1,occ=new Set();subs.forEach(s=>{const c0=evIdx-s.week,sp=Math.max(s.span||1,1);for(let k=0;k<sp;k++)occ.add(c0+k);});
  const startCol=bars[0]?bars[0].x:0;let col=startCol;
  /* a RENMAD lane runs UP TO the event week; a project's phases run PAST its start week,
     so the free-slot search has to look forward instead of stopping at W0 */
  const lastBar=bars[bars.length-1];
  const endCol=(evKind(ev)==='external'&&lastBar)?(lastBar.x+lastBar.w-1):evIdx;
  for(let c=startCol;c<=endCol;c++){let ok=true;for(let k=0;k<span;k++)if(occ.has(c+k)){ok=false;break;}if(ok){col=c;break;}}
  const wk=evIdx-col, stKey=stageKeyAtWeek(lane,wk)||(bars[0]&&bars[0].s.key), nid=DB.newId();
  DB.substages.push({id:nid,eventId:ev.id,lane,stage:stKey,name:lane==='marketing'?'Webinar':'New item',order:DB.substages.filter(s=>s.eventId==ev.id&&s.lane===lane).length,week:wk,span});
  selSub=nid;DB.save();renderTimeline();renderTasks();const f=document.getElementById('subname');if(f){f.focus();f.select();}
}
/* ---- phases of an EXTERNAL project (Cristina, 17 Jul: configure a non-RENMAD job manually) ----
   A project writes its own phases instead of inheriting Research/Prep/Scaling & co. Until it is
   touched it shows one neutral phase per lane covering its duration; the first edit materialises
   that default onto the event, so what you see is always what gets saved. */
/* who may shape the plan: RENMAD timelines stay manager-only, but an external project is
   run by whoever opened it — the server agrees (dispatch_projects_ext/_phases.sql) */
function canEditPlan(){
  const o=(typeof permOverride==='function')?permOverride(DB.currentUser,'proj.plan'):null;
  if(o&&o.edit!=null)return !!o.edit||evKind(ev)==='external';   // per-cell grant/revoke from the 🔐 panel
  return DB.canManage()||evKind(ev)==='external';
}
/* Per-LANE from 6 Aug 2026. The logistics lane belongs to logistics: everyone reads it,
   only Julián, Valeria and Belén move it. Every control on the timeline asks this instead
   of canEditPlan() so what the page offers is exactly what RLS will accept — the rule that
   keeps the diff-sync out of a retry loop. */
function canEditLane(lane){
  if(evKind(ev)==='external')return true;                  // a project's own team runs it
  if(lane==='logistics')return DB.canLogistics();
  return canEditPlan();
}
/* the Venue list and the request answers are the logistics desk's, on every event */
function canVenue(){return evKind(ev)==='external'?canEditPlan():DB.canLogistics();}
function phasesOf(lane){return evStages(ev,lane).map(s=>Object.assign({},s));}
function writePhases(lane,arr){
  ev.stages=ev.stages||{};
  evLanes(ev).forEach(l=>{if(!Array.isArray(ev.stages[l]))ev.stages[l]=phasesOf(l);}); // materialise every lane once
  ev.stages[lane]=arr;DB.save();renderPhases();renderTimeline();renderTasks();
}
function renderPhases(){
  const box=document.getElementById('phpanel');if(!box)return;   // RENMAD events: no such panel
  const locked=!!window._phaseColMissing;
  let h='<h3>Phases <span class="hint">— this project\'s own timeline: name them, colour them, set how many weeks each runs. They start on the project\'s start date and run forward.</span></h3>';
  if(locked)h+='<p class="hint" style="background:#FFF3E8;border:1px solid #F3C49B;color:#8a4a12;border-radius:9px;padding:8px 11px"><b>One-time setup:</b> the database is missing the <code>stages</code> column, so phases cannot be saved yet. Run <b>_sql/dispatch_projects_phases.sql</b> in the dispatch Supabase, then reload.</p>';
  evLanes(ev).forEach(lane=>{
    const ph=phasesOf(lane);
    h+='<div style="margin:10px 0 0"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;margin-bottom:4px">'+esc(LANE_LABEL[lane]||lane)+'</div>';
    ph.forEach((s,i)=>{
      h+='<div style="display:flex;gap:6px;align-items:center;margin-bottom:5px;flex-wrap:wrap">'+
        '<input data-phn="'+lane+'|'+s.key+'" value="'+esc(s.name)+'" '+(locked?'disabled ':'')+'style="flex:1 1 160px;min-width:0;font-size:13px">'+
        '<input type="color" data-phc="'+lane+'|'+s.key+'" value="'+esc(s.color)+'" '+(locked?'disabled ':'')+'title="Colour" style="width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:#fff">'+
        '<span style="display:inline-flex;align-items:center;gap:4px">'+
          '<button class="btn sm" data-phd="'+lane+'|'+s.key+'|-1" '+(locked?'disabled':'')+' title="one week less">−</button>'+
          '<span class="hint" style="min-width:52px;text-align:center">'+stageDur(ev,lane,s)+' wk'+(stageDur(ev,lane,s)>1?'s':'')+'</span>'+
          '<button class="btn sm" data-phd="'+lane+'|'+s.key+'|1" '+(locked?'disabled':'')+' title="one week more">+</button></span>'+
        '<button class="btn sm" data-phx="'+lane+'|'+s.key+'" '+(locked||ph.length<2?'disabled':'')+' title="'+(ph.length<2?'a lane needs at least one phase':'delete this phase')+'" style="color:#A32D2D">×</button>'+
      '</div>';
    });
    h+='<button class="btn sm" data-pha="'+lane+'" '+(locked?'disabled':'')+'>+ Add phase</button></div>';
  });
  box.innerHTML=h;
  if(locked)return;
  box.querySelectorAll('[data-phn]').forEach(inp=>inp.onchange=()=>{
    const [lane,key]=inp.dataset.phn.split('|');const arr=phasesOf(lane);
    const p=arr.find(x=>x.key===key);if(!p)return;p.name=inp.value.trim()||p.name;writePhases(lane,arr);});
  box.querySelectorAll('[data-phc]').forEach(inp=>inp.onchange=()=>{
    const [lane,key]=inp.dataset.phc.split('|');const arr=phasesOf(lane);
    const p=arr.find(x=>x.key===key);if(!p)return;p.color=inp.value;writePhases(lane,arr);});
  box.querySelectorAll('[data-phd]').forEach(b=>b.onclick=()=>{
    const [lane,key,delta]=b.dataset.phd.split('|');const arr=phasesOf(lane);
    const p=arr.find(x=>x.key===key);if(!p)return;
    ev.dur=ev.dur||{};ev.dur[lane]=ev.dur[lane]||{};
    ev.dur[lane][key]=Math.max(1,stageDur(ev,lane,p)+(+delta));
    writePhases(lane,arr);});
  box.querySelectorAll('[data-pha]').forEach(b=>b.onclick=()=>{
    const lane=b.dataset.pha,arr=phasesOf(lane);
    arr.push({key:'p'+DB.newId(),name:'Phase '+(arr.length+1),color:EXT_COLORS[lane]||'#A9CBEE',d:4,phase:'ext'});
    writePhases(lane,arr);});
  box.querySelectorAll('[data-phx]').forEach(b=>b.onclick=()=>{
    const [lane,key]=b.dataset.phx.split('|');const arr=phasesOf(lane);
    if(arr.length<2)return;
    const gone=arr.find(x=>x.key===key);
    const n=DB.substages.filter(s=>s.eventId==ev.id&&s.lane===lane&&s.stage===key).length;
    if(!confirm('Delete the phase "'+(gone?gone.name:key)+'"?'+(n?'\n\n'+n+' item'+(n>1?'s':'')+' sitting on it will move to the first phase — their tasks are not touched.':'')))return;
    const rest=arr.filter(x=>x.key!==key);
    DB.substages.forEach(s=>{if(s.eventId==ev.id&&s.lane===lane&&s.stage===key)s.stage=rest[0].key;});
    writePhases(lane,rest);});
}
function renderAddBar(){const bar=document.getElementById('addbar');if(!bar)return;
  /* RENMAD timelines stay manager-only; a project is editable by whoever runs it (RLS agrees) */
  if(!canEditPlan()){bar.style.display='none';return;}
  bar.innerHTML='<span style="font-size:12px;color:var(--muted);font-weight:600">＋ Add substage to:</span>';
  evLanes(ev).forEach(lane=>{const b=document.createElement('button');b.className='btn sm';b.textContent=LANE_LABEL[lane]||lane;b.onclick=()=>addSubstage(lane);bar.appendChild(b);});
}

function scrollToToday(){const wrap=document.querySelector('.tlwrap');if(!wrap)return;
  const start=addDays(monday(ymd(ev.date)),-(preExtent(ev)+2)*7);
  const todayIdx=Math.round((+monday(new Date())-+start)/(7*86400000));
  wrap.scrollLeft=Math.max(0,todayIdx*WEEKW-6);}
boot(()=>{ev=DB.event(id);const C=document.getElementById('content');
  if(!ev){C.innerHTML='<p>Event not found. <a href="gantt.html">Back to overview</a></p>';return;}render();scrollToToday();});
window.addEventListener('dc-remote',()=>{if(!DB.event(id)){location.href='gantt.html';return;}ev=DB.event(id);render();});

function peopleOpts(sel){return '<option value="">— unassigned —</option>'+DB.people.map(p=>'<option value="'+p.id+'" '+(p.id==sel?'selected':'')+'>'+esc(p.name)+'</option>').join('');}

function render(){
  if(!ev.team)ev.team=[];
  document.getElementById('content').innerHTML=
    '<h1><span class="chip" style="background:'+(TOPICS[ev.topic]||'#999')+'"></span>'+esc(ev.name)+'</h1>'+
    '<p class="sub">'+esc(ev.city||'')+(ev.city&&ev.country?', ':'')+esc(ev.country||'')+' · '+dateRange(ev)+' &nbsp; <a href="gantt.html'+(evKind(ev)==='external'?'#external':'')+'">← overview</a> &nbsp;·&nbsp; <a href="#" id="xls">⬇ Excel</a></p>'+
    (function(){const f=DB.financeFor(ev.id);if(!f)return'';const fx=Object.assign({},f,{invoiced:DB.finInvoiced(f)});const r=finResult(fx);
      return '<p class="sub" style="margin-top:-8px">€ <a href="dashboard.html#year" style="color:inherit">Target '+finFmt(f.target)+' · Stretch '+finFmt(f.stretch)+' · Facturado '+finFmt(fx.invoiced)+
      (r?' · <b style="color:'+r.color+'">'+r.label+'</b>':'')+' · Margin '+finFmt(finMargin(fx))+'</a></p>';})()+
    '<div class="etabs"><button class="on" data-et="time">Timeline</button>'+(evKind(ev)!=='external'?'<button data-et="eur">€ Results</button>'+
      /* 6 Aug 2026 (morning): the Won gate went — an event with proposals out and nothing
         signed showed no tab at all, and Belén had to go to reporting to find who was on it.
         6 Aug 2026 (evening): the LAST gate goes too. Belén: "I want EACH of the events to
         have a tab that says SPX." Logistics should never have to wonder whether the absence
         of a tab means nothing is sold or means the tab is hidden — on a RENMAD event the
         tab is always there, and when it is empty it says so in words. (External projects
         are not sold, so they keep no SPX tab.) */
      '<button data-et="spx">💼 SPX</button>'+
      '<button data-et="imp">Impact</button><button data-et="del">Delegates</button>'+
      '<button data-et="ven">🏛 Venue</button>'+
      '<button data-et="req">🙋 Requests'+reqBadge()+'</button>':'')+'</div>'+
    '<div id="sec-time">'+
    '<div class="panel"><h3>Team</h3><div class="team" id="team"></div>'+
      '<div class="addmem"><select id="newp"></select><select id="newr">'+ROLES.map(r=>'<option>'+r+'</option>').join('')+'</select><button class="btn sm" id="addmem">+ Attach person</button></div></div>'+
    (evKind(ev)==='external'?'<div class="panel" id="phpanel"></div>':'')+
    '<div class="panel"><h3>Timeline <span class="hint">— same lanes as the overview · <b>click a lane</b> to open its substages in full · drag a substage to move · +/− to resize · click it to edit tasks</span></h3>'+
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 0 8px"><div id="addbar" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"></div>'+
      '<div style="margin-left:auto;display:flex;align-items:center;gap:5px"><span class="hint">Zoom</span><button class="btn sm" id="zOut">−</button><span id="zLbl" class="hint" style="min-width:40px;text-align:center;font-weight:600">'+Math.round(ZOOM*100)+'%</span><button class="btn sm" id="zIn">+</button></div></div>'+
      '<div class="tlflex"><div class="lanerail" id="lanerail"></div><div class="tlwrap"><div class="tl" id="tl"></div></div></div></div>'+
    '<div class="panel" id="tkpanel"></div>'+
    '</div><div id="sec-eur" style="display:none"></div><div id="sec-spx" style="display:none"></div><div id="sec-imp" style="display:none"></div><div id="sec-del" style="display:none"></div>'+
    '<div id="sec-ven" style="display:none"></div><div id="sec-req" style="display:none"></div>';
  const SECS=['time','eur','spx','imp','del','ven','req'];
  document.querySelectorAll('[data-et]').forEach(b=>b.onclick=()=>{
    curTab=b.dataset.et;
    /* hash-routed (29 Jul UX round) — keeps ?id= intact, makes tabs linkable */
    try{history.replaceState(null,'',location.pathname+location.search+'#'+curTab);}catch(e){}
    document.querySelectorAll('[data-et]').forEach(x=>x.classList.toggle('on',x===b));
    SECS.forEach(s=>{const el=document.getElementById('sec-'+s);if(el)el.style.display=(b.dataset.et===s?'':'none');});
    if(b.dataset.et==='eur')renderEuroTab();
    if(b.dataset.et==='spx')renderSpxTab();
    if(b.dataset.et==='imp')renderImpactTab();
    if(b.dataset.et==='del')renderDelegatesTab();
    if(b.dataset.et==='ven')renderVenueTab();
    if(b.dataset.et==='req')renderReqTab();
  });
  renderTeam(); renderPhases(); renderAddBar(); renderTimeline(); renderTasks(); wire();
  document.getElementById('zOut').onclick=()=>setZoom(ZOOM-0.2);
  document.getElementById('zIn').onclick=()=>setZoom(ZOOM+0.2);
  // deep link: #eur/#imp/#del opens that tab directly (29 Jul UX round)
  const hh=location.hash.replace('#','');
  if(curTab==='time'&&['eur','spx','imp','del','ven','req'].includes(hh))curTab=hh;
  // live updates (dc-remote) rebuild the page — put the user back on the tab they were on
  if(curTab!=='time'){const b=document.querySelector('[data-et="'+curTab+'"]');if(b)b.click();}
}

/* ---- 💼 SPX tab: what sales has sold, for the people who have to deliver it ----
   (Belén, 3 Aug 2026: "I want this info extrapolated into an SPX tab inside each of
   the events — so make sure the events' amounts are all clear… a list in each event
   that allows logistics and sales to exchange information easily so there is no
   mistake as to what needs to be done.")
   One row per signed contract, with the answers the Won dialog collects on the SPX
   board. Read-only here on purpose: the deal is the record and spx.html is where it
   is edited, so the two can never disagree (rulebook: one concept, one home, N views). */
function wonDeals(){try{return DB.wonDealsForEvent(ev.id)||[];}catch(e){return [];}}
/* every contract on this event, signed or not — see the note on DB.dealsForEvent */
function dealsAny(){try{return DB.dealsForEvent(ev.id)||[];}catch(e){return [];}}
function reqBadge(){try{const n=DB.reqReady()?DB.requestsOpen(ev.id).length:0;
  return n?(' <span style="background:var(--orange);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;font-weight:700">'+n+'</span>'):'';}catch(e){return '';}}
function renderSpxTab(){
  const S=document.getElementById('sec-spx');
  const deals=wonDeals();
  const money=v=>v==null?'—':new Intl.NumberFormat('es-ES',{maximumFractionDigits:0}).format(v)+' €';
  /* ---- who is selling this event (restored 6 Aug 2026) ----
     The block Belén missed: the responsables, without having to open reporting. It shows
     BEFORE anything is signed, which is the whole point — the Won-only view (v99) went
     blank exactly when an event most needs to know who is on it. */
  const open=dealsAny().filter(d=>!d.won&&!d.lost);
  let pipe='';
  if(open.length){
    const owners=[];open.forEach(d=>{if(d.owner&&owners.indexOf(d.owner)<0)owners.push(d.owner);});
    pipe='<div class="panel"><h3>In the pipeline <span class="hint">— '+open.length+' proposal'+(open.length===1?'':'s')+
      ' out · '+money(open.reduce((a,d)=>a+(+d.eur||0),0))+' on the table'+
      (owners.length?' · sold by '+esc(owners.join(', ')):'')+'</span></h3>'+
      '<p class="hint">Nothing here is committed yet — it is who is working this event and what they have offered. '+
      'It becomes a signed row below the moment sales marks it Signed on the <a href="spx.html">SPX board</a>.</p>'+
      '<div style="overflow-x:auto"><table><tr><th>Company</th><th class="num">Value</th><th>Stage</th><th>Sent</th><th>Follow-up</th><th>Sales</th></tr>'+
      open.map(d=>'<tr><td><b>'+esc(d.company)+'</b></td><td class="num">'+money(d.eur)+'</td>'+
        /* the stored stage is still 'Won'; everyone reads "Signed" (keep in sync with spx.html stageLabel) */
        '<td>'+esc(d.stage==='Won'?'Signed':(d.stage||'—'))+'</td>'+
        '<td>'+(d.sentAt?esc(ddmmyyyy(d.sentAt)):'<span class="empty">—</span>')+'</td>'+
        '<td>'+(d.followAt?esc(ddmmyyyy(d.followAt)):'<span class="empty">—</span>')+'</td>'+
        '<td>'+esc(d.owner||'')+'</td></tr>').join('')+'</table></div></div>';
  }
  if(!deals.length){
    S.innerHTML=pipe+'<div class="panel"><h3>Signed sponsors</h3><span class="empty">Nothing signed for this event yet'+
      (open.length?' — the proposals above are still out.':'. When sales signs one, it lands here with everything logistics needs to deliver it.')+
      '</span><p class="hint" style="margin-top:8px">Selling happens on the <a href="spx.html">💼 SPX board</a>.</p></div>';return;}
  const tot=deals.reduce((a,d)=>a+(+d.eur||0),0);
  const gaps=deals.filter(d=>!d.complete).length;
  const att=deals.reduce((a,d)=>a+(+d.attendeesN||0),0);
  const spk=deals.reduce((a,d)=>a+(+d.speakersN||0),0);
  const stands=deals.filter(d=>d.stand).length;
  const yn=v=>v==null?'<span class="empty">—</span>':(v?'<b>Yes</b>':'No');
  const txt=v=>v?esc(v):'<span class="empty">—</span>';
  /* money that is signed and still waiting on an invoice — same derivation as Money and
     the SPX health-check (DB.spxDealUninvoiced), so the three can never disagree */
  let pendTot=0,pendN=0;
  deals.forEach(d=>{let p=0;try{p=DB.spxDealUninvoiced(d);}catch(e){}d._pend=p;if(p>0.005){pendTot+=p;pendN++;}});
  let h=pipe+'<div class="panel"><h3>Signed sponsors <span class="hint">— '+deals.length+' contract'+(deals.length===1?'':'s')+
    ' · '+money(tot)+' committed'+(pendN?' · '+money(pendTot)+' still to invoice':'')+'</span></h3>'+
    '<p class="hint">What sales has sold and what logistics has to deliver — the same rows as the '+
    '<a href="spx.html">💼 SPX board</a> and Money → Sponsorship, read-only here so the three can never disagree. '+
    'Totals below are what the event owes its sponsors: '+
    '<b>'+att+'</b> attendee pass'+(att===1?'':'es')+' · <b>'+spk+'</b> speaker slot'+(spk===1?'':'s')+' · <b>'+stands+'</b> stand'+(stands===1?'':'s')+'.</p>';
  if(gaps)h+='<p class="hint" style="color:var(--orange)"><b>'+gaps+' contract'+(gaps===1?' is':'s are')+
    ' missing delivery details.</b> Sales fills them in on the board — until then logistics is working blind on '+(gaps===1?'it':'them')+'.</p>';
  /* where the money is, contract by contract — same derivation as the board and
     Money → Sponsorship (DB.spxAccounting), never a second opinion */
  const ACC={paid:{t:'✓ paid',c:'#3E8C28',b:'#E6F5E6'},invoiced:{t:'✓ invoiced',c:'#185FA5',b:'#E8F0FA'},
    partpaid:{t:'part paid',c:'#C77800',b:'#FFF3E0'},partial:{t:'part invoiced',c:'#C77800',b:'#FFF3E0'},
    none:{t:'not invoiced',c:'#8a8a86',b:'#F1F0EC'}};
  const accCell=d=>{const a=ACC[d.acc]||ACC.none;
    return '<span style="background:'+a.b+';color:'+a.c+';border-radius:20px;padding:2px 8px;white-space:nowrap;font-weight:600;font-size:12px">'+a.t+'</span>';};
  /* Package and "what was sold" (contents) were on the board but not here — the two
     things logistics asks first when a lanyard order lands. Added 6 Aug 2026 with the
     "still to invoice" column, so this tab now carries EVERYTHING the board holds. */
  h+='<div style="overflow-x:auto"><table>'+
    '<tr><th>Sponsor</th><th>Package</th><th class="num">Amount</th><th>Signed</th><th>Money</th>'+
    '<th class="num" title="Signed and not invoiced yet">To invoice</th>'+
    '<th>Branding</th><th class="num">Att.</th><th class="num">Spk.</th><th>Stand</th><th>Branded items</th><th>Notes for logistics</th><th>Sales</th></tr>';
  deals.forEach(d=>{
    h+='<tr'+(d.complete?'':' style="background:#FFF6EF"')+'>'+
      '<td><b>'+esc(d.company)+'</b>'+(d.contents?'<div class="hint" style="margin:0">'+esc(d.contents)+'</div>':'')+'</td>'+
      '<td>'+txt(d.packageTier)+'</td>'+
      '<td class="num">'+money(d.eur)+'</td>'+
      '<td>'+(d.signedAt?esc(ddmmyyyy(d.signedAt)):'<span class="empty">—</span>')+'</td>'+
      '<td>'+accCell(d)+'</td>'+
      '<td class="num"'+(d._pend>0.005?' style="color:#C77800;font-weight:600"':'')+'>'+(d._pend>0.005?money(d._pend):'<span class="empty">—</span>')+'</td>'+
      '<td>'+txt(d.branding)+'</td>'+
      '<td class="num">'+(d.attendeesN==null?'<span class="empty">—</span>':d.attendeesN)+'</td>'+
      '<td class="num">'+(d.speakersN==null?'<span class="empty">—</span>':d.speakersN)+'</td>'+
      '<td>'+yn(d.stand)+'</td>'+
      '<td>'+txt(d.brandedItems)+'</td>'+
      '<td>'+txt(d.notes)+'</td>'+
      '<td>'+esc(d.owner||'')+'</td></tr>';
  });
  h+='<tr style="font-weight:700;border-top:2px solid var(--line)"><td>TOTAL</td><td></td><td class="num">'+money(tot)+
    '</td><td></td><td></td><td class="num"'+(pendTot>0.005?' style="color:#C77800"':'')+'>'+(pendTot>0.005?money(pendTot):'')+'</td>'+
    '<td></td><td class="num">'+att+'</td><td class="num">'+spk+'</td><td>'+stands+'</td><td></td><td></td><td></td></tr>';
  h+='</table></div>';
  if(pendN)h+='<p class="hint" style="margin-top:8px;color:#C77800"><b>'+money(pendTot)+'</b> is signed and not invoiced yet ('+pendN+
    ' contract'+(pendN===1?'':'s')+'). Real money for the event, not yet money for accounting — it is billed in <a href="facturacion.html">🧾 Invoicing</a>.</p>';
  S.innerHTML=h+'</div>';
}
function ddmmyyyy(iso){const p=(''+iso).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:(''+iso);}

/* ================= 🏛 VENUE — what is booked for this event =================
   Valeria, 5 Aug: "un apartado donde podamos tener de manera rápida y visual lo que está
   contratado o pensamos contratar… algo simple como Item & Notes, con la categoría."
   Decided in the 6 Aug meeting: COLLAPSIBLE CATEGORIES, not tabs — with tabs you have to
   open every one to find out whether there is anything in it, most are empty, and on a big
   event a single tab would be enormous. Open them all or just the one you need.
   The venue CONTRACT is deliberately not uploaded: only the specific facts the rest of the
   team needs (rate, parking, room name, capacity). Cancellation clauses are nobody else's
   business and stay where they are.
   Everyone reads this; only logistics and Belén write it. */
let venOpen=null;   // Set of open category ids — survives a re-render
let venFiles=null;  // lazily fetched: floor plans are big, they must not ride in the snapshot
function renderVenueTab(){
  const S=document.getElementById('sec-ven');
  if(!DB.venueReady()){S.innerHTML='<div class="panel"><span class="empty">The venue list is not active yet.</span></div>';return;}
  const mg=canVenue();
  let cats=DB.venueCatsFor(ev.id);
  if(!cats.length&&mg){
    /* first open of an event: drop in the default checklist so the lines that are always
       there are already waiting. Each one deletes with a single ×. */
    const n=DB.seedVenue(ev.id);
    if(n){DB.save();cats=DB.venueCatsFor(ev.id);}
  }
  if(venOpen===null){venOpen=new Set();
    /* open whatever already has something in it — an empty category can stay shut */
    cats.forEach(c=>{if(DB.venueItemsFor(c.id).some(i=>(i.notes||'').trim()))venOpen.add(c.id);});
    if(!venOpen.size&&cats.length)venOpen.add(cats[0].id);
  }
  const filled=DB.venueItems.filter(i=>!i.deleted&&i.eventId==ev.id&&(i.notes||'').trim()).length;
  const total=DB.venueItems.filter(i=>!i.deleted&&i.eventId==ev.id).length;
  let h='<div class="panel"><h3>Venue &amp; event overview <span class="hint">— '+filled+' of '+total+' line'+(total===1?'':'s')+' filled in</span></h3>'+
    '<p class="hint">What is booked, or what we mean to book. One line per thing, a note beside it. '+
    (mg?'Add a category or an item at any time; the × removes one just as easily. '
       :'Logistics keeps this — ask them, or raise it in <a href="#" data-goreq="1">Requests</a>, and it appears here once it is confirmed. ')+
    '<b>The venue contract does not live here</b> — only the facts everyone needs.</p>';
  if(mg)h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">'+
    '<button class="btn sm" id="venAddCat">+ Add category</button>'+
    '<button class="btn sm" id="venOpenAll">Open all</button><button class="btn sm" id="venShutAll">Close all</button></div>';
  if(!cats.length)h+='<p class="empty">Nothing here yet'+(mg?'.':' — logistics has not started this event.')+'</p>';
  cats.forEach(c=>{
    const items=DB.venueItemsFor(c.id);
    const got=items.filter(i=>(i.notes||'').trim()).length;
    const op=venOpen.has(c.id);
    h+='<div style="border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden">'+
      '<div class="vencat" data-cat="'+c.id+'" style="display:flex;align-items:center;gap:8px;padding:9px 12px;background:#f6f5f1;cursor:pointer">'+
        '<span style="color:var(--orange);font-weight:700">'+(op?'▾':'▸')+'</span>'+
        '<b style="flex:1">'+esc(c.name)+'</b>'+
        '<span class="hint">'+got+'/'+items.length+'</span>'+
        (mg?'<button class="del" data-delcat="'+c.id+'" title="Remove this category and its lines">×</button>':'')+
      '</div>';
    if(op){
      h+='<table style="margin:0"><tr><th>Item</th><th>Notes</th>'+(mg?'<th style="width:24px"></th>':'')+'</tr>';
      if(!items.length)h+='<tr><td colspan="'+(mg?3:2)+'" class="empty">Nothing in this category yet.</td></tr>';
      items.forEach(i=>{h+='<tr>'+
        '<td>'+(mg?'<input data-vf="item" data-id="'+i.id+'" value="'+esc(i.item||'')+'">':esc(i.item||''))+'</td>'+
        '<td>'+(mg?'<input data-vf="notes" data-id="'+i.id+'" value="'+esc(i.notes||'')+'" placeholder="e.g. 5x3m LED screen">'
                  :(i.notes?esc(i.notes):'<span class="empty">—</span>'))+
          (i.requestId?'<div class="hint">from a request</div>':'')+'</td>'+
        (mg?'<td><button class="del" data-delitem="'+i.id+'">×</button></td>':'')+'</tr>';});
      if(mg)h+='<tr><td colspan="'+(mg?3:2)+'"><button class="btn sm" data-additem="'+c.id+'">+ Add item</button></td></tr>';
      h+='</table>';
    }
    h+='</div>';
  });
  h+='</div>';
  /* floor plans — the one thing they DO want to hang here */
  h+='<div class="panel"><h3>Floor plan &amp; room images</h3>'+
     '<p class="hint">The room layout, so everyone can see it without asking for the file.</p>'+
     '<div id="venFiles"><span class="empty">Loading…</span></div>'+
     (mg?'<div style="margin-top:10px"><input type="file" id="venUp" accept="image/*" style="font-size:13px"> <span class="hint">images only — they are downscaled before they are stored</span></div>':'')+
     '</div>';
  S.innerHTML=h;

  S.querySelectorAll('.vencat').forEach(d=>d.onclick=e=>{
    if(e.target.closest('[data-delcat]'))return;
    const id=+d.dataset.cat;if(venOpen.has(id))venOpen.delete(id);else venOpen.add(id);renderVenueTab();});
  const ac=document.getElementById('venAddCat');
  if(ac)ac.onclick=()=>{const n=prompt('New category name');if(!n||!n.trim())return;
    const c=DB.addVenueCat(ev.id,n.trim());venOpen.add(c.id);DB.save();renderVenueTab();};
  const oa=document.getElementById('venOpenAll');if(oa)oa.onclick=()=>{DB.venueCatsFor(ev.id).forEach(c=>venOpen.add(c.id));renderVenueTab();};
  const sa=document.getElementById('venShutAll');if(sa)sa.onclick=()=>{venOpen.clear();renderVenueTab();};
  S.querySelectorAll('[data-additem]').forEach(b=>b.onclick=()=>{DB.addVenueItem(ev.id,+b.dataset.additem,'','',null);DB.save();renderVenueTab();});
  S.querySelectorAll('[data-vf]').forEach(el=>el.onchange=()=>{
    const row=DB.venueItems.find(i=>i.id==el.dataset.id);if(!row)return;
    row[el.dataset.vf]=el.value;DB.save();});
  S.querySelectorAll('[data-delitem]').forEach(b=>b.onclick=()=>{
    DB.data.venueItems=DB.venueItems.filter(i=>i.id!=b.dataset.delitem);DB.save();renderVenueTab();});
  S.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const id=+b.dataset.delcat,n=DB.venueItemsFor(id).length;
    if(!confirm('Remove this category'+(n?' and its '+n+' line'+(n===1?'':'s'):'')+'? (recoverable from the audit log)'))return;
    DB.data.venueItems=DB.venueItems.filter(i=>i.catId!=id);
    DB.data.venueCats=DB.venueCats.filter(c=>c.id!=id);DB.save();renderVenueTab();});
  const gr=S.querySelector('[data-goreq]');if(gr)gr.onclick=e=>{e.preventDefault();const b=document.querySelector('[data-et="req"]');if(b)b.click();};
  renderVenueFiles();
  const up=document.getElementById('venUp');if(up)up.onchange=()=>uploadVenueFile(up.files&&up.files[0]);
}
/* floor plans live in their own table and are fetched on demand — a 400 KB room layout
   must never ride along in the snapshot every page boot reads */
async function renderVenueFiles(){
  const box=document.getElementById('venFiles');if(!box)return;
  if(venFiles===null){
    if(!USE_SUPABASE){venFiles=[];}
    else{try{const r=await sb.from('dc_venue_files').select('*').eq('deleted',false).eq('eventId',ev.id).order('id');
      if(r.error)throw r.error;venFiles=r.data||[];}
      catch(e){box.innerHTML='<span class="empty">Could not load the images: '+esc(e.message||e)+'</span>';return;}}
  }
  const mg=canVenue();
  if(!venFiles.length){box.innerHTML='<span class="empty">No floor plan yet'+(mg?' — add one below.':'.')+'</span>';return;}
  box.innerHTML=venFiles.map(f=>'<figure style="display:inline-block;margin:0 12px 12px 0;vertical-align:top;max-width:340px">'+
    '<a href="'+f.data+'" target="_blank" rel="noopener"><img src="'+f.data+'" alt="'+esc(f.name||'floor plan')+'" style="max-width:340px;border:1px solid var(--line);border-radius:8px;display:block"></a>'+
    '<figcaption class="hint" style="margin-top:4px">'+esc(f.name||'')+
      (mg?' · <a href="#" data-delfile="'+f.id+'" style="color:#A32D2D">remove</a>':'')+'</figcaption></figure>').join('');
  box.querySelectorAll('[data-delfile]').forEach(a=>a.onclick=async e=>{e.preventDefault();
    if(!confirm('Remove this image?'))return;
    const id=+a.dataset.delfile;
    try{if(USE_SUPABASE){const r=await sb.from('dc_venue_files').update({deleted:true}).eq('id',id);if(r.error)throw r.error;}
      venFiles=venFiles.filter(f=>f.id!==id);renderVenueFiles();}
    catch(err){alert('Could not remove it: '+(err.message||err));}});
}
/* ================= 🙋 REQUESTS — ask logistics for something =================
   The flow agreed on 6 Aug: someone asks ("a room for the sponsor workshop, with a TV"),
   logistics answers IN THE TICKET with the quote (which room, capacity 50 in classroom
   layout, it has a screen, it costs X, held until <date>), the conversation stays on the
   record, and when it is confirmed the item moves into the event's Venue list. Closing a
   ticket keeps it as history — nothing is deleted.
   Belén's rule, and the reason this exists at all: "si no está ahí, no está pedido."
   possibleSponsor is her addition: most of these come from an interested sponsor, so
   somebody IS going to pay — the real question is whether it can be done and what it costs.
   Deliberately NOT an approve/reject pair: Valeria asked for an open answer box, because
   the answer is a quote, not a verdict. */
let reqOpen=null;   // which ticket's thread is unfolded
function renderReqTab(){
  const S=document.getElementById('sec-req');
  if(!DB.reqReady()){S.innerHTML='<div class="panel"><span class="empty">The request box is not active yet.</span></div>';return;}
  const me=DB.currentUser, desk=DB.canLogistics();
  const rows=DB.requestsFor(ev.id);
  const open=rows.filter(r=>r.status==='open'||r.status==='answered');
  const settled=rows.filter(r=>r.status!=='open'&&r.status!=='answered');
  let h='<div class="panel"><h3>Requests to logistics <span class="hint">— '+open.length+' still open'+
      (settled.length?(' · '+settled.length+' settled'):'')+'</span></h3>'+
    '<p class="hint">Ask for anything this event needs and logistics answers here with what it is, what it costs and how long it is held for. '+
    'When it is confirmed the line lands in <a href="#" data-goven="1">Venue</a>. <b>If it is not here, it is not asked for</b> — no side deals.</p>'+
    '<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;background:#faf9f6">'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start">'+
      '<input id="rqTitle" placeholder="What do you need? e.g. Room for the sponsor workshop" style="flex:1 1 320px">'+
      '<select id="rqCat" style="flex:0 0 auto">'+['Venue','AV','Materials & branding','Tech','Suppliers','Other']
        .map(c=>'<option>'+c+'</option>').join('')+'</select>'+
      '</div>'+
      '<textarea id="rqDesc" rows="2" placeholder="Anything logistics needs in order to price it — how many people, when, what it has to do" style="width:100%;margin-top:8px;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px"></textarea>'+
      '<label style="display:flex;gap:7px;align-items:center;margin-top:8px;font-size:13px;cursor:pointer">'+
        '<input type="checkbox" id="rqSponsor"> 💰 A sponsor is likely paying for this'+
        '<span class="hint">— tick it and the question becomes “can we do it and what does it cost”, not “can we afford it”</span></label>'+
      '<div style="margin-top:8px"><button class="btn primary sm" id="rqAdd">Send to logistics</button></div>'+
    '</div>';
  const card=r=>{
    const mine=me&&r.personId==me.id;
    const th=Array.isArray(r.thread)?r.thread:[];
    const unfolded=(reqOpen===r.id);
    const ST={open:{t:'waiting on logistics',c:'#C77800',b:'#FFF3E0'},answered:{t:'answered — needs confirming',c:'#185FA5',b:'#E8F0FA'},
              confirmed:{t:'✓ confirmed — it is in Venue',c:'#3E8C28',b:'#E6F5E6'},
              declined:{t:'not possible',c:'#A32D2D',b:'#FBEAEA'},closed:{t:'closed',c:'#8a8a86',b:'#F1F0EC'}};
    const s=ST[r.status]||ST.open;
    let c='<div style="border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden">'+
      '<div class="reqhead" data-req="'+r.id+'" style="display:flex;gap:9px;align-items:center;padding:10px 12px;cursor:pointer;background:'+(unfolded?'#f6f5f1':'transparent')+'">'+
        '<span style="color:var(--orange);font-weight:700">'+(unfolded?'▾':'▸')+'</span>'+
        '<b style="flex:1 1 220px">'+esc(r.title||'')+'</b>'+
        (r.possibleSponsor?'<span title="a sponsor is likely paying">💰</span>':'')+
        '<span style="background:'+s.b+';color:'+s.c+';border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap">'+s.t+'</span>'+
        '<span class="hint" style="white-space:nowrap">'+esc(DB.personName(r.personId))+(r.category?' · '+esc(r.category):'')+'</span>'+
      '</div>';
    if(unfolded){
      c+='<div style="padding:0 12px 12px">';
      if(r.description)c+='<p style="margin:2px 0 10px;white-space:pre-wrap">'+esc(r.description)+'</p>';
      if(r.reservedUntil||r.costEur!=null&&r.costEur!==''){
        c+='<p class="hint" style="margin:0 0 10px">'+
          (r.costEur!=null&&r.costEur!==''?('<b>'+finFmt(r.costEur)+'</b>'):'')+
          (r.reservedUntil?((r.costEur!=null&&r.costEur!==''?' · ':'')+'held until <b>'+deIso(r.reservedUntil)+'</b>'):'')+'</p>';
      }
      c+='<div style="max-height:240px;overflow:auto;margin-bottom:8px">'+
        (th.length?th.map(m=>'<div style="margin-bottom:7px;padding:7px 10px;border-radius:9px;background:'+(m.sys?'#f1f0ec':'#FFF3EC')+';border:1px solid '+(m.sys?'var(--line)':'#F3D9B8')+'">'+
          '<div class="hint" style="margin-bottom:2px">'+esc(m.who||'')+' · '+esc(m.when||'')+'</div>'+
          '<div style="white-space:pre-wrap'+(m.sys?';font-style:italic;color:var(--muted)':'')+'">'+esc(m.sys||m.text||'')+'</div></div>').join('')
              :'<span class="empty">No answer yet.</span>')+'</div>';
      /* the open answer box Valeria asked for — anyone in the conversation can write */
      if(desk||mine)c+='<div style="display:flex;gap:6px;margin-bottom:8px">'+
        '<input data-rqmsg="'+r.id+'" placeholder="'+(desk?'Room name, capacity, what it includes, cost, until when…':'Add anything that helps them price it…')+'" style="flex:1">'+
        '<button class="btn sm" data-rqsend="'+r.id+'">Reply</button></div>';
      if(desk){
        c+='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:9px">'+
          '<span class="hint">Quote:</span>'+
          '<input type="number" step="0.01" data-rqcost="'+r.id+'" value="'+(r.costEur==null?'':r.costEur)+'" placeholder="cost €" style="width:110px">'+
          '<input type="date" data-rquntil="'+r.id+'" value="'+(r.reservedUntil||'')+'" title="held until">'+
          '<select data-rqcat="'+r.id+'">'+DB.venueCatsFor(ev.id).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select>'+
          (r.status==='confirmed'?'<span class="hint">✓ already on the venue list</span>'
            :'<button class="btn primary sm" data-rqok="'+r.id+'">Confirm → add to Venue</button>')+
          (r.status==='declined'?'':'<button class="btn sm" data-rqno="'+r.id+'" style="color:#A32D2D;border-color:#f0c4c4">Not possible</button>')+
          '</div>';
      }
      if(mine&&!desk&&(r.status==='open'||r.status==='answered'))
        c+='<div style="margin-top:8px"><button class="btn sm" data-rqclose="'+r.id+'">Cancel this request</button></div>';
      c+='</div>';
    }
    return c+'</div>';
  };
  h+=open.length?open.map(card).join(''):'<p class="empty">Nothing open — everything asked for has been settled.</p>';
  if(settled.length)h+='<h3 style="margin:18px 0 8px;font-size:13px">Settled <span class="hint">— kept as history, nothing is deleted</span></h3>'+settled.map(card).join('');
  S.innerHTML=h+'</div>';

  const gv=S.querySelector('[data-goven]');if(gv)gv.onclick=e=>{e.preventDefault();const b=document.querySelector('[data-et="ven"]');if(b)b.click();};
  S.querySelectorAll('.reqhead').forEach(d=>d.onclick=()=>{const id=+d.dataset.req;reqOpen=(reqOpen===id?null:id);renderReqTab();});
  const add=document.getElementById('rqAdd');
  if(add)add.onclick=async()=>{
    const t=(document.getElementById('rqTitle').value||'').trim();
    if(!t){alert('Say what you need — that is the whole request.');return;}
    const r={id:DB.newId(),eventId:ev.id,personId:me?me.id:null,title:t,
      description:(document.getElementById('rqDesc').value||'').trim(),
      status:'open',thread:[],reservedUntil:null,
      possibleSponsor:!!document.getElementById('rqSponsor').checked,
      costEur:null,category:document.getElementById('rqCat').value,venueItemId:null,
      created:toISO(new Date())+' '+nowHMS().slice(0,5)};
    reqLog(r,'asked by '+((me&&me.name)||'someone'));
    DB.data.requests=DB.requests.concat([r]);
    await DB.saveNow();
    reqNotify(r,'New request on '+ev.name+': '+t);
    await DB.saveNow();
    reqOpen=r.id;renderReqTab();render();   // the tab badge changes too
  };
  S.querySelectorAll('[data-rqsend]').forEach(b=>b.onclick=async()=>{
    const r=DB.requests.find(x=>x.id==b.dataset.rqsend);
    const inp=S.querySelector('[data-rqmsg="'+b.dataset.rqsend+'"]');
    const txt=(inp&&inp.value||'').trim();if(!r||!txt)return;
    reqLog(r,null,txt);
    if(desk&&r.status==='open')r.status='answered';
    await DB.saveNow();
    reqNotify(r,(desk?'Logistics answered':'A note was added to')+' “'+r.title+'” on '+ev.name);
    await DB.saveNow();renderReqTab();});
  S.querySelectorAll('[data-rqcost]').forEach(el=>el.onchange=()=>{
    const r=DB.requests.find(x=>x.id==el.dataset.rqcost);if(!r)return;
    r.costEur=el.value===''?null:+el.value;DB.save();});
  S.querySelectorAll('[data-rquntil]').forEach(el=>el.onchange=()=>{
    const r=DB.requests.find(x=>x.id==el.dataset.rquntil);if(!r)return;
    r.reservedUntil=el.value||null;reqLog(r,'held until '+(el.value?deIso(el.value):'—'));DB.save();renderReqTab();});
  S.querySelectorAll('[data-rqok]').forEach(b=>b.onclick=async()=>{
    const r=DB.requests.find(x=>x.id==b.dataset.rqok);if(!r)return;
    const sel=S.querySelector('[data-rqcat="'+b.dataset.rqok+'"]');
    if(!DB.venueCatsFor(ev.id).length)DB.seedVenue(ev.id);
    DB.confirmRequest(r,sel&&sel.value?+sel.value:null);
    await DB.saveNow();
    reqNotify(r,'Confirmed on '+ev.name+': '+r.title+' — it is now on the venue list');
    await DB.saveNow();renderReqTab();render();});
  S.querySelectorAll('[data-rqno]').forEach(b=>b.onclick=async()=>{
    const r=DB.requests.find(x=>x.id==b.dataset.rqno);if(!r)return;
    const why=prompt('Why not? The person who asked will see this.');if(why===null)return;
    r.status='declined';reqLog(r,'not possible',why||undefined);
    await DB.saveNow();
    reqNotify(r,'Not possible on '+ev.name+': '+r.title+(why?(' — '+why):''));
    await DB.saveNow();renderReqTab();render();});
  S.querySelectorAll('[data-rqclose]').forEach(b=>b.onclick=async()=>{
    const r=DB.requests.find(x=>x.id==b.dataset.rqclose);if(!r)return;
    if(!confirm('Cancel this request? It stays on the record as history.'))return;
    r.status='closed';reqLog(r,'cancelled by '+((me&&me.name)||'the requester'));
    await DB.saveNow();renderReqTab();render();});
}

async function uploadVenueFile(file){
  if(!file)return;
  const box=document.getElementById('venFiles');
  if(!/^image\//.test(file.type)){alert('Images only — a floor plan, a room photo.');return;}
  resizeImageFit(file,async data=>{
    if(!data){alert('That image could not be read.');return;}
    const row={id:DB.newId(),eventId:ev.id,name:file.name,kind:file.type,data:data,deleted:false};
    try{
      if(USE_SUPABASE){const r=await sb.from('dc_venue_files').insert([row]);if(r.error)throw r.error;}
      venFiles=(venFiles||[]).concat([row]);renderVenueFiles();
    }catch(e){alert('Could not save the image: '+(e.message||e));}
  },1400);   // wide enough to actually read a room layout
}

/* ---- € Results tab: this event's finance summary + weekly money ---- */
function evCode(){return DB.evCode(ev);} // ecode field first, legacy name prefix as fallback
function evWeekly(){const c=evCode();return c?DB.weekly.filter(r=>r.eventCode===c).sort((a,b)=>a.week-b.week):[];}
function famKey(n){return (n||'').replace(/\s*(20\d{2}|\d{2})\s*$/,'').trim();}
function renderEuroTab(){
  const S=document.getElementById('sec-eur');
  const f=DB.financeFor(ev.id),rows=evWeekly();
  let target=f&&f.target, stretch=f&&f.stretch, soFar=f&&DB.finInvoiced(f);
  rows.forEach(r=>{if(r.target!=null)target=+r.target;if(r.stretch!=null)stretch=+r.stretch;});
  const lastMoney=rows.filter(r=>r.soFarEur!=null&&+r.soFarEur>0).slice(-1)[0];
  if(lastMoney)soFar=+lastMoney.soFarEur;
  if(!f&&!rows.length){S.innerHTML='<div class="panel"><span class="empty">No financial data for this event yet — it will populate as the event advances (€ Dashboard → Add event figures, or the weekly Excel import).</span></div>';return;}
  const res=finResult({invoiced:soFar,stretch:stretch,year:ymd(ev.date).getFullYear()});
  let h='<div class="panel"><h3>€ Results so far</h3><div class="cards">'+
    '<div class="cardk"><div class="v">'+finFmt(soFar)+'</div><div class="k">So far</div></div>'+
    '<div class="cardk"><div class="v">'+finFmt(target)+'</div><div class="k">Target</div></div>'+
    '<div class="cardk"><div class="v">'+finFmt(stretch)+'</div><div class="k">Stretch</div></div>'+
    (f?'<div class="cardk"><div class="v">'+finFmt(f.spex)+'</div><div class="k">SPEX</div></div>'+
       '<div class="cardk"><div class="v">'+finFmt(finMargin(f))+'</div><div class="k">Margin</div></div>':'')+
    '<div class="cardk"><div class="v">'+(res?'<span style="color:'+res.color+'">'+res.label+'</span>':'—')+'</div><div class="k">Status</div></div>'+
    '</div>'+
    '<p class="hint" style="font-size:12px;color:var(--muted)">Full curves and comparisons live in the <a href="dashboard.html#compare">€ Dashboard</a>.</p></div>';
  const money=rows.filter(r=>(+r.totalEur||0)||(+r.soFarEur||0));
  if(money.length){
    const today=new Date().toISOString().slice(0,10);
    const isNow=r=>r.date&&r.date<=today&&addDays(ymd(r.date),7).toISOString().slice(0,10)>today;
    h+='<div class="panel"><h3>Money week by week</h3><table class="etbl"><tr><th>Week</th><th>Date</th><th>Sponsors €</th><th>Tickets €</th><th>Week total</th><th>So far</th>'+(target?'<th>vs Target</th>':'')+'</tr>';
    money.forEach(r=>{const d=target!=null&&r.soFarEur!=null?(+r.soFarEur-target):null;
      h+='<tr'+(isNow(r)?' class="now"':'')+'><td>W'+(r.week<0?r.week:'+'+r.week)+'</td><td>'+deIso(r.date||'')+'</td>'+
      '<td>'+(+r.sponsorsEur?finFmt(+r.sponsorsEur):'')+'</td><td>'+(+r.ticketsEur?finFmt(+r.ticketsEur):'')+'</td>'+
      '<td><b>'+(+r.totalEur?finFmt(+r.totalEur):'')+'</b></td><td>'+finFmt(r.soFarEur)+'</td>'+
      (target?'<td class="'+(d<0?'neg':'pos')+'">'+(d==null?'':(d>0?'+':'')+new Intl.NumberFormat('es-ES',{maximumFractionDigits:0}).format(d))+'</td>':'')+'</tr>';});
    h+='</table></div>';
  }
  S.innerHTML=h;
}
/* ---- Impact tab: this event's funnel vs previous editions ---- */
function renderImpactTab(){
  const S=document.getElementById('sec-imp');
  const rows=evWeekly();
  if(!rows.length){S.innerHTML='<div class="panel"><span class="empty">No marketing data for this event yet — it will populate as campaigns run (see the Impact area for all events).</span></div>';return;}
  const myName=rows[0].name||'',fam=famKey(myName);
  const byC={};DB.weekly.forEach(r=>{(byC[r.eventCode]=byC[r.eventCode]||[]).push(r);});
  const sibs=Object.keys(byC).filter(c=>c!==evCode()&&famKey(byC[c][0].name)===fam)
    .map(c=>({code:c,name:byC[c][0].name,rows:byC[c].sort((a,b)=>a.week-b.week)}))
    .sort((a,b)=>(a.rows[0].year||0)-(b.rows[0].year||0)).slice(-2);
  const list=[{code:evCode(),name:myName,rows:rows}].concat(sibs);
  const carry=(e,k)=>{let last=0;e.rows.forEach(r=>{if(r[k]!=null)last=+r[k];});return last;};
  const sum=(e,k)=>e.rows.reduce((a,r)=>a+(+r[k]||0),0);
  const nf=v=>new Intl.NumberFormat('es-ES').format(Math.round(v));
  const pc=(a,b)=>b>0?((100*a/b)<10?(100*a/b).toFixed(1):Math.round(100*a/b))+' %':'—';
  const cols=list.map(e=>{
    const t=carry(e,'topicLeads'),l=carry(e,'eventLeads'),d=sum(e,'delegatesN'),s=sum(e,'sponsorsN');
    return {e,stages:[
      {n:'👍 Topic leads',v:t,conv:null,lab:'',c:'#FFD3BC'},
      {n:'💰 Event leads',v:l,conv:pc(l,t),lab:'of topic leads',c:'#FFA873'},
      {n:'Ticket delegates',v:d,conv:pc(d,l),lab:'of event leads',c:'#FF7A3D'},
      {n:'Sponsors signed',v:s,conv:pc(s,l),lab:'of event leads',c:'#FF4A00'}]};
  });
  const maxTop=Math.max.apply(null,cols.map(c=>c.stages[0].v||1));
  S.innerHTML='<div class="panel"><h3>Marketing funnel — this event vs previous editions</h3>'+
    '<p class="hint" style="font-size:12px;color:var(--muted)">More marketing data will feed this over time. Full comparisons live in the <a href="impact.html">Impact area</a>.</p>'+
    '<div class="funrow">'+cols.map(c=>'<div class="funcol"><h4>'+esc(c.e.name)+'</h4>'+c.stages.map(s=>{
      const w=Math.max(1.5,100*(s.v||0)/maxTop),dark=(s.v||0)/maxTop>0.04;
      return '<div class="fstage"><div class="fbar" style="width:'+w.toFixed(1)+'%;background:'+s.c+(dark?'':';color:#8a4a12')+'">'+nf(s.v)+'</div>'+
        '<div class="fmeta"><b>'+s.n+'</b>'+(s.conv!=null?' · <span class="fconv">'+s.conv+'</span> '+s.lab:'')+'</div></div>';
    }).join('')+'</div>').join('')+'</div></div>';
}

/* ---- Delegates tab: the per-event roster (catering base + marketing lane) ----
   Rows live in dc_delegates keyed on the event's dc_finance row. Colour is DERIVED:
   white = paid · red = invoice unpaid · yellow = reserved pass with no name yet.
   Editing is gated app-side for now (SQL row-ownership hardening = follow-up):
   billing/admin = everything · Sales = sponsor-pass names · PMs/managers = speakers
   & freebies · Marketing = the ¿CRM? / materials ticks (on ALL rows). */
function canEditDelegate(d){
  if(DB.canBill())return true;
  const me=DB.currentUser;if(!me)return false;
  if(DB.canManage())return d.source!=='ticket'; // managers: sponsor/speaker/freebie details (ticket names = billing)
  if(d.source==='sponsor'&&me.role==='Sales')return true;
  if((d.source==='speaker'||d.source==='freebie')&&me.role==='PM')return true;
  return false;
}
function canTickMarketing(){const me=DB.currentUser;return !!(me&&(me.role==='Marketing'||DB.canBill()||DB.canManage()));}
function canAddSpeaker(){const me=DB.currentUser;return !!(me&&(me.role==='PM'||DB.canBill()||DB.canManage()));}
const DELSRC={ticket:'🎟️ Ticket',sponsor:'🤝 Sponsor',speaker:'🎤 Speaker',freebie:'🎁 Freebie'};
function renderDelegatesTab(){
  const S=document.getElementById('sec-del');
  if(!DB.billReady()){S.innerHTML='<div class="panel"><span class="empty">The invoicing module is not active yet — run <b>dispatch_facturacion.sql</b> in Supabase, then reload.</span></div>';return;}
  const f=DB.financeFor(ev.id);
  if(!f){S.innerHTML='<div class="panel"><span class="empty">This event has no € Dashboard row yet — link it in 💶 Money (Add event figures) first; the delegate list hangs off that row.</span></div>';return;}
  const all=DB.delegatesFor(f.id);
  const list=(delFilter==='all'?all.slice():all.filter(d=>d.source===delFilter))
    .sort((a,b)=>(a.source||'').localeCompare(b.source||'')||(a.sponsor_name||'').localeCompare(b.sponsor_name||'')||(a.id-b.id));
  const unnamed=all.filter(d=>delegateState(d).key==='unnamed').length;
  const unpaid=all.filter(d=>delegateState(d).key==='unpaid').length;
  const sponsors=[...new Set(all.filter(d=>d.source==='sponsor'&&(d.sponsor_name||'').trim()).map(d=>d.sponsor_name.trim()))];
  const mkt=canTickMarketing();
  let h='<div class="panel"><h3>Delegate list <span class="hint">— everyone in the room: ticket buyers, sponsor passes, speakers &amp; freebies. This headcount is the catering number.</span></h3>'+
    '<div class="cards">'+
    '<div class="cardk"><div class="v">'+all.length+'</div><div class="k">Headcount</div></div>'+
    Object.keys(DELSRC).map(s=>{const n=all.filter(d=>d.source===s).length;return n?'<div class="cardk"><div class="v">'+n+'</div><div class="k">'+DELSRC[s].slice(3)+'s</div></div>':'';}).join('')+
    (unnamed?'<div class="cardk" style="background:#FFF3C4"><div class="v">'+unnamed+'</div><div class="k">Names missing</div></div>':'')+
    (unpaid?'<div class="cardk" style="background:#F8D7D7"><div class="v">'+unpaid+'</div><div class="k">Invoice unpaid</div></div>':'')+
    '</div>'+
    (sponsors.length?'<p class="hint" style="margin:0 0 10px"><b>Sponsors:</b> '+sponsors.map(esc).join(' · ')+'</p>':'')+
    '<div class="subedit"><span class="hint">Show:</span><select id="delflt">'+
      ['all','ticket','sponsor','speaker','freebie'].map(s=>'<option value="'+s+'" '+(delFilter===s?'selected':'')+'>'+(s==='all'?'Everyone':DELSRC[s])+'</option>').join('')+'</select>'+
    '<button class="btn sm" id="del_xls" title="Download the full delegate list (the catering list for the venue)">⬇ Excel</button>'+
    '<span class="hint" style="margin-left:auto">⬜ paid · <span style="background:#F8D7D7;padding:0 5px;border-radius:3px">invoice unpaid</span> · <span style="background:#FFF3C4;padding:0 5px;border-radius:3px">name missing</span></span></div>'+
    '<table><tr><th>Type</th><th>Sponsor</th><th>Name</th><th>Email</th><th>Company</th><th>Job title</th><th>Sold by</th><th title="Araceli: tagged right in the CRM">CRM?</th><th title="Araceli: info emails sent on payment">Materials</th><th>Notes</th><th style="width:24px"></th></tr>';
  if(!list.length)h+='<tr><td colspan="11" class="empty">No delegates yet — ticket &amp; sponsor passes appear automatically when Invoicing registers an invoice'+(canAddSpeaker()?'; speakers &amp; freebies you can add below.':'.')+'</td></tr>';
  list.forEach(d=>{
    const st=delegateState(d), can=canEditDelegate(d);
    const cell=(fld,ph)=>can?('<input data-df="'+fld+'" data-id="'+d.id+'" value="'+esc(d[fld]||'')+'" placeholder="'+(ph||'')+'">'):esc(d[fld]||'');
    const tick=fld=>'<input type="checkbox" data-dt="'+fld+'" data-id="'+d.id+'" '+(d[fld]?'checked':'')+(mkt?'':' disabled')+' style="width:auto">';
    h+='<tr style="background:'+st.bg+'" '+(st.label?'title="'+st.label+'"':'')+'>'+
      '<td style="white-space:nowrap">'+(DELSRC[d.source]||d.source||'')+(d.invoice_id?' <a href="facturacion.html" class="hint" title="from invoice '+esc((DB.invoice(d.invoice_id)||{}).numero_factura||'')+'">🧾</a>':'')+'</td>'+
      '<td>'+(d.source==='sponsor'?cell('sponsor_name'):esc(d.sponsor_name||''))+'</td>'+

      '<td>'+esc(d.seller?DB.personName(d.seller):((DB.invoice(d.invoice_id)||{}).responsable_comercial?DB.personName(DB.invoice(d.invoice_id).responsable_comercial):'—'))+'</td>'+

      '<select id="nd_src">'+srcs.map(s=>'<option value="'+s+'">'+DELSRC[s]+'</option>').join('')+'</select>'+
      '<input id="nd_name" placeholder="name" style="width:150px"><input id="nd_email" placeholder="email" style="width:170px">'+
      '<input id="nd_co" placeholder="company" style="width:140px"><input id="nd_job" placeholder="job title" style="width:130px">'+
      '<button class="btn sm primary" id="nd_add">Add</button></div>';
  }
  h+='</div>';
  S.innerHTML=h;
  document.getElementById('delflt').onchange=e=>{delFilter=e.target.value;renderDelegatesTab();};
  document.getElementById('del_xls').onclick=()=>{
    const rows=all.slice()
      .sort((a,b)=>(a.source||'').localeCompare(b.source||'')||(a.sponsor_name||'').localeCompare(b.sponsor_name||'')||(a.id-b.id))
      .map(d=>({
        'Type':(DELSRC[d.source]||d.source||'').replace(/^[^A-Za-z]*/,''),
        'Sponsor':d.sponsor_name||'',
        'Name':d.name||'',
        'Email':d.email||'',
        'Company':d.company||'',
        'Job title':d.job_title||'',
        'Sold by':d.seller?DB.personName(d.seller):((DB.invoice(d.invoice_id)||{}).responsable_comercial?DB.personName(DB.invoice(d.invoice_id).responsable_comercial):''),
        'CRM':d.crm_tagged?'✓':'',
        'Materials':d.materials_sent?'✓':'',
        'Notes':d.notes||'',
        'State':delegateState(d).key
      }));
    exportXLSX(ev.name.replace(/[^\w]+/g,'_')+'_delegates.xlsx',[{name:'Delegates',rows}]);
  };
  S.querySelectorAll('[data-df]').forEach(el=>el.onchange=()=>{const d=DB.delegates.find(x=>x.id==el.dataset.id);if(!d)return;d[el.dataset.df]=el.value;DB.save();});
  S.querySelectorAll('[data-dt]').forEach(el=>el.onchange=()=>{const d=DB.delegates.find(x=>x.id==el.dataset.id);if(!d)return;d[el.dataset.dt]=el.checked;DB.save();});
  S.querySelectorAll('[data-deldel]').forEach(b=>b.onclick=()=>{const d=DB.delegates.find(x=>x.id==b.dataset.deldel);
    if(!confirm('Remove '+((d&&d.name)||'this row')+' from the delegate list? (recoverable from the audit log)'))return;
    DB.data.delegates=DB.delegates.filter(x=>x.id!=b.dataset.deldel);DB.save();renderDelegatesTab();});
  const ad=document.getElementById('nd_add');if(ad)ad.onclick=()=>{
    const me=DB.currentUser||{};
    DB.delegates.push({id:DB.newId(),eventId:f.id,source:document.getElementById('nd_src').value,invoice_id:null,
      sponsor_name:null,name:document.getElementById('nd_name').value.trim(),email:document.getElementById('nd_email').value.trim(),
      company:document.getElementById('nd_co').value.trim(),job_title:document.getElementById('nd_job').value.trim(),
      seller:null,crm_tagged:false,materials_sent:false,added_by:me.name||me.email||'',notes:''});
    DB.save();renderDelegatesTab();};
}

function renderTeam(){
  const t=document.getElementById('team');
  const mg=canEditPlan(); // members see the team read-only (but a project is theirs to run)
  t.innerHTML=ev.team.map(m=>{const p=DB.person(m.personId);if(!p)return'';
    /* names link to the person's page (29 Jul UX round — it was only reachable from the roster) */
    const nm='<a href="person.html?id='+p.id+'" style="color:inherit;text-decoration:none" title="Open '+esc((p.name||'').split(' ')[0])+'’s page — their events & tasks"><b>'+esc(p.name)+'</b></a>';
    return mg?('<span class="member">'+nm+'<select data-role="'+m.personId+'">'+ROLES.map(r=>'<option '+(r===m.role?'selected':'')+'>'+r+'</option>').join('')+'</select><button class="x" data-rm="'+m.personId+'">×</button></span>')
             :('<span class="member">'+nm+'<span class="hint">'+esc(m.role)+'</span></span>');}).join('')||'<span class="empty">No one attached yet.</span>';
  const am=document.querySelector('.addmem');if(am&&!mg){am.style.display='none';}
  if(mg){const inTeam=ev.team.map(m=>m.personId);
    document.getElementById('newp').innerHTML=DB.people.filter(p=>!inTeam.includes(p.id)).map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')||'<option value="">(all attached)</option>';}
