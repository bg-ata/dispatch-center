function subColor(sub,stageColor){return (sub.type&&MKT_TYPES[sub.type])?MKT_TYPES[sub.type]:stageColor;}

function renderTimeline(){
  const tl=document.getElementById('tl'), rail=document.getElementById('lanerail');
  const start=addDays(monday(ymd(ev.date)),-(preExtent(ev)+2)*7);
  const evIdx=Math.round((+monday(ymd(ev.date))-+start)/(7*86400000));
  const NW=preExtent(ev)+2+Math.max(6,postExtent(ev)+2), BW=NW*WEEKW; // a project reaches forward, an event does not
  const todayIdx=Math.round((+monday(new Date())-+start)/(7*86400000));
  const mg=canEditPlan();
  const OPENH=54, SUBROW=OPENH+3, COLLH=STGH+11; // expanded rows are tall so substages can hold longer text
  // a selected substage keeps its lane open
  if(selSub){const ss=DB.substages.find(s=>s.id===selSub);if(ss)expandedLane=ss.lane;}

  // ---- per-lane layout: stages always; the OPEN lane also unfolds its substages into
  //      as many rows as needed (accordion) so one topic gets the full space ----
  const laneLay=evLanes(ev).map(lane=>{ // external projects: only their chosen timelines
    const bars=layLane(ev,lane,evIdx);
    const subs=DB.substages.filter(s=>s.eventId==ev.id&&s.lane===lane);
    let dirty=false;
    // default week (spread across its stage) for any substage missing one
    const byStage={};subs.forEach(s=>{(byStage[s.stage]=byStage[s.stage]||[]).push(s);});
    Object.keys(byStage).forEach(k=>{const bar=bars.find(b=>b.s.key===k);if(!bar)return;const list=byStage[k];
      list.forEach((s,i)=>{if(s.week==null){const col=Math.round(bar.x+(i+0.5)*bar.w/list.length-0.5);s.week=evIdx-col;dirty=true;}});});
    // default span for any substage missing one: wide enough to read the name
    const arr0=subs.map(s=>({s,c:evIdx-s.week})).sort((a,b)=>a.c-b.c);
    arr0.forEach((o,i)=>{if(o.s.span==null){const nextC=(i+1<arr0.length)?arr0[i+1].c:(evIdx+1);const gap=Math.max(1,nextC-o.c);const need=Math.max(1,Math.ceil(((o.s.name||'').length*6.6+34)/WEEKW));o.s.span=Math.min(need,gap);dirty=true;}});
    const laneMg=canEditLane(lane);
    if(dirty&&(!USE_SUPABASE||laneMg))DB.save(); // members never push layout defaults
    const expanded=(expandedLane===lane);
    // greedy pack substages into non-overlapping rows (only needed when open)
    let rows=[];
    if(expanded){
      const arr=subs.map(s=>({s,c:evIdx-s.week,span:Math.max(s.span||1,1)})).sort((a,b)=>a.c-b.c);
      arr.forEach(o=>{let placed=false;
        for(const row of rows){if(row.every(x=> o.c>=x.c+x.span || o.c+o.span<=x.c )){row.push(o);placed=true;break;}}
        if(!placed)rows.push([o]);});
    }
    const laneH=expanded?(STGH+GAP+Math.max(1,rows.length)*SUBROW+(laneMg?24:6)+2):COLLH;
    return {lane,bars,subs,expanded,rows,h:laneH};
  });
  let acc=TOPH;laneLay.forEach(L=>{L.y=acc;acc+=L.h+GAP;});
  const bodyH=acc+4;

  tl.style.cssText='width:'+BW+'px;height:'+bodyH+'px';
  let h='';
  for(let w=0;w<NW;w++){h+='<div style="position:absolute;top:'+TOPH+'px;height:'+(bodyH-TOPH)+'px;left:'+(w*WEEKW)+'px;border-left:1px solid #e3e0d8;z-index:0"></div>';
    for(let dc=1;dc<5;dc++)h+='<div style="position:absolute;top:'+TOPH+'px;height:'+(bodyH-TOPH)+'px;left:'+(w*WEEKW+dc*WD)+'px;border-left:1px solid #f2f0ea;z-index:0"></div>';}
  h+='<div class="thd" style="position:absolute;left:0;top:0;width:'+BW+'px;height:'+TOPH+'px"></div>';
  for(let w=0;w<NW;w++){const d=addDays(start,w*7);
    if(d.getDate()<=7)h+='<div class="mo" style="left:'+(w*WEEKW)+'px">'+MON[d.getMonth()]+(d.getMonth()===0?" '"+String(d.getFullYear()).slice(2):'')+'</div>';
    const diff=evIdx-w;h+='<div class="wn" style="left:'+(w*WEEKW)+'px;width:'+WEEKW+'px">'+(diff===0?'W0':diff>0?('W-'+diff):('+'+(-diff)))+'</div>';}
  if(todayIdx>=0&&todayIdx<NW)h+='<div class="todaylab" style="left:'+(todayIdx*WEEKW)+'px">TODAY</div>';
  tl.innerHTML=h;
  if(todayIdx>=0&&todayIdx<NW){const t2=document.createElement('div');t2.className='today';t2.style.cssText='left:'+(todayIdx*WEEKW)+'px;top:'+TOPH+'px;height:'+(bodyH-TOPH)+'px';tl.appendChild(t2);}

  const btnLayer=document.createElement('div');btnLayer.style.cssText='position:absolute;inset:0;z-index:9;pointer-events:none';tl.appendChild(btnLayer);
  /* stage resize. It writes the width to the stage's OWN row (dc_stages) rather than to
     ev.dur, because dc_events is manager-only writable and logistics has to be able to
     stretch its own stages — Julián is a member. ev.dur stays readable as the legacy
     default via stageDur(). */
  function addBtn(x,y,lane,key,delta,label){const b=document.createElement('button');b.className='rb';b.textContent=label;
    b.style.cssText='left:'+x+'px;top:'+y+'px;width:13px;height:'+STGH+'px;pointer-events:auto';
    b.title=(delta<0?'shorten ':'lengthen ')+stageName(lane,key,ev);
    b.onmousedown=e=>e.stopPropagation();   // resizing is not dragging the stage
    b.onclick=e=>{e.stopPropagation();
      const def=stageDef(lane,key,ev),cur=def?stageDur(ev,lane,def):1;
      let want=Math.max(1,cur+delta);
      /* growing a stage must not shove the ones after it past the event: a T-minus lane
         ends on W0, and a stage rendered after the event is just wrong */
      if(delta>0&&def&&def.phase==='pre'){
        const bars=layLane(ev,lane,evIdx),pre=bars.filter(b=>b.s.phase==='pre');
        const i=pre.findIndex(b=>b.s.key===key);
        if(i>=0){let after=0;for(let k=i+1;k<pre.length;k++)after+=pre[k].w;
          const room=evIdx-after-pre[i].x;
          if(want>room){alert('“'+stageName(lane,key,ev)+'” cannot grow any further without pushing '+
            (i+1<pre.length?('“'+stageName(lane,pre[i+1].s.key,ev)+'” and the stages after it'):'this lane')+
            ' past the event. Shorten one of those first.');return;}}
      }
      const row=DB.stageLayRow(ev.id,lane,key);row.dur=want;
      /* the launch milestone rides on the scaling stage — only a manager can write it */
      if(lane==='project'&&key==='scaling'&&canEditPlan())ev.milestones.launch=row.dur;
      DB.save();renderTimeline();};
    btnLayer.appendChild(b);}
  function stageAtCol(bars,c){for(const b of bars){if(c>=b.x&&c<b.x+b.w)return b.s;}return bars[bars.length-1].s;}

  laneLay.forEach(L=>{
    const lane=L.lane, y=L.y;
    const ll=document.createElement('div');ll.className='ll';ll.style.top=(y+2)+'px';ll.textContent=LANE_LETTER[lane];tl.appendChild(ll);
    // ---- stage bars (always shown — the overview look) ----
    const laneEdit=canEditLane(lane);
    L.bars.forEach((bar,bi)=>{
      const x=bar.x*WEEKW, w=Math.max(bar.w*WEEKW,10);
      const nm=stageName(lane,bar.s.key,ev);
      const sel=(selStage&&selStage.lane===lane&&selStage.key===bar.s.key);
      const seg=document.createElement('div');seg.className='stg';
      seg.style.cssText='left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+STGH+'px;background:'+bar.s.color+
        (sel?';outline:2px solid var(--orange);outline-offset:-2px':'')+';cursor:'+(laneEdit?'grab':'pointer');
      seg.title=nm+(laneEdit?' — drag to move the whole stage · click to see its tasks':' — click to see its tasks');
      /* the stage itself is now the handle: mousedown starts a drag, a click that never
         moved opens the task list. Same gesture the substages already use, so there is
         one thing to learn, not two. Valeria, 5 Aug: "click Materials and the task list
         unfolds, instead of a substage." */
      seg.addEventListener('mousedown',e=>{
        if(bar.s.phase!=='pre'||!laneEdit){toggleStage(lane,bar.s.key);return;}  // W0 and post-event stages are fixed to the event
        dragStage={lane,key:bar.s.key,startX:e.clientX,dx:0,el:seg,lab:null,bars:L.bars,idx:bi,evIdx:evIdx,moved:false};
        e.preventDefault();});
      tl.appendChild(seg);
      const sl=document.createElement('div');sl.className='stglab';sl.style.cssText='left:'+(x+15)+'px;top:'+(y+4)+'px;max-width:'+(w-30)+'px;color:'+(bar.s.color==='#111111'?'#fff':'#3a3844')+';pointer-events:none';sl.textContent=nm;tl.appendChild(sl);
      if(dragStage&&dragStage.lane===lane&&dragStage.key===bar.s.key)dragStage.lab=sl;
      if(laneEdit){addBtn(x,y,lane,bar.s.key,-1,'−'); addBtn(x+w-13,y,lane,bar.s.key,1,'+');}
    });
    // ---- substages: only the OPEN lane unfolds them, packed into rows for room ----
    if(L.expanded){
      const sy0=y+STGH+GAP;
      L.rows.forEach((row,ri)=>{const sy=sy0+ri*SUBROW;
        row.forEach(o=>{
          const sub=o.s, span=o.span, c=o.c, st=stageAtCol(L.bars,c);
          const x=c*WEEKW+2, pw=span*WEEKW-4;
          const fill=darken(subColor(sub,st.color),0.78);
          const pill=document.createElement('div');pill.className='subpill open'+(selSub===sub.id?' sel':'');
          pill.style.cssText='left:'+x+'px;top:'+sy+'px;width:'+pw+'px;height:'+(OPENH-4)+'px;background:'+fill+';color:'+(lum(fill)<0.5?'#fff':'#2b2b2b')+';z-index:10';
          pill.textContent=sub.name;pill.title=sub.name+(laneEdit?' — drag to move · +/− to resize · click to edit tasks':' — click to see tasks');
          pill.addEventListener('mousedown',e=>{
            e.stopPropagation();   // a substage sits on top of its stage — do not start a stage drag too
            if(!laneEdit){selStage=null;selSub=(selSub===sub.id?null:sub.id);renderTimeline();renderTasks();return;} // members: click opens tasks, no dragging (server would refuse the move)
            dragSub={sub,startX:e.clientX,dx:0,el:pill,baseWeek:sub.week,moved:false};e.preventDefault();});
          tl.appendChild(pill);
          if(laneEdit){const rb=(left,label,delta,tip)=>{const b=document.createElement('button');b.className='pb';b.textContent=label;b.style.cssText='left:'+left+'px;top:'+sy+'px;height:'+(OPENH-4)+'px;line-height:'+(OPENH-8)+'px';b.title=tip+' '+sub.name;
            b.addEventListener('mousedown',e=>e.stopPropagation());
            b.onclick=e=>{e.stopPropagation();let ns=Math.max(1,(sub.span||1)+delta);
              if(delta>0)ns=Math.min(ns,Math.max(1,evIdx-c+1)); // rows resolve overlaps, so grow up to the event edge
              sub.span=ns;DB.save();renderTimeline();if(selSub===sub.id)renderTasks();};tl.appendChild(b);};
            rb(x,'−',-1,'shorten'); rb(x+pw-12,'+',1,'lengthen');}
        });
      });
      if(laneEdit){const ax=((L.bars[0]?L.bars[0].x:0)*WEEKW)+2, ay=sy0+Math.max(1,L.rows.length)*SUBROW;
        const ab=document.createElement('button');ab.className='addsub';ab.textContent='+ add item';
        ab.style.cssText='left:'+ax+'px;top:'+ay+'px;height:17px;z-index:8';
        ab.onmousedown=e=>e.stopPropagation();
        ab.onclick=e=>{e.stopPropagation();addSubstage(lane);};tl.appendChild(ab);}
    }
  });

  const colTop=TOPH, colH=bodyH-TOPH;
  function col(off,label,color,kind,field){
    const x=(evIdx-off)*WEEKW;
    const band=document.createElement('div');band.className='colband';band.style.cssText='left:'+x+'px;width:'+WEEKW+'px;top:'+colTop+'px;height:'+colH+'px;background:'+color;tl.appendChild(band);
    const chip=document.createElement('div');chip.className='colchip';chip.style.cssText='left:'+x+'px;width:'+WEEKW+'px;top:'+(TOPH-16)+'px;background:'+color;
    chip.innerHTML='<span style="pointer-events:none">'+label+'</span>'+(kind==='ld'?'<span class="x" title="remove">×</span>':'');
    chip.title=label+' (W-'+off+')'+(mg?(kind==='w0'?' — drag to reschedule':' — drag to move'):'');
    const st=e=>{if(!mg)return; // members can't move milestones/W0 (server would refuse)
      if(e.target.classList.contains('x'))return;if(kind==='w0')dragW0={ev,startX:e.clientX,dx:0,band,chip};else dragMk={ev,field,kind,startX:e.clientX,dx:0,band,chip};e.preventDefault();};
    chip.addEventListener('mousedown',st);band.addEventListener('mousedown',st);
    const xb=chip.querySelector('.x');if(xb)xb.onclick=ev2=>{ev2.stopPropagation();ev.alerts.LD.on=false;DB.save();renderTimeline();};
    tl.appendChild(chip);
  }
  if(evKind(ev)!=='external'){ // milestone + discount-week machinery is RENMAD-only
    col(ev.milestones.goNoGo,'G','var(--red)','mile','goNoGo');
    col(ev.milestones.launch,'L','var(--red)','mile','launch');
    if(ev.alerts.LD.on) col(ev.alerts.LD.off,'LD','var(--purple)','ld','LD');
    col(ev.alerts.SE.off,'SE','var(--purple)','alert','SE');
    col(ev.alerts.EB.off,'EB','var(--purple)','alert','EB');
    col(ev.alerts.LC.off,'LC','var(--purple)','alert','LC');
  }
  col(0,'W0','#111','w0','');

  // ---- left rail: clickable lane toggles (accordion) ----
  rail.style.height=bodyH+'px';
  rail.innerHTML='<div style="position:absolute;left:0;top:0;width:100%;height:'+TOPH+'px;font-size:9px;color:#b4b1a8;padding:2px 10px;font-weight:700">TIMELINES</div>';
  laneLay.forEach(L=>{
    const t=document.createElement('div');t.className='lanetog'+(L.expanded?' exp':'');
    t.style.cssText='top:'+L.y+'px;height:'+L.h+'px';
    const col0=(L.bars[0]&&L.bars[0].s.color)||'#ccc', n=L.subs.length;
    t.innerHTML='<div class="nm"><span class="cv">'+(L.expanded?'▾':'▸')+'</span><span class="sw" style="background:'+col0+'"></span>'+(LANE_LABEL[L.lane]||L.lane)+'</div>'+
      '<div class="ct">'+(L.expanded?(n+' item'+(n===1?'':'s')+' · open'):(n?(n+' item'+(n===1?'':'s')+' — open'):'no items — '+(mg?'click to add':'empty')))+'</div>';
    t.onclick=()=>{const nl=(expandedLane===L.lane?null:L.lane);
      const ss=selSub&&DB.substages.find(s=>s.id===selSub);
      if(!ss||ss.lane!==nl){selSub=null;renderTasks();} // switching/closing a lane deselects a substage not in it
      if(selStage&&selStage.lane!==nl){selStage=null;renderTasks();}
      expandedLane=nl;renderTimeline();};
    rail.appendChild(t);
  });
}

/* ---- one task row, used by both the stage list and the substage list ----
   Columns as Valeria wrote the example: Lanyards > deadline > @Julián @Cintia > "logo Huawei".
   NOTES are editable by whoever can tick the status — the person doing the task is the one
   who knows what to write, and the database guard agrees (dc_task_guard leaves notes out
   of its deny-list on purpose). */
function taskRow(t,mg,showWhere){
  const canS=DB.canEditStatus(t);
  const who=DB.taskPeople(t);
  const sub=t.substageId?DB.substages.find(s=>s.id==t.substageId):null;
  const st=taskStatus(t);
  return '<tr'+(taskCancelled(t)?' style="opacity:.55"':'')+'>'+
    '<td>'+(mg?'<input data-tf="title" data-id="'+t.id+'" value="'+esc(t.title||'')+'">':esc(t.title||''))+
      (st==='Assigned'?' <span class="dctl-new">NEW</span>':'')+
      (showWhere?'<div class="hint" style="margin-top:2px">'+(sub?esc(sub.name||'item'):'directly on the stage')+'</div>':'')+
      (taskCancelled(t)&&t.cancelReason?'<div class="hint">cancelled — '+esc(t.cancelReason)+'</div>':'')+'</td>'+
    '<td>'+(mg?('<div class="whobox" data-who="'+t.id+'">'+peopleChecks(t)+'</div>')
              :(who.length?who.map(id=>'<a href="person.html?id='+id+'" style="color:inherit">'+esc(DB.personName(id))+'</a>').join(', ')
                          :'<span class="empty">—</span>'))+'</td>'+
    '<td>'+(mg?'<input type="date" data-tf="deadline" data-id="'+t.id+'" value="'+(t.deadline||'')+'">':(t.deadline?deIso(t.deadline):'—'))+'</td>'+
    '<td>'+(canS?('<input data-tf="notes" data-id="'+t.id+'" value="'+esc(t.notes||'')+'" placeholder="short note">')
                :(t.notes?esc(t.notes):'<span class="empty">—</span>'))+'</td>'+
    '<td>'+(canS?('<select data-tf="status" data-id="'+t.id+'">'+STATUS.map(s=>'<option '+(s===st?'selected':'')+'>'+s+'</option>').join('')+'</select>')
                :('<span class="rostat" style="font-size:12px;color:#6f6e6a">'+esc(st)+'</span>'))+'</td>'+
    '<td style="white-space:nowrap">'+
      '<button class="dctl-hist" data-dtlhist="'+t.id+'" title="Who changed this, and when">🕘</button>'+
      (mg?'<button class="del" data-deltask="'+t.id+'">×</button>':'')+'</td></tr>';
}
/* several owners per task. A dropdown cannot hold two names, so the cell is the primary
   owner plus a "+ more" pop-out of tick boxes; the first person ticked stays the primary
   one, because that is the field every alarm, digest and person page already reads. */
function peopleChecks(t){
  const who=DB.taskPeople(t);
  const names=who.map(id=>esc(DB.personName(id))).join(', ');
  return '<button class="btn sm whobtn" data-whobtn="'+t.id+'" style="max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
    (names||'— assign —')+' ▾</button>';
}
function taskHeadRow(mg){
  return '<tr><th>Task</th><th style="width:190px">Responsible</th><th style="width:140px">Deadline</th>'+
    '<th style="width:170px">Notes</th><th style="width:120px">Status'+
    (mg?'':' <span style="text-transform:none;letter-spacing:0;color:#b4b1a8">· you can tick your own</span>')+'</th><th style="width:24px"></th></tr>';
}
function renderTasks(){
  const p=document.getElementById('tkpanel');
  if(selStage)return renderStageTasks(p);
  if(!selSub){p.innerHTML='<span class="empty">Click a <b>stage</b> in the timeline to see and add its tasks, or open a lane and click one of its items.</span>';return;}
  const sub=DB.substages.find(s=>s.id===selSub);
  if(!sub){selSub=null;p.innerHTML='';return;}
  const tks=DB.tasksForSub(sub.id);
  const mg=canEditLane(sub.lane); // the lane's owners edit everything; everyone else ticks the status of their OWN tasks
  let h='<div class="subedit"><b style="color:var(--muted);font-size:11px;text-transform:uppercase">'+esc(stageName(sub.lane,sub.stage,ev))+'</b>'+
    (mg?'<input id="subname" value="'+esc(sub.name||'')+'" placeholder="Name / short description — type as much as you need" style="width:min(560px,100%);flex:1 1 320px">'
       :'<span style="font-weight:600">'+esc(sub.name||'')+'</span>');
  if(sub.lane==='marketing'){h+=mg?('<select id="subtype">'+['','Content','Product','Sales','Webinar'].map(t=>'<option '+(t===(sub.type||'')?'selected':'')+'>'+(t||'— type —')+'</option>').join('')+'</select>')
                                 :(sub.type?'<span class="hint">'+esc(sub.type)+'</span>':'');}
  h+='<span class="hint">week W-'+(sub.week!=null?sub.week:'?')+((sub.span||1)>1?(' · '+(sub.span||1)+' wks'):'')+'</span>';
  if(mg)h+='<button class="btn sm" id="delsub" style="color:#A32D2D;border-color:#f0c4c4">Delete substage</button>'+
    '<button class="btn sm" id="addtask" style="margin-left:auto">+ Add task</button>';
  h+='</div>';
  h+='<table>'+taskHeadRow(mg);
  if(!tks.length)h+='<tr><td colspan="6" class="empty">No tasks yet'+(mg?' — add one.':'.')+'</td></tr>';
  tks.forEach(t=>{h+=taskRow(t,mg,false);});
  h+='</table>';
  h+='<p class="hint" style="margin-top:8px">This is one item inside <b>'+esc(stageName(sub.lane,sub.stage,ev))+
     '</b> — click the stage bar itself to see everything filed under it at once.</p>';
  p.innerHTML=h;
  const sn=document.getElementById('subname');if(sn)sn.onchange=e=>{sub.name=e.target.value;DB.save();renderTimeline();};
  const ts=document.getElementById('subtype');if(ts)ts.onchange=e=>{sub.type=e.target.value.startsWith('—')?'':e.target.value;DB.save();renderTimeline();};
  const ds=document.getElementById('delsub');if(ds)ds.onclick=()=>{const n=DB.tasksForSub(sub.id).length;if(!confirm('Delete this substage'+(n?' and its '+n+' task'+(n>1?'s':''):'')+'? (recoverable from the audit log)'))return;DB.data.substages=DB.substages.filter(s=>s.id!==sub.id);DB.data.tasks=DB.tasks.filter(t=>t.substageId!==sub.id);selSub=null;DB.save();renderTimeline();renderTasks();};
  const at=document.getElementById('addtask');if(at)at.onclick=()=>{newTask(sub.lane,sub.stage,sub.id);};
  wireTaskRows(p);
}
/* ---- click a STAGE: its whole task list, no substage required ----
   Valeria, 5 Aug: "si en Materiales hay 80 tareas, tener que repartirlas en 3 substages
   genera ruido visual… mejor que al dar click en Materiales se desglose la lista de tasks."
   Belén kept both: substages stay as the steps of the stage, and tasks can also hang
   straight off it. So this panel shows the flat list first, then anything filed inside a
   substage, clearly marked — one place to look, nothing hidden. */
function renderStageTasks(p){
  const {lane,key}=selStage;
  const def=stageDef(lane,key,ev);
  if(!def){selStage=null;p.innerHTML='';return;}
  const mg=canEditLane(lane);
  const flat=DB.tasksOnStage(ev.id,lane,key);
  const all=DB.tasksForStage(ev.id,lane,key);
  const nested=all.filter(t=>t.substageId!=null);
  const done=all.filter(taskDone).length;
  const st=stageStart(ev,lane,key);
  const wide=def?stageDur(ev,lane,def):1;
  let h='<div class="subedit"><b style="color:var(--muted);font-size:11px;text-transform:uppercase">'+(LANE_LABEL[lane]||lane)+'</b>'+
    (mg?'<input id="stgname" value="'+esc(stageName(lane,key,ev))+'" placeholder="Stage name" style="font-weight:700;width:min(320px,100%)">'
       :'<span style="font-weight:700;font-size:15px">'+esc(stageName(lane,key,ev))+'</span>')+
    '<span class="hint">'+(st!=null?('starts W-'+st):'follows the stage before it')+' · '+wide+' wk'+(wide===1?'':'s')+
      ' · '+all.length+' task'+(all.length===1?'':'s')+(all.length?(' · '+done+' done'):'')+'</span>';
  if(mg)h+='<button class="btn sm" id="addstagetask" style="margin-left:auto">+ Add task</button>';
  h+='</div>';
  if(mg){
    h+='<p class="hint" style="margin:-4px 0 8px">Drag the stage bar to move the whole stage earlier or later; +/− makes it wider or narrower. '+
      'Renaming it changes it <b>on this event only</b> — a new event is still created with the default names, so if a stage should '+
      'always be called something else, tell Belén and the default changes.</p>';
    /* why a drag sometimes will not go any further — better said out loud than felt as a
       dead gesture (the lesson of 30 Jul: if it is not obvious, say it) */
    if(def.phase==='pre'){
      const evIdx=evIndex(ev),bars=layLane(ev,lane,evIdx),pre=bars.filter(b=>b.s.phase==='pre');
      const i=pre.findIndex(b=>b.s.key===key);
      if(i>=0){let after=0;for(let k=i+1;k<pre.length;k++)after+=pre[k].w;
        if(evIdx-after-pre[i].w-pre[i].x<=0&&i+1<pre.length)
          h+='<p class="hint" style="margin:-4px 0 8px;color:var(--orange)">This stage cannot move any closer to the event until '+
            '<b>'+esc(stageName(lane,pre[i+1].s.key,ev))+'</b> or one of the stages after it is shortened — the lane has to finish on the event itself.</p>';}
    }
  }
  h+='<table>'+taskHeadRow(mg);
  if(!flat.length)h+='<tr><td colspan="6" class="empty">No tasks directly on this stage'+(mg?' — add one, no substage needed.':'.')+'</td></tr>';
  flat.forEach(t=>{h+=taskRow(t,mg,false);});
  h+='</table>';
  if(nested.length){
    h+='<h3 style="margin:16px 0 6px;font-size:13px">Also filed inside this stage’s items <span class="hint">— '+nested.length+' task'+(nested.length===1?'':'s')+'</span></h3>'+
      '<table>'+taskHeadRow(mg);
    nested.forEach(t=>{h+=taskRow(t,mg,true);});
    h+='</table>';
  }
  p.innerHTML=h;
  const sn=document.getElementById('stgname');
  if(sn)sn.onchange=e=>{const v=(e.target.value||'').trim();
    const row=DB.stageLayRow(ev.id,lane,key);
    row.name=v&&v!==(def?def.name:'')?v:null;   // back to blank = back to the catalogue name
    DB.save();renderTimeline();renderTasks();};
  const at=document.getElementById('addstagetask');if(at)at.onclick=()=>{newTask(lane,key,null);};
  wireTaskRows(p);
}
/* one place that makes a task, so a stage-level one and a substage one can never drift */
function newTask(lane,stage,substageId){
  /* born unowned, so it starts Pending — nothing is "assigned to" nobody (Belén's rule).
     It becomes Assigned the moment a name goes on it, via setTaskPeople(). */
  const t={id:DB.newId(),eventId:ev.id,lane:lane,stage:stage,substageId:substageId,
           title:'New task',assignee:null,assignees:[],deadline:'',status:'Pending',notes:'',cancelReason:null};
  DB.tasks.push(t);DB.save();renderTasks();
}
function wireTaskRows(p){
  p.querySelectorAll('[data-tf]').forEach(el=>el.onchange=()=>{
    const t=DB.tasks.find(x=>x.id==el.dataset.id);if(!t)return;
    if(el.dataset.tf==='status'){
      const v=el.value;
      if(v==='Cancelled'){
        /* a cancelled task with no reason is indistinguishable from work that quietly
           vanished — the same rule as denying a holiday */
        const why=prompt('Why is this cancelled? Everyone on the task will see this.');
        if(why===null||!(''+why).trim()){el.value=taskStatus(t);return;}
        cancelTask(t,why);
      }else{t.status=v;if(v!=='Cancelled')t.cancelReason=null;DB.save();}
      renderTasks();return;
    }
    let v=el.value;if(el.dataset.tf==='assignee')v=v?+v:null;
    t[el.dataset.tf]=v;DB.save();});
  p.querySelectorAll('[data-deltask]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this task? To keep it on the record instead, set it to Cancelled.'))return;DB.data.tasks=DB.tasks.filter(t=>t.id!=b.dataset.deltask);DB.save();renderTasks();});
  p.querySelectorAll('[data-whobtn]').forEach(b=>b.onclick=e=>{e.stopPropagation();openWhoPicker(b,DB.tasks.find(x=>x.id==b.dataset.whobtn));});
  p.querySelectorAll('[data-dtlhist]').forEach(b=>b.onclick=e=>{e.preventDefault();openTaskHistory(b,b.dataset.dtlhist);});
  /* opening a stage/substage panel IS the owner looking at their tasks — clears Assigned */
  try{taskSeenAll([...p.querySelectorAll('[data-tf="status"]')].map(el=>DB.tasks.find(x=>x.id==el.dataset.id)).filter(Boolean));}catch(e){}
}
/* the "several people on one task" pop-out */
function openWhoPicker(btn,t){
  if(!t)return;
  document.querySelectorAll('.whopop').forEach(x=>x.remove());
  const who=DB.taskPeople(t);
  const pop=document.createElement('div');pop.className='whopop';
  pop.style.cssText='position:absolute;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:10px;'+
    'box-shadow:0 8px 24px rgba(0,0,0,.14);padding:8px;max-height:260px;overflow:auto;min-width:210px';
  pop.innerHTML='<div class="hint" style="margin-bottom:6px">Tick everyone on this task. The first one is the main owner.</div>'+
    DB.people.filter(pp=>!pp.deleted&&!isTeamAccount(pp)).map(pp=>
      '<label style="display:flex;gap:7px;align-items:center;padding:3px 2px;cursor:pointer">'+
      '<input type="checkbox" data-wp="'+pp.id+'"'+(who.indexOf(pp.id)>=0?' checked':'')+'>'+esc(pp.name)+'</label>').join('');
  document.body.appendChild(pop);
  const r=btn.getBoundingClientRect();
  pop.style.left=Math.min(r.left+window.scrollX,window.scrollX+document.documentElement.clientWidth-pop.offsetWidth-12)+'px';
  pop.style.top=(r.bottom+window.scrollY+4)+'px';
  pop.querySelectorAll('[data-wp]').forEach(cb=>cb.onchange=()=>{
    const id=+cb.dataset.wp;
    let list=DB.taskPeople(t);
    if(cb.checked){if(list.indexOf(id)<0)list.push(id);}else list=list.filter(x=>x!==id);
    /* setTaskPeople owns the rule: a name going on a task makes it Assigned and raises
       the batched "assigned to you" message. Never set assignee/assignees by hand. */
    setTaskPeople(t,list);
    renderTasks();
    const nb=document.querySelector('[data-whobtn="'+t.id+'"]');if(nb)openWhoPicker(nb,t);
  });
  const close=e=>{if(pop.contains(e.target))return;pop.remove();document.removeEventListener('mousedown',close);};
  setTimeout(()=>document.addEventListener('mousedown',close),0);
}

/* ---------------- selecting and moving a whole STAGE (6 Aug 2026) ----------------
   Valeria: "poder mover las stages — ahora no podemos adelantar o atrasar las stages."
   Materials in particular sits much closer to the event than the five weeks the default
   template gives it. Belén's condition: stages still must not OVERLAP. Gaps are fine
   (a stage can now genuinely be "not started yet"); an overlap is not, so a drag is
   clamped between the stage before and the stage after in the same lane. */
function toggleStage(lane,key){
  const same=selStage&&selStage.lane===lane&&selStage.key===key;
  selStage=same?null:{lane:lane,key:key};
  if(selStage)selSub=null;                       // one thing selected at a time
  if(selStage&&expandedLane!==lane)expandedLane=lane;
  renderTimeline();renderTasks();
}
/* How far this stage may travel, in COLUMNS.
   BACK: only as far as the end of the stage before it — a gap opens, nothing overlaps.
   FORWARD: as far as it likes, PROVIDED everything that comes after it still fits before
   the event. Dragging Materials towards the event pushes Travel, Venue ops and Prep along
   with it and stops when the last of them reaches W0 — the stages after it are not
   silently shoved past the day the event happens. */
function stageDragLimits(d){
  const pre=d.bars.filter(b=>b.s.phase==='pre');
  const me=d.bars[d.idx], i=pre.indexOf(me);
  if(i<0)return {min:0,max:0};
  const prev=i>0?pre[i-1]:null;
  const lo=prev?(prev.x+prev.w):(me.x-52);        // no neighbour behind it: a year of room is plenty
  let after=0;for(let k=i+1;k<pre.length;k++)after+=pre[k].w;
  const hi=d.evIdx-after-me.w;                    // the last stage in the lane still ends at W0
  return {min:lo-me.x,max:Math.max(lo-me.x,hi-me.x)};
}
/* drag: milestones/discounts (mirror), W0 (reschedule), substages (move week / click to open),
   whole stages (move earlier/later, clamped so they never overlap) */
document.addEventListener('mousemove',e=>{
  if(dragStage){
    dragStage.dx=e.clientX-dragStage.startX;
    if(Math.abs(dragStage.dx)>3)dragStage.moved=true;
    const lim=stageDragLimits(dragStage);
    let cols=Math.round(dragStage.dx/WEEKW);
    cols=Math.max(lim.min,Math.min(lim.max,cols));
    dragStage.cols=cols;
    const px=cols*WEEKW;
    dragStage.el.style.transform='translateX('+px+'px)';
    if(dragStage.lab)dragStage.lab.style.transform='translateX('+px+'px)';
    return;
  }
  if(dragMk){dragMk.dx=e.clientX-dragMk.startX;const px=Math.round(dragMk.dx/WEEKW)*WEEKW;dragMk.band.style.transform='translateX('+px+'px)';dragMk.chip.style.transform='translateX('+px+'px)';}
  else if(dragW0){dragW0.dx=e.clientX-dragW0.startX;const px=Math.round(dragW0.dx/WEEKW)*WEEKW;dragW0.band.style.transform='translateX('+px+'px)';dragW0.chip.style.transform='translateX('+px+'px)';}
  else if(dragSub){dragSub.dx=e.clientX-dragSub.startX;if(Math.abs(dragSub.dx)>3)dragSub.moved=true;dragSub.el.style.transform='translateX('+(Math.round(dragSub.dx/WEEKW)*WEEKW)+'px)';}
});
document.addEventListener('mouseup',()=>{
  if(dragStage){
    const d=dragStage;dragStage=null;
    if(d.moved&&d.cols){
      const me=d.bars[d.idx];
      /* stored as weeks BEFORE the event, which is how every other position on this
         board is stored — so it survives the event being rescheduled */
      const row=DB.stageLayRow(ev.id,d.lane,d.key);
      row.start=d.evIdx-(me.x+d.cols);
      if(row.dur==null){const def=stageDef(d.lane,d.key,ev);row.dur=def?stageDur(ev,d.lane,def):me.w;}
      DB.save();
    }else if(!d.moved){toggleStage(d.lane,d.key);return;}
    renderTimeline();renderTasks();return;
  }
  if(dragMk){const wks=Math.round((dragMk.dx||0)/WEEKW);if(wks){dragMk.ev.milestones&&dragMk.kind==='mile'?(dragMk.ev.milestones[dragMk.field]=Math.max(0,dragMk.ev.milestones[dragMk.field]-wks)):(dragMk.ev.alerts[dragMk.field].off=Math.max(0,dragMk.ev.alerts[dragMk.field].off-wks));if(dragMk.field==='launch'){const off=dragMk.ev.milestones.launch;dragMk.ev.dur.project.scaling=Math.max(1,off);dragMk.ev.dur.marketing.onmarket=Math.max(1,off);}DB.save();}dragMk=null;renderTimeline();}
  else if(dragW0){const wks=Math.round((dragW0.dx||0)/WEEKW);if(wks){dragW0.ev.date=toISO(addDays(ymd(dragW0.ev.date),wks*7));dragW0.ev.prov=false;DB.save();}dragW0=null;renderTimeline();}
  else if(dragSub){const s=dragSub;if(s.moved){const wks=Math.round((s.dx||0)/WEEKW);s.sub.week=s.baseWeek-wks;s.sub.stage=stageKeyAtWeek(s.sub.lane,s.sub.week)||s.sub.stage;DB.save();renderTimeline();if(selSub===s.sub.id)renderTasks();}else{selSub=(selSub===s.sub.id?null:s.sub.id);renderTimeline();renderTasks();}dragSub=null;}
});

function wire(){
  document.getElementById('xls').onclick=e=>{e.preventDefault();exportXLSX(ev.name.replace(/[^\w]+/g,'_')+'.xlsx',[
    {name:'Tasks',rows:DB.tasksFor(ev.id).map(t=>{const s=DB.substages.find(x=>x.id==t.substageId);
      return{Lane:t.lane,Stage:stageName(t.lane,t.stage,ev),Substage:s?s.name:'',Task:t.title,
        Responsible:DB.taskPeople(t).map(id=>DB.personName(id)).join(', '),
        Deadline:deIso(t.deadline||''),Status:t.status,Notes:t.notes||''};})},
    /* the venue list travels with the export — it is the sheet logistics used to keep by hand */
    {name:'Venue',rows:DB.venueReady()?DB.venueCatsFor(ev.id).reduce((rows,c)=>{
        const items=DB.venueItemsFor(c.id);
        if(!items.length)rows.push({Category:c.name,Item:'',Notes:''});
        items.forEach(i=>rows.push({Category:c.name,Item:i.item||'',Notes:i.notes||''}));
        return rows;},[]):[]},
    {name:'Team',rows:ev.team.map(m=>({Name:DB.personName(m.personId),Role:m.role}))}]);};
  document.getElementById('addmem').onclick=()=>{const v=document.getElementById('newp').value;if(!v)return;ev.team.push({personId:+v,role:document.getElementById('newr').value});DB.save();renderTeam();};
}
