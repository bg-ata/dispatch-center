<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>RENMAD Dispatch Center — Me</title>
<style>
  :root{--orange:#FF4A00;--charcoal:#2B2B2B;--ink:#3a3a3a;--muted:#7c7c78;--bg:#f3f2ee;--card:#fff;--line:#e3e1da;--red:#D32230;--green:#3E8C28;--amber:#C77800;--blue:#29ACE3;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
  .app{padding:16px 22px 80px;max-width:1180px;margin:0 auto}
  .nav{display:flex;align-items:center;gap:3px;margin-bottom:8px}
  .nav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:12.5px;padding:5px 8px;border-radius:8px}
  .nav a.on{background:var(--orange);color:#fff}
  .nav .brandlet{margin-left:auto;font-size:13px;color:var(--muted)}
  h1{margin:6px 0 2px;font-size:23px;font-weight:700;color:var(--charcoal);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .rolepill{font-size:11px;padding:2px 9px;border-radius:20px;background:#eceae3;color:#5f5e5a;font-weight:600}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
  .grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .panel h3{margin:0 0 4px;font-size:15px;color:var(--charcoal)}
  .panel .hint{font-size:12px;color:var(--muted);font-weight:400;margin:0 0 10px}
  .btn{padding:7px 13px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--charcoal);cursor:pointer;font:inherit}
  .btn.primary{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:600}
  .btn.ok{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
  .btn.no{color:var(--red);border-color:#f0c4c4}
  .btn:hover{filter:brightness(.97)}
  .clockbig{font-size:30px;font-weight:800;color:var(--charcoal);padding:10px 30px}
  .warn{background:#FFF3E8;border:1px solid #F3C49B;color:#8a4a12;font-size:13px;padding:12px 16px;border-radius:10px;margin-bottom:12px}
  .alarm{background:#FBEAEA;border:1px solid #E8B4B4;color:#8a1d1d;font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:10px}
  .alarm a{color:#8a1d1d;font-weight:700}
  .allgood{background:#EAF5E6;border:1px solid #BEE0AF;color:#2f6a1f;font-size:13px;padding:10px 14px;border-radius:10px}
  .evchips{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 2px}
  .evchip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600;color:var(--charcoal);cursor:pointer;text-decoration:none}
  .evchip:hover{border-color:var(--orange)} .evchip .dot{width:10px;height:10px;border-radius:3px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 9px;border-bottom:1px solid #efede8;vertical-align:top}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .st{font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px;color:#fff;white-space:nowrap}
  .chip{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;border-radius:10px;padding:2px 9px;display:inline-block;white-space:nowrap}
  .empty{color:var(--muted);font-style:italic;padding:8px 2px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #f2f0ea;font-size:13px}
  .kv:last-child{border-bottom:none} .kv .k{color:var(--muted)} .kv .v{color:var(--charcoal);font-weight:600;text-align:right}
  input,select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;color:var(--ink);font:inherit}
  .frm label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
  .days{font-size:13px;color:var(--charcoal);font-weight:600;margin:2px 0 6px}
  .flags{font-size:12px;color:var(--red);margin:0 0 10px;min-height:15px}
  .flags div{margin-bottom:2px}
  .flag{color:var(--red);font-size:12px}
  .decidecard{border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff}
  /* allocation */
  .mnav{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .mnav b{font-size:14px;color:var(--charcoal);min-width:150px;text-align:center}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
  .chipbox{background:#faf9f6;border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:12px;color:var(--muted)}
  .chipbox b{display:block;font-size:16px;color:var(--charcoal);font-variant-numeric:tabular-nums}
  .chipbox.good b{color:var(--green)}.chipbox.bad b{color:var(--red)}
  .code{font-size:11px;color:var(--muted)}
  .autoline{font-size:12px;color:var(--muted);background:#faf9f6;border:1px solid var(--line);border-radius:8px;padding:7px 11px;margin-bottom:10px}
  .autoline b{color:var(--charcoal)}
  .agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:2px 18px}
  .acell{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid #efede8;min-width:0}
  .acell .alab{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acell input.hrs{width:70px;text-align:right;padding:4px 7px;flex:0 0 auto}
  .atot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;border-top:2px solid var(--line);background:#f6f5f1;padding:9px 11px;margin-top:8px;border-radius:0 0 9px 9px}
  .atot .num{font-variant-numeric:tabular-nums}
  .mx{overflow-x:auto}
  .mx table{font-size:12px;min-width:520px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.total td{font-weight:700;border-top:2px solid var(--line);background:#f6f5f1}
  /* to-do */
  .td2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:520px){.td2{grid-template-columns:1fr}}
  .tdcol h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
  .tditem{display:flex;align-items:flex-start;gap:7px;padding:6px 0;border-bottom:1px solid #f2f0ea;font-size:13px}
  .tditem .tdtxt{flex:1;min-width:0;overflow-wrap:anywhere}
  .tditem button{border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:12px;padding:2px 7px;color:var(--charcoal);flex:0 0 auto}
  .tditem button:hover{filter:brightness(.96)}
  .duechip{font-size:10.5px;font-weight:700;border-radius:9px;padding:1px 7px;background:#f0eee7;color:var(--muted);white-space:nowrap}
  .duechip.late{background:var(--red);color:#fff}
  /* to-do colour coding + hand-sorted order (Cristina's request, 17 Jul 2026) */
  .tditem{padding-left:9px;border-left:3px solid transparent}
  .tditem.dragging{opacity:.35}
  .tditem.over{box-shadow:inset 0 2px 0 var(--orange)}
  .tdgrip{cursor:grab;color:#cbc7ba;font-size:13px;line-height:1.2;padding:2px 1px;flex:0 0 auto;user-select:none}
  .tdgrip:active{cursor:grabbing}
  .tddot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.2);background:#fff;cursor:pointer;flex:0 0 auto;margin-top:3px;padding:0}
  .tditem button.tddot:hover{filter:brightness(.92)}
  .tdpal{display:flex;gap:6px;align-items:center;padding:2px 0 7px 22px;border-bottom:1px solid #f2f0ea}
  .tdpal .tddot{width:16px;height:16px;margin:0}
  .tdbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 9px;font-size:11.5px;color:var(--muted)}
  .tdseg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .tdseg button{border:0;background:#fff;font-size:11.5px;padding:3px 9px;cursor:pointer;color:var(--muted);font-weight:700}
  .tdseg button.on{background:var(--orange);color:#fff}
  .tdfil{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.2);cursor:pointer;opacity:.4;padding:0}
  .tdfil.on{opacity:1;box-shadow:0 0 0 2px rgba(0,0,0,.16)}
  /* fold pattern */
  .fold{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
  .fold>button.fhead{width:100%;text-align:left;background:none;border:none;padding:12px 16px;font:600 14px 'Segoe UI',sans-serif;color:var(--charcoal);cursor:pointer}
  .fold>.fbody{display:none;padding:0 16px 14px}
  .fold.open>.fbody{display:block}
  .fold .arr{float:right;color:var(--muted);font-size:12px}
  /* quick bar: the four occasional actions as small pills near the top, instead of
     four big cards buried at the bottom. The open one widens to a full row in place. */
  .qbar{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;margin:0 0 14px}
  .qbar .fold{flex:0 0 auto;margin:0;background:none;border:none;border-radius:0}
  .qbar .fold>button.fhead{width:auto;padding:5px 12px;font-size:12.5px;font-weight:600;
    color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;white-space:nowrap}
  .qbar .fold>button.fhead:hover{border-color:var(--orange);color:var(--charcoal)}
  .qbar .fold.open{flex:1 1 100%}
  .qbar .fold.open>button.fhead{color:#8a4a12;background:#FFF3E8;border-color:#F3C49B}
  .qbar .fold>.fbody{padding:10px 2px 2px}
  .qbar .fold .arr{float:none;margin-left:4px}
  .qbar .vis{font-size:10px;margin-left:3px;opacity:.65}
  /* collapsible panels (29 Jul UX round): header row always visible, body folds away.
     The h3 stays exactly as each renderer wrote it — we only add the arrow + summary. */
  .panel.mefold>h3{cursor:pointer;user-select:none}
  .panel.mefold>h3:hover{color:var(--orange)}
  .panel.mefold>h3 .parr{float:right;color:var(--muted);font-size:12px;font-weight:400;margin-left:8px}
  .panel.mefold>h3 .psum{float:right;color:var(--muted);font-size:12px;font-weight:400;font-variant-numeric:tabular-nums;margin-left:10px}
  .panel.mefold>h3 .psum.hot{color:var(--orange);font-weight:700}
  .panel.mefold.closed{padding-bottom:10px}
  .panel.mefold.closed>*:not(h3){display:none !important} /* !important: several panel bodies carry inline display:flex */
  .panel.mefold.closed>h3{margin-bottom:0}
  /* phones */
  @media(max-width:680px){
    h1{font-size:19px}
    /* one line of sight (29 Jul): the intro sentence and role pills don't earn phone space */
    .sub{display:none}
    h1 .rolepill{display:none}
    .panel{margin-bottom:8px}
    .panel.mefold.closed{padding-top:12px;padding-bottom:8px}
    .qbar{margin-bottom:10px}
    .btn{padding:10px 14px}
    .btn.clockbig{width:100%;padding:26px 12px;font-size:28px;border-radius:14px}
    #clockPanel{padding:18px 16px}
    #clockPanel #liveWorked{font-size:34px}
    .frm input,.frm select{width:100%}
    .acell input.hrs{width:62px}
    /* the pills stay small, but not smaller than a thumb */
    .qbar{gap:5px}
    .qbar .fold>button.fhead{padding:11px 12px;font-size:12.5px}
  }
</style>
</head>
<body>
<div class="app">
  <div id="nav"></div>
  <div id="content"></div>
</div>
<script src="store.js?v=114"></script>
<script>
document.getElementById('nav').innerHTML=navBar('home');
/* STCOL now lives in store.js — the shared Me/Team task list needs it too (6 Aug 2026) */
let _clockTick=null;
let weekISO=toISO(monday(new Date()));   // allocation week being edited
let tcM=new Date();tcM.setDate(1);       // month shown in "My month"
let changeOf=null;                        // holiday change-request in progress
const _open={};                           // fold open/closed state (survives re-renders)

/* tiny visibility chip next to panel titles — who can see this information */
function visBadge(t){const pub=t==='everyone';return '<span title="'+(pub?'Visible to the whole team':'Private — '+t)+'" style="font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px;vertical-align:2px;margin-left:6px;background:'+(pub?'#E9F0FB':'#F0EEE7')+';color:'+(pub?'#185FA5':'#7c7c78')+'">'+(pub?'👁 everyone':'🔒 '+t)+'</span>'}
/* the same idea shrunk to a single glyph, for the pills — the full badge is too big there.
   Everyone can USE all four; this says who can see what comes out of them. */
function visDot(t){const pub=t==='everyone';
  return '<span class="vis" title="'+(pub?'Visible to the whole team':'Private — '+t)+'">'+(pub?'👁':'🔒')+'</span>';}

function foldHtml(id,title){
  return '<div class="fold'+(_open[id]?' open':'')+'" id="'+id+'"><button class="fhead" type="button">'+title+' <span class="arr">'+(_open[id]?'▾':'▸')+'</span></button><div class="fbody" id="'+id+'Body"></div></div>';
}
function wireFolds(){
  document.querySelectorAll('.fold>.fhead').forEach(b=>b.onclick=()=>{
    const f=b.parentElement,open=f.classList.toggle('open');
    _open[f.id]=open;const a=b.querySelector('.arr');if(a)a.textContent=open?'▾':'▸';
  });
}
function openFold(id){
  const f=document.getElementById(id);if(!f)return;
  _open[id]=true;f.classList.add('open');
  const a=f.querySelector('.arr');if(a)a.textContent='▾';
  f.scrollIntoView({block:'start',behavior:'smooth'});
}

/* ---- collapsible panels (29 Jul UX round) ----
   Every big section folds to its header row so the whole page fits in one line of
   sight (Belén's spec — especially on the phone). Each header keeps a live one-line
   summary, so a closed panel still informs. Choices persist per person. */
const pfoldKey=()=>'dcMeFolds:'+(DB.currentUser?DB.currentUser.id:0);
function pfoldState(){try{return JSON.parse(localStorage.getItem(pfoldKey()));}catch(e){return null;}}
function pfoldSave(s){try{localStorage.setItem(pfoldKey(),JSON.stringify(s));}catch(e){}}
function panelSummary(id){
  const me=DB.currentUser;
  /* a service account has no clock and no allocation, so its two panels carry an
     explanation, not a state — a "⚪ out" or "3 weeks missing" pill on them would be
     inventing a duty that does not exist */
  if(isTeamAccount(me))return '';
  try{
    if(id==='clockPanel'){
      const lw=document.getElementById('liveWorked'),stEl=document.getElementById('clockState');
      const on=stEl&&/Clocked in/.test(stEl.textContent);
      return (lw?lw.textContent:'')+(on?' · <span class="hot">🟢 in</span>':' · ⚪ out');
    }
    if(id==='allocPanel'){
      const mw=missingWeeks(me.id).length;
      if(mw)return '<span class="hot">'+mw+' week'+(mw===1?'':'s')+' missing</span>';
      const t=document.querySelector('#allocPanel .atot .num');
      return t?t.textContent.trim():'';
    }
    if(id==='todoPanel'){
      const n=(DB.todos||[]).filter(t=>t.personId==me.id&&!t.done).length;
      return n?n+' open':'';
    }
    if(id==='holPanel'){
      const pend=(DB.holidays||[]).filter(h=>h.personId==me.id&&['manager','belen','hr'].includes(h.status)).length;
      return pend?'<span class="hot">'+pend+' pending</span>':'';
    }
    if(id==='evPanel'){
      const n=DB.tasksOf(me.id).filter(taskLive).length;
      return n?n+' open task'+(n===1?'':'s'):'';
    }
  }catch(e){}
  return '';
}
function wirePanelFolds(){
  /* first visit: desktop opens the clock (the everyday action), phones open nothing —
     the full menu of headers IS the point. After that, each person's choices stick. */
  const phone=innerWidth>0&&innerWidth<=680; /* explicit: a 0-width probe (headless pane) must not read as phone */
  const st=pfoldState()||(phone?{}:{clockPanel:true});
  document.querySelectorAll('.panel.mefold').forEach(p=>{
    const h=p.querySelector('h3');
    if(!h||p.style.display==='none')return;      // e.g. Messages hides itself when the module is off
    const open=!!st[p.id];
    p.classList.toggle('closed',!open);
    const s=panelSummary(p.id);
    h.insertAdjacentHTML('beforeend','<span class="parr">'+(open?'▾':'▸')+'</span>'+(s?'<span class="psum">'+s+'</span>':''));
    h.onclick=e=>{
      if(e.target.closest('a,button,input,select,textarea'))return;
      const closed=p.classList.toggle('closed');
      const cur=pfoldState()||{};cur[p.id]=!closed;pfoldSave(cur);
      const arr=h.querySelector('.parr');if(arr)arr.textContent=closed?'▸':'▾';
    };
  });
  /* the clock summary stays live while the panel is closed */
  if(!window._psumTick)window._psumTick=setInterval(()=>{
    const p=document.getElementById('clockPanel');if(!p||!p.classList.contains('closed'))return;
    const h=p.querySelector('h3 .psum');if(h)h.innerHTML=panelSummary('clockPanel');
  },30000);
}
function openPanel(id){
  const p=document.getElementById(id);if(!p)return;
  if(p.classList.contains('closed')){
    p.classList.remove('closed');
    const cur=pfoldState()||{};cur[id]=true;pfoldSave(cur);
    const arr=p.querySelector('h3 .parr');if(arr)arr.textContent='▾';
  }
  p.scrollIntoView({block:'start',behavior:'smooth'});
}

function render(){
  const me=DB.currentUser;const C=document.getElementById('content');
  if(_clockTick){clearInterval(_clockTick);_clockTick=null;}
  if(!me){C.innerHTML='<h1>🙋 Me</h1><p class="sub">You are signed in but not in the staff roster yet — ask Belén to add you. Once added, this becomes your personal home.</p>';return;}
  const acc=me.access||'member', accBg=acc==='admin'?'#FF4A00':acc==='manager'?'#E8A13C':'#eceae3', accCol=acc==='member'?'#5f5e5a':'#fff';
  const svcAcct=isTeamAccount(me);   // an outside login: no clock, no allowance, no tasks
  /* "at an event" head suffix, computed up-front for the fold title */
  const today=toISO(new Date());
  let awaySuffix='';
  if(DB.eventReady()){
    const mineAw=DB.eventaway.filter(e=>e.personId==me.id);
    const cur=mineAw.find(e=>(e.dateFrom||'')<=today&&(e.dateTo||'')>=today);
    const up=mineAw.filter(e=>(e.dateFrom||'')>today).length;
    awaySuffix=cur?' <span style="font-size:12px;color:#185FA5;font-weight:700">· now: '+esc(cur.title||'Event')+'</span>'
      :(up?' <span style="font-size:12px;color:var(--muted);font-weight:400">· '+up+' upcoming</span>':'');
  }
  C.innerHTML=
    '<h1>🙋 Me — '+esc(me.name.split(' ')[0])+' <span class="rolepill">'+me.role+'</span>'+
      '<span class="rolepill" style="background:'+accBg+';color:'+accCol+'">'+(ACCESS_LABEL[acc]||acc)+'</span>'+
      (me.finance?'<span class="rolepill" style="background:#185FA5;color:#fff">€ finance</span>':'')+
      (me.hr?'<span class="rolepill" style="background:#4C3079;color:#fff">HR</span>':'')+'</h1>'+
    '<p class="sub">Your whole day in one place — clock in, plan your week, tick off your list and manage your time off.</p>'+
    /* the four occasional actions: small pills up here rather than four big cards at the
       bottom. Everyone gets all four; the glyph says who can see what comes out of each. */
    /* A SERVICE ACCOUNT (external HR, external accounts) has no clock, no allowance and no
       tasks, so the machinery hung off them would be four dead ends: no event days to flag,
       no punches to correct, no month of hours, no holidays and no task list. The clock and
       allocation panels stay, because their one line is what EXPLAINS the absence. What is
       left is the profile — which is where they change their own password. */
    '<div class="qbar">'+
      (svcAcct?'':foldHtml('awayFold','📣 At an event'+visDot('everyone')+awaySuffix))+
      (svcAcct?'':foldHtml('reportFold','🛠 Report a clock mistake'+visDot('you + HR')))+
      (svcAcct?'':foldHtml('monthFold','📆 My month'+visDot('you + HR')))+
      foldHtml('profFold','👤 My profile'+visDot('everyone'))+
    '</div>'+
    /* 🔔 first, full-width: the one block that must never be below the fold (29 Jul UX round) */
    '<div class="panel" id="alarmPanel"></div>'+
    /* ⏳ PENDING, then the calendar right under it — Belén, 6 Aug 2026, after the logistics
       meeting: "un bloque de Pending más arriba en la página Mí, y el calendario justo
       debajo". The point is that you can change a status from here: until today you had to
       go into the event, then the lane, then the stage, project by project. */
    (svcAcct?'':'<div class="panel" id="pendPanel"></div>')+
    (svcAcct?'':'<div class="panel" id="calPanel"></div>')+
    /* the rest are collapsible rows — Belén, 29 Jul: "you see all options and pick what
       you need, all in one easy line of sight, even on the phone". Headers always visible,
       each carries a live one-line summary; open/closed choices are remembered per person. */
    '<div class="grid2">'+
      '<div><div class="panel mefold" id="clockPanel"></div><div class="panel mefold" id="allocPanel"></div></div>'+
      '<div><div class="panel mefold" id="msgPanel"></div><div class="panel mefold" id="todoPanel"></div>'+
        (svcAcct?'':'<div class="panel mefold" id="holPanel"></div>')+'</div>'+
    '</div>'+
    (svcAcct?'':'<div class="panel mefold" id="evPanel"></div>');
  /* panels isolated (20 Jul 2026 outage): one broken panel must not kill the ones after it */
  for(const f of [renderClock,renderAllocPanel,renderAlarms,renderPending,renderMyCalendar,renderMsgPanel,renderTodo,renderHolPanel,renderEvents,
                  renderAwayFold,renderReportFold,renderMonthFold,renderProfFold,wireFolds,wirePanelFolds]){

/* ================= ⏳ PENDING — everything waiting on me =================
   Belén, 6 Aug 2026: a Pending block higher up the page, and the status editable from
   here instead of "event → logistics → stage → etc." The list is the tasks that are not
   Done, soonest first, with the overdue ones called out; status and notes are inline.
   Requests you raised that have been answered sit on top of it, because an answer nobody
   reads is the failure mode the whole request flow exists to kill. */
function renderPending(){
  const me=DB.currentUser,box=document.getElementById('pendPanel');if(!me||!box)return;
  const openT=DB.tasksOf(me.id).filter(taskLive);
  const R=taskRunway(me.id);
  const late=R.overdue, thisWk=R.today.concat(R.days);
  const fresh2=openT.filter(t=>taskStatus(t)==='Assigned');
  /* requests I asked for that logistics has come back on */
  let answered=[];
  try{if(DB.reqReady())answered=DB.requests.filter(r=>!r.deleted&&r.personId==me.id&&r.status==='answered');}catch(e){}
  /* requests waiting on ME, if I am the logistics desk */
  let toAnswer=[];
  try{if(DB.reqReady()&&DB.canLogistics())toAnswer=DB.requests.filter(r=>!r.deleted&&r.status==='open');}catch(e){}
  /* events created recently that I have not looked at — see newEventNotices() */
  const fresh=newEventNotices(me);

  let h='<h3>⏳ Pending'+visBadge('you')+' <span class="hint" style="font-weight:400">— '+
    (openT.length?((late.length?('<b style="color:#D32230">'+late.length+' overdue</b> · '):'')+
      thisWk.length+' in the next few days · '+openT.length+' open in all'):'nothing open')+'</span></h3>';

  const notes=[];
  /* "N new tasks assigned to you" — the message type Belén asked for, batched. It clears
     itself the moment the runway below is drawn, because drawing it IS her looking. */
  if(fresh2.length)notes.push('<b>'+fresh2.length+' new task'+(fresh2.length===1?'':'s')+' assigned to you</b> — '+
    esc(fresh2.slice(0,3).map(t=>t.title).join(', '))+(fresh2.length>3?(' and '+(fresh2.length-3)+' more'):'')+'.');
  /* the weekly digest, in the app. Belén ruled out one email per task (200 material tasks
     land at once) and ruled out a per-task "notify? yes/no" tick, because you can never
     tell whether it actually went out. One summary, always current, always here. */
  let dig='';try{dig=digestText(me.id);}catch(e){}
  if(dig)notes.push('<b>This week:</b> '+esc(dig)+'.');
  if(fresh.length)notes.push('<b>'+fresh.length+' new event'+(fresh.length===1?'':'s')+'</b> on the board: '+
    fresh.map(e=>'<a href="event.html?id='+e.id+'">'+esc(e.name)+'</a>').join(', ')+
    ' — worth moving your stages onto '+(fresh.length===1?'it':'them')+'. <a href="#" id="pendSeen">Got it</a>');
  if(toAnswer.length)notes.push('<b>'+toAnswer.length+' request'+(toAnswer.length===1?' is':'s are')+' waiting on logistics</b>: '+
    toAnswer.slice(0,4).map(r=>'<a href="event.html?id='+r.eventId+'#req">'+esc(r.title)+'</a>').join(', ')+
    (toAnswer.length>4?' …':''));
  if(answered.length)notes.push('<b>Logistics answered you</b> on '+
    answered.map(r=>'<a href="event.html?id='+r.eventId+'#req">'+esc(r.title)+'</a>').join(', ')+'.');
  if(notes.length)h+='<div style="background:#FFF3EC;border:1px solid #F3D9B8;border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:13px">'+
    notes.map(n=>'<div style="margin:2px 0">'+n+'</div>').join('')+'</div>';

  h+='<p class="hint">Nearest first. Anything more than two weeks away is folded away until it gets close — '+
     'change a status or jot a note right here, without opening the event, the lane and the stage.</p>';
  h+=dcRunwayHtml(me.id,{empty:'Nothing on your runway — all clear. 🎉'});
  box.innerHTML=h;
  wireTaskList(box,()=>{renderPending();renderMyCalendar();renderEvents();});
  const seen=document.getElementById('pendSeen');
  if(seen)seen.onclick=e=>{e.preventDefault();markEventsSeen(me);renderPending();};
  /* seeing your own runway IS opening your tasks: Assigned → Pending, no click.
     Done AFTER the paint so the NEW chips are visible on the render that clears them. */
  if(fresh2.length)setTimeout(()=>{if(taskSeenAll(fresh2))DB.saveNow();},1200);
}
/* ---- "there is a new event" (Belén, 6 Aug) ----
   When Carlos creates an event, logistics wants to know so they can start moving their
   stages. Kept as a mark-as-seen list per person in localStorage rather than a new table:
   it is a nudge, not a record, and it must never become another thing to administer. */
function newEventNotices(me){
  try{
    if(!me)return [];
    const key='dcEvSeen:'+me.id;
    let seen={};try{seen=JSON.parse(localStorage.getItem(key)||'{}')||{};}catch(e){seen={};}
    const first=localStorage.getItem(key)===null;
    const mine=DB.events.filter(e=>!e.deleted&&evKind(e)!=='external');
    if(first){ /* do not shout about every event that already existed the first time */
      const all={};mine.forEach(e=>all[e.id]=1);
      try{localStorage.setItem(key,JSON.stringify(all));}catch(e){}
      return [];
    }
    return mine.filter(e=>!seen[e.id]).sort((a,b)=>ymd(a.date)-ymd(b.date));
  }catch(e){return [];}
}
function markEventsSeen(me){
  try{const key='dcEvSeen:'+me.id,all={};
    DB.events.forEach(e=>{if(!e.deleted)all[e.id]=1;});
    localStorage.setItem(key,JSON.stringify(all));}catch(e){}
}

/* weekly-hours bar (same behaviour as the HR time-clock tab): fills red→green
   as hours are clocked, live, with a "N left / week complete / last 30 min" note */
/* the "Today" bar — today's expected hours, or the week's remainder on the last working
   day. A helper to stay on time; doing more is fine (Belén, 22 Jul). */
function updateDayBar(me){
  const bar=document.getElementById('dayBar');if(!bar||!me)return;
  const g=tcDayGoal(me.id);
  const fmt=h=>{const H=Math.floor(h+1e-9),M=Math.round((h-H)*60);return M?H+'h '+M+'m':H+'h';};
  bar.style.width=Math.round(g.pct*100)+'%';
  bar.style.background=g.off?'#cfcdc7':'hsl('+Math.round(g.pct*120)+',68%,42%)';
  const lbl=document.getElementById('dayLbl');if(lbl)lbl.textContent=g.isLastDay?'Today · last day of the week':'Today';
  const left=document.getElementById('dayLeft');
  if(left){
    if(g.off){left.textContent='—';left.style.color='var(--muted)';}
    else if(g.done){left.textContent='✓ done';left.style.color='var(--green)';}
    else{left.textContent='⏳ '+fmt(g.remaining)+(g.isLastDay?' left this week':' left today');left.style.color=g.remaining<=0.5?'#D32230':(g.remaining<=1?'#C77800':'var(--charcoal)');}
  }
  const txt=document.getElementById('dayTxt');
  if(txt)txt.textContent=g.off?'no hours expected today':(fmt(g.worked)+' of '+fmt(g.goal)+(g.isLastDay?' · the week’s remainder':' expected today'));
}
/* tick marks in the week bar: faint hour lines (spaced out on long weeks so they don't
   crowd) + bolder ¼/½/¾ anchors. Rebuilt only when the target changes, not every second. */
function buildWeekTicks(target){
  const wrap=document.getElementById('wkTicks');if(!wrap)return;
  if(wrap.dataset.t===String(target))return;
  wrap.dataset.t=String(target);
  if(!(target>0)){wrap.innerHTML='';return;}
  const step=target<=12?1:(target<=24?2:5);   // hours between ticks
  let h='';
  for(let hh=step;hh<target-1e-6;hh+=step){const x=100*hh/target;
    if(Math.abs(x-25)<0.8||Math.abs(x-50)<0.8||Math.abs(x-75)<0.8)continue; // let the quarter anchor own that spot
    h+='<div style="position:absolute;top:2px;bottom:2px;left:'+x+'%;width:1px;background:rgba(0,0,0,.16)"></div>';}
  [25,50,75].forEach(x=>{h+='<div style="position:absolute;top:0;bottom:0;left:'+x+'%;width:1.5px;background:rgba(0,0,0,.30)"></div>';});
  wrap.innerHTML=h;
  const w=document.getElementById('wkBarWrap');if(w)w.title='each mark = '+step+' h';
}
function updateWeekBar(me){
  const bar=document.getElementById('wkBar');if(!bar||!me)return;
  const p=tcWeekProgress(me.id);
  bar.style.width=Math.round(p.pct*100)+'%';
  bar.style.background='hsl('+Math.round(p.pct*120)+',68%,42%)';
  buildWeekTicks(p.target);
  const fmt=h=>{const H=Math.floor(h+1e-9),M=Math.round((h-H)*60);return M?H+'h '+M+'m':H+'h';};
  // the clear countdown, right of the label — colour ramps as the week runs out
  const left=document.getElementById('wkLeft');
  if(left){
    if(p.target<=0){left.textContent='—';left.style.color='var(--muted)';}
    else if(p.done){left.textContent='✓ complete';left.style.color='var(--green)';}
    else{left.textContent='⏳ '+fmt(p.remaining)+' left';left.style.color=p.remaining<=0.5?'#D32230':(p.remaining<=1?'#C77800':'var(--charcoal)');}
  }
  const txt=document.getElementById('wkTxt');
  if(txt)txt.textContent=p.target<=0?'no hours expected this week':(fmt(p.worked)+' of '+fmt(p.target)+' · '+Math.round(p.pct*100)+'%');
  const note=document.getElementById('wkNote');if(!note)return;
  if(p.target<=0)note.innerHTML='<span style="color:var(--muted)">Holiday week — nothing to clock.</span>';
  else if(p.done)note.innerHTML='<span style="color:var(--green);font-weight:700">✓ Week complete — that’s your '+fmt(p.target)+'. Nice one.</span>';
  else if(p.remaining<=0.5)note.innerHTML='<span style="color:var(--red);font-weight:700">🔔 Under 30 minutes to go this week!</span>';
  else note.innerHTML='';   // the ⏳ countdown above already states what's left — no duplicate line
}

  const me=DB.currentUser;
  const mon=ymd(weekISO),fri=addDays(mon,4);
  document.getElementById('w_lab').textContent='Week of '+fmtHumanShort(weekISO)+' – '+fmtHumanShort(toISO(fri));
  if(!me){document.getElementById('ts').innerHTML='<tr><td class="empty">Log in to fill your hours.</td></tr>';return;}
  const w=weekWorkInfo(weekISO,me.id);
  const t=tsFor(me.id,weekISO);
  /* the stored week also carries its Festivos/Vacaciones lines — those are not typed
     here, so they must stay out of the grid and out of "Remaining" */
  const manual={};if(t)Object.keys(t.hours||{}).forEach(pid=>{if(!isAutoProject(pid))manual[pid]=t.hours[pid];});
  const sum=Object.values(manual).reduce((a,v)=>a+(+v||0),0);
  const remaining=Math.round((w.toAllocate-sum)*100)/100;
  const over=remaining<-0.01, exact=Math.abs(remaining)<0.01;
  document.getElementById('chips').innerHTML=
    '<span class="chipbox">Required<b>'+fmtH(w.required)+' h</b></span>'+
    (w.fest>0?'<span class="chipbox" title="'+w.festNames.join(', ')+'">00. Festivos (auto)<b>'+fmtH(w.fest)+' h</b></span>':'')+
    (w.vac>0?'<span class="chipbox">04. Vacaciones (auto)<b>'+fmtH(w.vac)+' h</b></span>':'')+
    (w.leave>0?'<span class="chipbox">On leave (auto)<b>'+fmtH(w.leave)+' h</b></span>':'')+
    '<span class="chipbox">To allocate<b>'+fmtH(w.toAllocate)+' h</b></span>'+
    '<span class="chipbox '+(exact?'good':'bad')+'" id="remChip">'+(over?'⚠ Over by':'Remaining')+'<b>'+(exact?'✓ 0':fmtH(Math.abs(remaining))+' h')+'</b></span>';
  const fp=autoProject('festivos'),vp=autoProject('vacaciones');
  const autos=[];
  if(w.fest>0&&fp)autos.push('<b>'+esc(fp.label)+'</b> '+fmtH(w.fest)+' h <span class="code">('+w.festNames.join(', ')+')</span>');
  if(w.vac>0&&vp)autos.push('<b>'+esc(vp.label)+'</b> '+fmtH(w.vac)+' h <span class="code">(approved holidays)</span>');
  let h=autos.length?'<div class="autoline">Auto-filled for you: '+autos.join(' &nbsp;·&nbsp; ')+'</div>':'';
  /* A retired project STILL gets a row when this week already has hours on it. The
     total above is summed from the stored hours, but the grid used to render only the
     active ones — so a project retired mid-week left its hours invisible: Remaining
     looked wrong, and saving (which rebuilds `hours` from the visible inputs) silently
     threw those hours away. Showing it lets the person move them somewhere on purpose. */
  const shown=activeProjects();
  DB.projects.filter(p=>!p.kind&&p.active===false&&(+manual[p.id]||0)>0)
             .forEach(p=>{if(!shown.some(x=>x.id==p.id))shown.push(p);});
  h+='<div class="agrid">'+shown.map(p=>
      '<label class="acell'+(p.active===false?' retired':'')+'" title="'+esc(p.label+(p.code?' ('+p.code+')':''))+(p.active===false?' — retired: move these hours to the current project':'')+'"><span class="alab">'+esc(p.label)+(p.code?' <span class="code">('+esc(p.code)+')</span>':'')+(p.active===false?' <span class="code" style="color:#b5541a">· retired</span>':'')+'</span>'+
      '<input class="hrs" type="number" min="0" step="0.25" data-pid="'+p.id+'" value="'+(manual[p.id]!=null?manual[p.id]:'')+'" placeholder="0"></label>').join('')+'</div>';
  /* the week's target: leave is NOT allocation (on sick/maternity leave nobody works,
     so there is nothing to fill) — a leave week closes at required MINUS the leave */
  const target=Math.round((w.required-w.leave)*100)/100;
  const tail=n=>{const left=Math.round((target-n)*100)/100;
    return left>0.01?' <span class="hint">· '+fmtH(left)+' h still to allocate</span>'
         : left<-0.01?' <span class="hint" style="color:var(--red)">· '+fmtH(-left)+' h too many</span>'
         : ' <span class="hint" style="color:var(--green)">· week complete ✓</span>';};
  h+='<div class="atot"><span>Total (with auto-filled lines)'+
     (w.leave>0?'<br><span class="hint">'+fmtH(w.leave)+' h on leave — not allocated, you were not working</span>':'')+
     '</span><span class="num" id="tsTotal">'+fmtH(sum+w.fest+w.vac)+' / '+fmtH(target)+' h'+tail(sum+w.fest+w.vac)+'</span></div>';
  document.getElementById('ts').innerHTML=h;
  document.querySelectorAll('#ts input').forEach(inp=>inp.oninput=()=>{
    let s=0;document.querySelectorAll('#ts input').forEach(i=>s+=(+i.value||0));
    document.getElementById('tsTotal').innerHTML=fmtH(s+w.fest+w.vac)+' / '+fmtH(target)+' h'+tail(s+w.fest+w.vac);
    const rem=Math.round((w.toAllocate-s)*100)/100,ov=rem<-0.01,ex=Math.abs(rem)<0.01;
    const chip=document.getElementById('remChip');
    chip.className='chipbox '+(ex?'good':'bad');
    chip.innerHTML=(ov?'⚠ Over by':'Remaining')+'<b>'+(ex?'✓ 0':fmtH(Math.abs(rem))+' h')+'</b>';
    const tot=document.getElementById('tsTotal');tot.style.color=ov?'var(--red)':'';
  });
}
function saveWeek(){
  const me=DB.currentUser;if(!me){alert('Log in first.');return;}
  const hours={};
  document.querySelectorAll('#ts input').forEach(i=>{const v=+i.value;if(v>0)hours[i.dataset.pid]=v;});
  const w=weekWorkInfo(weekISO,me.id);
  const sum=Object.values(hours).reduce((a,v)=>a+(+v||0),0);
  /* bank holidays + approved holidays are written onto the week as real allocation lines,
     recomputed from the holiday record on every save so a late approval still lands */
  Object.assign(hours,tsAutoHours(me.id,weekISO));
  if(sum-w.toAllocate>0.01){ // the week can't hold more than it has — block it
    alert('You have allocated '+fmtH(sum)+' h but this week only has '+fmtH(w.toAllocate)+' h to allocate'+
      ((w.fest||w.vac)?' (bank holidays / holidays already take the rest)':'')+'.\n\nPlease take '+fmtH(sum-w.toAllocate)+' h off before saving.');
    return;
  }
  let t=tsFor(me.id,weekISO);
  if(t)t.hours=hours;else DB.timesheets.push({id:DB.newId(),personId:me.id,week:weekISO,hours});
  /* wait for the database to actually take it before saying so — on a phone the old
     debounced save could die when the app was backgrounded, and the week silently vanished */
  const m=document.getElementById('w_msg'),btn=document.getElementById('saveBtn');
  m.style.color='var(--muted)';m.textContent='Saving…';
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  DB.saveNow().then(ok=>{
    if(btn){btn.disabled=false;btn.textContent='Save my hours';}
    if(!ok)return; // syncNow already told them + reloaded
    m.style.color=Math.abs(sum-w.toAllocate)<0.01?'var(--green)':'var(--amber)';
    m.textContent=Math.abs(sum-w.toAllocate)<0.01?'Saved — week complete ✓':'Saved — '+fmtH(w.toAllocate-sum)+' h still unallocated';
    setTimeout(()=>m.textContent='',5000);
    renderAllocAlarm();renderWeek();renderAlarms();
  });
}

  /* a collapsed panel opens itself before we scroll to it (29 Jul UX round) */

/* --- shared holiday helpers (ported from hr.html) --- */
function fmtRange(h){return fmtHumanRange(h.dateFrom,h.dateTo);}
function isExemptDay(iso){ // periods where team overlaps are normal: August, Christmas, Easter week
  const d=ymd(iso),m=d.getMonth(),day=d.getDate();
  if(m===7)return true;
  if((m===11&&day>=22)||(m===0&&day<=6))return true;
  const e=easter(d.getFullYear());
  return d>=addDays(e,-7)&&d<=addDays(e,1);
}
function overlapDays(aF,aT,bF,bT){ // shared NON-EXEMPT working days of two ranges
  const from=aF>bF?aF:bF,to=aT<bT?aT:bT,out=[];
  if(from>to)return out;
  for(let d=ymd(from);toISO(d)<=to;d=addDays(d,1)){const iso=toISO(d);
    if(d.getDay()===0||d.getDay()===6||madHol(iso))continue;
    if(!isExemptDay(iso))out.push(iso);}
  return out;
}
function reqAlarms(r){ // ⚠ strings for one request (used at request time AND in the approval panel)
  const p=DB.person(r.personId),alarms=[];if(!p)return alarms;
  if(r.type==='remote'){
    const yr=r.dateFrom.slice(0,4);
    const used=remoteDaysUsed(r.personId,yr)+(r.id?0:(+r.workDays||0));
    if(used>REMOTE_MAX_DAYS)alarms.push('Remote work: '+used+' days of '+REMOTE_MAX_DAYS+' in '+yr+' — over the yearly limit.');
    return alarms;
  }
  DB.holidays.filter(o=>o.id!=r.id&&(o.type||'vacation')!=='remote'&&o.status!=='denied'&&o.status!=='cancelled'&&o.personId!=r.personId
    &&DB.person(o.personId)&&DB.person(o.personId).role===p.role).forEach(o=>{
    const ov=overlapDays(r.dateFrom,r.dateTo,o.dateFrom,o.dateTo);
    if(ov.length)alarms.push('Team overlap: '+DB.personName(o.personId)+' is also off '+ov.length+' of these working day'+(ov.length===1?'':'s')+' (outside Xmas / Easter / August).');
  });
  DB.holidays.filter(o=>o.id!=r.id&&(o.type||'vacation')!=='remote'&&o.status!=='denied'&&o.status!=='cancelled'&&o.personId==r.personId&&o.id!=r.replaces).forEach(o=>{
    let gap=null;
    if(o.dateTo<r.dateFrom)gap=workingDaysBetween(toISO(addDays(ymd(o.dateTo),1)),toISO(addDays(ymd(r.dateFrom),-1)));
    else if(r.dateTo<o.dateFrom)gap=workingDaysBetween(toISO(addDays(ymd(r.dateTo),1)),toISO(addDays(ymd(o.dateFrom),-1)));
    if(gap!=null&&gap>0&&gap<=5)alarms.push('Broken-up holidays: only '+gap+' working day'+(gap===1?'':'s')+' in the office between this and '+fmtRange(o)+' — something is not quite right.');
  });
  return alarms;
}
/* EVERY request says what it is, holidays included — an unlabelled card was read as
   "holidays" by default, which is exactly how two remote-work days looked like time off
   (Belén, 30 Jul). Colour + emoji + the word: 🌴 green holidays · 🏠 blue remote work. */
function typeChip(r,opts){const ty=r.type||'vacation';
  if(ty==='vacation'&&!(opts&&opts.always))return '';
  const col=ty==='vacation'?'var(--green)':ty==='remote'?'var(--blue)':'var(--amber)';
  return '<span class="chip" style="background:'+col+'">'+(TYPE_EMOJI[ty]||'')+' '+TYPE_LABEL[ty]+'</span> ';}
function statusChip(h){
  if(h.status==='approved')return '<span class="chip" style="background:var(--green)">Approved</span>';
  if(h.status==='denied')return '<span class="chip" style="background:var(--red)">Denied</span>';
  if(h.status==='cancelled')return '<span class="chip" style="background:#9AA0A8">Cancelled</span>';
  return '<span class="chip" style="background:var(--amber)">'+holStageLabel(h)+'</span>';
}
function changeAdvice(r){ // what a change request means for the final holiday
  if(!r.replaces)return null;
  const o=DB.holidays.find(x=>x.id==r.replaces);if(!o)return null;
  const net=(+r.workDays||0)-(+o.workDays||0);
  return 'CHANGE of '+fmtRange(o)+' ('+o.workDays+'d) → '+fmtRange(r)+' ('+r.workDays+'d) · net '+(net>0?'+':'')+net+' day'+(Math.abs(net)===1?'':'s')+' on the balance.';
}
function esc2(s){return (s||'').replace(/"/g,'&quot;');}
/* the approval chain of one pending request, e.g. "✓ Carlos approved 12/07 → ● YOUR TURN → then HR" */
function chainHtml(r){
  const p=DB.person(r.personId);if(!p)return '';
  const chain=holChain(p);
  const approvals=(r.log||[]).filter(l=>/^approved/.test(l.action||''));
  let curIdx=chain.findIndex(s=>s.key===r.status);if(curIdx<0)curIdx=chain.length;
  const fmtAt=at=>{if(!at)return '';const d=new Date(at);return isNaN(+d)?'':String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');};
  const mine=holActsOnMe(r); // only say "YOUR TURN" when it actually is
  const parts=chain.map((s,i)=>{
    const name=s.key==='hr'?'HR':(s.who?s.who.name.split(' ')[0]:'?');
    if(i<curIdx){const ap=approvals[i];
      return '<span style="color:var(--green);font-weight:700">✓ '+esc(ap?ap.by.split(' ')[0]:name)+' approved'+(ap&&fmtAt(ap.at)?' '+fmtAt(ap.at):'')+'</span>';}
    if(i===curIdx)return mine?'<span style="color:var(--orange);font-weight:800">● YOUR TURN</span>'
      :'<span style="color:var(--amber);font-weight:700">● with '+esc(name)+'</span>';
    return '<span style="color:var(--muted)">then '+esc(name)+'</span>';
  });
  return '<div style="font-size:11.5px;margin:6px 0 2px">'+parts.join(' <span style="color:var(--muted)">→</span> ')+'</div>';
}
/* the message thread on a request. Approvers see everything; the requester only ever sees

      '<button class="btn" style="font-size:11.5px" data-hm="'+r.id+'" data-to="0" title="Only the other approvers see this">🔒 To approvers</button>'+

      '</div>';
  }else if(opts.allowReply){
    h+='<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:4px">'+
      '<input id="hm_'+r.id+'" placeholder="Reply…" style="flex:1 1 190px;font:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:7px">'+
      '<button class="btn" style="font-size:11.5px" data-hm="'+r.id+'" data-to="1">Send</button></div>';

/* shared by every panel that renders msgsHtml */

function decide(id,ok){
  const r=DB.holidays.find(x=>x.id==id);if(!r)return;
  const me=DB.currentUser;
  let note='';
  if(!ok){note=prompt('Reason for denying (shown to '+DB.personName(r.personId)+'):')||'';}
  r.log=(r.log||[]).concat([{by:me.name,at:new Date().toISOString(),action:(ok?'approved ('+r.status+' step)':'denied'),note}]);
  r.status=ok?holNextStatus(r):'denied';
  /* a fully approved CHANGE releases the holiday it replaces (kept visible as cancelled) */
  if(r.status==='approved'&&r.replaces){
    const o=DB.holidays.find(x=>x.id==r.replaces);
    if(o&&o.status!=='cancelled'){o.status='cancelled';
      o.log=(o.log||[]).concat([{by:me.name,at:new Date().toISOString(),action:'cancelled — replaced by the approved change to '+fmtRange(r)}]);}
  }
  /* audit: a decision must be CONFIRMED saved before we notify the requester —
     otherwise the notification announces an approval that never reached the server */
  DB.saveNow().then(saved=>{
    if(!saved){render();return;}   // banner explains; the decision retries in the background
    try{ // tell the requester what happened (🔔 inbox); silently no-ops if the inbox table isn't there yet
      let txt='Your time-off ('+fmtRange(r)+') was '+(ok?'approved':'denied')+' by '+me.name;
      if(ok&&r.status!=='approved')txt+=' — next: '+holStageLabel(r);
      notifySend(r.personId,'holiday',txt,'home.html');
    }catch(e){}
    render();
  });
}

const TD_COLORS=[{k:'red',c:'#E24A2B',n:'Urgent'},{k:'amber',c:'#EFA02F',n:'Waiting on someone'},

function tdCol(k){return TD_COLORS.find(c=>c.k===k)||null;}

function tdOrderKey(){return 'dc_td_order:'+((DB.currentUser||{}).id||0);}
function tdOrder(){try{return localStorage.getItem(tdOrderKey())||'due';}catch(e){return 'due';}}
function tdSetOrder(v){try{localStorage.setItem(tdOrderKey(),v);}catch(e){}}
function renderTodo(){

  /* colour filter: only offer colours actually in use, and drop a stale filter */

  if(_tdFilter&&!used.some(c=>c.k===_tdFilter))_tdFilter='';

    if(!t.due)return '';

  h+='<p class="hint">Your private list — nobody else sees it.</p>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">'+

      '<input type="date" id="td_due" title="Due date (optional)" style="flex:0 0 auto">'+

    '</div>'+
    '<div class="tdbar">'+
      '<span>Order</span><span class="tdseg">'+
        '<button data-tdord="due" class="'+(manual?'':'on')+'">Due date</button>'+
        '<button data-tdord="mine" class="'+(manual?'on':'')+'">Mine</button></span>'+
      (canColor&&used.length?'<span style="margin-left:4px">Show</span>'+

        (_tdFilter?'<button class="btn sm" data-tdfil="" style="padding:1px 7px;font-size:11px">all</button>':''):'')+
      (manual?'<span style="margin-left:auto">drag ⠿ to reorder</span>':'')+

      '<div class="tdcol"><h4>Done</h4>'+
        (done.length?done.map(t=>'<div class="tditem" style="opacity:.75'+(tdCol(t.color)?';border-left-color:'+tdCol(t.color).c:'')+'">'+

  box.querySelectorAll('[data-tback]').forEach(b=>b.onclick=()=>{

  box.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=()=>{

  box.querySelectorAll('[data-tdfil]').forEach(b=>b.onclick=()=>{_tdFilter=b.dataset.tdfil||'';renderTodo();});
  box.querySelectorAll('[data-tdpal]').forEach(b=>b.onclick=()=>{
    _tdPal=(_tdPal==b.dataset.tdpal)?null:b.dataset.tdpal;renderTodo();});
  box.querySelectorAll('[data-tdset]').forEach(b=>b.onclick=()=>{
    const t=DB.todos.find(x=>x.id==b.dataset.tdset);if(!t)return;
    t.color=b.dataset.c||null;_tdPal=null;DB.save();renderTodo();});
  if(manual)wireTodoDrag();

/* drag to reorder — writes the `sort` column (10,20,30…) so the order follows her
   to every browser. Dropping ON an item puts the dragged one just before it. */
function wireTodoDrag(){
  const cont=document.getElementById('td_open');if(!cont)return;
  let dragId=null;
  cont.querySelectorAll('.tditem').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragId=el.dataset.tdid;el.classList.add('dragging');
      try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId);}catch(x){}});
    el.addEventListener('dragend',()=>{dragId=null;el.classList.remove('dragging');
      cont.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));});
    el.addEventListener('dragover',e=>{if(el.dataset.tdid==dragId)return;e.preventDefault();el.classList.add('over');});
    el.addEventListener('dragleave',()=>el.classList.remove('over'));
    el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');
      let src=dragId;try{src=src||e.dataTransfer.getData('text/plain');}catch(x){}
      if(src&&src!=el.dataset.tdid)tdReorder(src,el.dataset.tdid);});
  });
}
function tdReorder(srcId,tgtId){
  const me=DB.currentUser;
  const list=DB.todos.filter(t=>t.personId==me.id&&!t.done)
    .sort((a,b)=>((+a.sort||0)-(+b.sort||0))||(''+(a.due||'9999-99-99')).localeCompare(''+(b.due||'9999-99-99')));
  const si=list.findIndex(t=>t.id==srcId);if(si<0)return;
  const [it]=list.splice(si,1);
  const ti=list.findIndex(t=>t.id==tgtId);if(ti<0)return;
  list.splice(ti,0,it);
  list.forEach((t,i)=>t.sort=(i+1)*10);
  DB.save();renderTodo();
}

function wireForm(){
  const f=document.getElementById('r_from'),t=document.getElementById('r_to'),ty=document.getElementById('r_type');
  if(!f)return;
  const upd=()=>{
    const days=document.getElementById('r_days'),fl=document.getElementById('r_flags'),cal=document.getElementById('r_cal');
    if(!f.value||!t.value||t.value<f.value){days.innerHTML='&nbsp;';fl.innerHTML='';if(cal)cal.innerHTML='';return;}
    const wd=workingDaysBetween(f.value,t.value);
    const hols=[];for(let d=ymd(f.value);toISO(d)<=t.value;d=addDays(d,1)){const n=madHol(toISO(d));if(n&&d.getDay()!==0&&d.getDay()!==6)hols.push(fmtD(d)+' — '+n);}

      (hols.length?' <span style="color:var(--muted)">(bank holidays not counted: '+esc(hols.join(', '))+')</span>':'');
    const fake={id:null,personId:DB.currentUser.id,dateFrom:f.value,dateTo:t.value,type:ty.value,workDays:wd,replaces:changeOf};
    let flags=reqAlarms(fake).map(a=>'<div>⚠ '+a+'</div>');
    /* say out loud which year's allowance these days come out of — booking into NEXT
       year deducts from next year's count (advance deduction, Belén 30 Jul) */
    if(ty.value==='vacation'&&!holExempt(DB.currentUser)&&holYearOfDate(f.value)!==new Date().getFullYear()){
      flags.unshift('<div style="color:#29ACE3">ℹ These days come out of your <b>'+holYearOfDate(f.value)+
        '</b> allowance — each calendar year’s days are deducted from that year’s count.</div>');
    }
    fl.innerHTML=flags.join('');
    if(cal)cal.innerHTML=ty.value==='remote'?'':holMiniCal(f.value,t.value,{personId:DB.currentUser.id,excludeId:changeOf});
  };
  f.onchange=upd;t.onchange=upd;ty.onchange=upd;
  document.getElementById('r_send').onclick=()=>{
    const me=DB.currentUser;if(!me){alert('Log in first.');return;}
    if(!f.value||!t.value||t.value<f.value){alert('Pick a valid date range.');return;}
    const wd=workingDaysBetween(f.value,t.value);
    if(wd<=0){alert('That range has no working days (weekend / bank holidays).');return;}
    if(ty.value==='remote'&&remoteDaysUsed(me.id,f.value.slice(0,4))+wd>REMOTE_MAX_DAYS){
      alert('That would exceed the office-days limit of '+REMOTE_MAX_DAYS+' days this year.');return;}
    const chain=holChain(me);
    const orig=changeOf?DB.holidays.find(x=>x.id==changeOf):null;
    DB.holidays.push({id:DB.newId(),personId:me.id,dateFrom:f.value,dateTo:t.value,workDays:wd,type:ty.value,
      replaces:orig?orig.id:null,
      note:document.getElementById('r_note').value.trim(),status:chain[0].key,
      log:[{by:me.name,at:new Date().toISOString(),action:orig?('requested CHANGE of '+fmtRange(orig)+' ('+orig.workDays+'d)'):('requested '+(ty.value==='remote'?'remote work':'holidays'))}]});
    /* audit: wait for the database before saying "Sent" — a backgrounded phone
       suspends the debounce timer and the request never existed */
    const sendBtn=document.getElementById('r_send');sendBtn.disabled=true;sendBtn.textContent='Sending…';
    DB.saveNow().then(ok=>{
      sendBtn.disabled=false;sendBtn.textContent='Send request';
      const m=document.getElementById('r_msg');
      if(!ok){if(m)m.textContent='⚠ Not sent yet — retrying in the background. Keep the app open.';return;}
      changeOf=null;
      render();   // rebuild FIRST, then write the confirmation on the fresh node (it used to be wiped instantly)
      openFold('holFold');
      const m2=document.getElementById('r_msg');
      if(m2){m2.textContent='Sent — '+(chain[0].key==='hr'?'HR':chain[0].who.name)+' has been flagged.';
        setTimeout(()=>{const m3=document.getElementById('r_msg');if(m3)m3.textContent='';},4000);}
    });
  };
}

/* ================= 🛠 report a clock mistake (fold; ported from hr.html) ================= */
const fmtMin=m=>Math.floor(m/60)+' h '+String(Math.round(m%60)).padStart(2,'0');
function entryLabel(e){return e.kind.toUpperCase()+' '+(e.time||'').slice(0,5)+(e.manual?' *':'')+(/^automatic midnight split/.test(e.reason||'')?' 🌙':'')+(tzLabel(e)?' 🌍':'');}
/* Fail-proof corrections (2026-07-15): the person states WHAT HAPPENED, the system
   works out the punches. Simple fixes apply at once (Belén ratifies after); odd ones
   wait for her. Falls back to the old free-text flow until dispatch_hr11_claims.sql runs. */
/* "The whole day" first, on purpose (Belén, 29 Jul): it is the one option that always
   ends in two concrete times, so it can be approved in a single click. Nearly every
   request that arrived as "Something else" — a phone in another timezone, a session the
   clock cut at midnight — was really this one, and each of those cost a hand correction. */
const CLAIM_TYPES=[
  ['whole_day','My day was actually from … to … (simplest — fixes anything)'],
  ['forgot_out','I forgot to clock out'],
  ['forgot_in','I forgot to clock in'],
  ['wrong_time','A punch has the wrong time'],
  ['extra_punch','There is a punch that should not be there'],
  ['other','Something else — I can’t give the times'],
];
/* who decides clock corrections: Belén + whoever carries the HR flag */
function clockApprovers(){return DB.people.filter(p=>!isTeamAccount(p)&&(p.hr||isBelenP(p))).map(p=>p.id);}
let editingReportId=null;   // set when I am correcting a request Belén sent back to me
function dayRecordLine(personId,day){
  const es=tcEffective(personId,day),info=pairTotals(es);
  if(!es.length)return '<span style="color:var(--muted)">no punches that day</span>';
  return es.map(e=>entryLabel(e)).join(' → ')
    +(info.open?' → <b style="color:#C77800">(no clock-out)</b>':'')
    +' &nbsp;=&nbsp; <b>'+fmtMin(info.total)+'</b>'+(info.open&&day<toISO(new Date())?' ⚠':'');
}
/* the grey helper (Belén, 31 Jul — the Carlos-in-Chile correction was "a mare because
   it was hard to calculate myself"): show what the day holds so far and which OUT
   time rounds it to 7 or 8 hours, so nobody has to do clock arithmetic. */
function dayFixHints(personId,day,claim){
  const es=tcEffective(personId,day),info=pairTotals(es);
  const t2m=t=>{const a=(''+t).slice(0,5).split(':');return (+a[0])*60+(+a[1]||0);};
  const m2t=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
  const parts=[];
  if(es.length)parts.push('that day holds <b>'+fmtMin(info.total)+'</b> so far');
  if(claim&&claim.type==='whole_day'&&claim.from){
    const f=t2m(claim.from);
    parts.push('“to” <b>'+m2t(f+420)+'</b> makes it 7 h · <b>'+m2t(f+480)+'</b> makes it 8 h');
  }else if(info.open){
    const ins=es.filter(e=>e.kind==='in').sort((a,b)=>(''+b.time).localeCompare(''+a.time));
    if(ins[0]&&ins[0].time){
      const start=t2m(ins[0].time);
      parts.push('clocking out at <b>'+m2t(start+(420-info.total))+'</b> makes the day 7 h · <b>'+m2t(start+(480-info.total))+'</b> makes it 8 h');
    }
  }
  try{const wp=tcWeekProgress(personId,toISO(monday(ymd(day))));
    parts.push('that week: '+fmtMin(Math.round(wp.worked*60))+' of '+fmtMin(Math.round(wp.target*60))+' expected');}catch(e){}
  return parts.length?'<div style="color:var(--muted);font-size:12px;margin-top:2px">'+parts.join(' &nbsp;·&nbsp; ')+'</div>':'';
}
function renderReportFold(){
  const box=document.getElementById('reportFoldBody');if(!box)return;
  if(!DB.tcReady()){box.innerHTML='<p class="hint" style="margin-top:8px">Not active yet — run dispatch_hr3.sql in Supabase, then reload.</p>';return;}
  if(!window._claimReady){renderReportFoldOld(box);return;}
  const today=toISO(new Date());
  box.innerHTML=
    '<p class="hint" style="margin-top:8px">Pick the day, give the times and say why — <b>your change applies immediately</b> and goes on the record with your reason (Belén sees every one and can come back to you). Only cases with no times go to her by hand.</p>'+
    '<div class="frm">'+
    '<label>Day<input type="date" id="cl_day" value="'+today+'" max="'+today+'"></label>'+
    '<label>What happened<select id="cl_type"><option value="">— pick —</option>'+CLAIM_TYPES.map(t=>'<option value="'+t[0]+'">'+t[1]+'</option>').join('')+'</select></label>'+
    '</div>'+
    '<div id="cl_rec" class="hint" style="margin:2px 0 8px"></div>'+
    '<div class="frm" id="cl_inputs"></div>'+
    '<div class="frm"><label style="min-width:60%">Why the change? (required — goes on the record)<input id="cl_note" placeholder="e.g. forgot to clock out — I left at 18:00 for the dentist"></label></div>'+
    '<div id="cl_prev" style="border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px;display:none"></div>'+
    '<button class="btn primary" id="cl_send">Send</button><span id="cl_msg" style="font-size:12px;color:var(--green);margin-left:8px"></span>'+
    '<div id="myReports" style="margin-top:14px"></div>';
  wireClaim();renderMyReports();
}
/* load a sent-back request into the form so it can be corrected and resent (Belén:
   "say I realized they wanted to clock in at 9pm instead of 9am, so I send it back") */
function prefillClaim(r){
  try{openFold('reportFold');}catch(e){}
  const day=document.getElementById('cl_day'),type=document.getElementById('cl_type');
  if(!day||!type)return;
  day.value=r.day||day.value;
  type.value=(r.claim&&r.claim.type)||'';
  if(type.onchange)type.onchange();                     // rebuild the fields for that type…
  const c=r.claim||{};
  const set=(id,v)=>{const e=document.getElementById(id);if(e&&v!=null&&v!=='')e.value=v;};
  set('cl_time',c.time);set('cl_from',c.from);set('cl_to',c.to);set('cl_entry',c.entryId);set('cl_text',c.text);
  /* …then refresh the preview through a field (not through the day, which would rebuild
     the fields again and wipe what we just filled in) */
  const fire=['cl_time','cl_from','cl_entry','cl_text'].map(id=>document.getElementById(id)).find(Boolean);
  if(fire)fire.dispatchEvent(new Event('change'));
  const s=document.getElementById('cl_send');if(s)s.textContent='Send again';
  const m=document.getElementById('cl_msg');if(m){m.style.color='var(--orange)';m.textContent='Correcting your earlier request — fix what is wrong and send it again.';}
  day.scrollIntoView({block:'center',behavior:'smooth'});
}
function claimInputsHtml(type,es){
  const punchSel='<label>Which punch<select id="cl_entry">'+(es.length?es.map(e=>'<option value="'+e.id+'">'+entryLabel(e)+'</option>').join(''):'<option value="">— no punches that day —</option>')+'</select></label>';
  switch(type){
    case 'forgot_out': return '<label>I actually left at<input type="time" id="cl_time"></label>';
    case 'forgot_in':  return '<label>I actually arrived at<input type="time" id="cl_time"></label>';
    case 'wrong_time': return punchSel+'<label>It should say<input type="time" id="cl_time"></label>';
    case 'extra_punch':return punchSel;
    case 'whole_day':  return '<label>I worked from<input type="time" id="cl_from"></label><label>to<input type="time" id="cl_to"></label>';
    /* the honest warning: a wordy report cannot be approved with one click, so it waits */
    case 'other':      return '<label style="min-width:60%">Tell HR what happened<input id="cl_text" placeholder="describe it — Belén will handle it by hand"></label>'+
                              '<div class="hint" style="flex-basis:100%;color:#C77800">If you can give the times, pick “My day was actually from … to …” instead — that one is approved in a click, usually the same day.</div>';
    default: return '';
  }
}
function readClaim(){
  const type=(document.getElementById('cl_type')||{}).value;if(!type)return null;
  const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  return {type,time:g('cl_time')||undefined,from:g('cl_from')||undefined,to:g('cl_to')||undefined,
    entryId:g('cl_entry')?+g('cl_entry'):undefined,text:g('cl_text')||undefined};
}
const CLAIM_HARD_BLOCK={future:1,insane:1,noop:1,no_target:1}; // stop these; too_old/manual go to Belén
function wireClaim(){
  const me=DB.currentUser;if(!me)return;
  const day=document.getElementById('cl_day'),type=document.getElementById('cl_type');
  const rec=document.getElementById('cl_rec'),inputs=document.getElementById('cl_inputs'),prev=document.getElementById('cl_prev');
  const refresh=()=>{
    const c0=readClaim();
    rec.innerHTML='Your record for that day: &nbsp;'+dayRecordLine(me.id,day.value)+dayFixHints(me.id,day.value,c0);
    const c=c0;
    if(!c||c.type==='other'||( !c.time&&!c.from&&!c.entryId )){prev.style.display='none';return;}
    const p=planAmendments(me.id,day.value,c);
    prev.style.display='block';
    if(p.blocked&&CLAIM_HARD_BLOCK[p.blocked]){prev.innerHTML='<b style="color:var(--red)">✋ '+esc(CLAIM_BLOCK_MSG[p.blocked]||p.blocked)+'</b>';return;}
    if(p.blocked){prev.innerHTML='📨 '+esc(CLAIM_BLOCK_MSG[p.blocked]||'Belén will handle this one.');return;}
    /* open day: the hours are still running, so show the corrected clock-in time
       rather than "0 h 00" (which reads as if nothing changed). */
    const openStart=p.after.open?[...tcEffective(me.id,day.value).filter(e=>e.kind==='in')].sort((a,b)=>(a.time||'').localeCompare(b.time||''))[0]:null;
    const result=p.after.open
      ? 'you stay clocked in'+(c.type==='forgot_in'||c.type==='wrong_time'?', starting at <b>'+esc((c.time||(openStart&&openStart.time)||'').slice(0,5))+'</b>':'')+' — your hours count from there'
      : 'the day reads <b>'+fmtMin(p.after.total)+'</b>';
    prev.innerHTML='You are claiming: <b>'+esc(p.describe)+'</b><br>Then '+result
      +' <span style="color:var(--green)">— applies immediately and goes on the record; Belén reviews it and can come back to you</span>';
  };
  const rewire=()=>{inputs.innerHTML=claimInputsHtml(type.value,me?tcEffective(me.id,day.value):[]);
    inputs.querySelectorAll('input,select').forEach(e=>e.onchange=e.oninput=refresh);refresh();};
  day.onchange=rewire;type.onchange=rewire;refresh();
  document.getElementById('cl_send').onclick=async()=>{
    const c=readClaim();if(!c){alert('Say what happened first.');return;}
    const note=(document.getElementById('cl_note').value||'').trim();
    if(c.type==='other'&&!(c.text||note)){alert('Tell HR what happened.');return;}
    /* the WHY is part of the record (Belén, 31 Jul: "plus a message explaining why
       they are making the change") — no reason, no change */
    if(c.type!=='other'&&!note){alert('Say why you are making the change — it goes on the record and Belén sees it.');document.getElementById('cl_note').focus();return;}
    const p=planAmendments(me.id,day.value,c);
    if(p.blocked&&CLAIM_HARD_BLOCK[p.blocked]){alert(CLAIM_BLOCK_MSG[p.blocked]||p.blocked);return;}
    const human=(c.type==='other'?(c.text||note):p.describe+(note?' — '+note:''));
    /* RESENDING a request Belén sent back: same report, so her question and my correction
       stay in one thread instead of turning into two half-answered requests. */
    const editing=editingReportId?DB.tcreports.find(x=>x.id==editingReportId):null;
    if(editing){
      const btn0=document.getElementById('cl_send');btn0.disabled=true;
      editing.day=day.value;editing.claim=c;editing.entryId=c.entryId||null;editing.status='open';
      editing.thread=(editing.thread||[]).concat([{by:me.name,at:new Date().toISOString(),text:'✏ Corrected: '+human}]);
      const ok=await DB.saveNow();
      try{notifySend(clockApprovers(),'notice','🕘 '+me.name+' corrected the clock request for '+fmtHuman(day.value)+': '+human,'hr.html#pending');}catch(e){}
      editingReportId=null;btn0.disabled=false;
      renderReportFold();
      const m0=document.getElementById('cl_msg');if(m0)m0.textContent=ok?'Sent again — Belén has it.':'⚠ Not saved — try again.';
      return;
    }
    const rep={id:DB.newId(),personId:me.id,day:day.value,entryId:c.entryId||null,claim:c,ratify:null,
      thread:[{by:me.name,at:new Date().toISOString(),text:human}],status:'open'};
    const btn=document.getElementById('cl_send');btn.disabled=true;
    DB.tcreports.push(rep);
    const okRep=await DB.saveNow();               // report FIRST — the punch RLS checks it exists
    let msg='Sent — Belén will make this one.';
    /* 31 Jul (Belén): "they should be able to change whatever they like whenever, as
       long as it makes sense and it gets recorded. I never should have to do anything."
       So EVERY plan with times applies at once (not only the one-click-simple ones);
       the hard blocks (future/nonsense) still stop, and she still reviews + can push
       back on every one. Only the no-times 'other' report waits for her hands. */
    if(okRep&&!p.blocked&&c.type!=='other'){
      applyPlan(me.id,day.value,p,rep.id,'self-service: '+human);
      rep.ratify='pending';
      const okAmend=await DB.saveNow();
      msg=okAmend?('✔ Done — '+fmtHuman(day.value)+' now reads '+fmtMin(p.after.total)+'. Belén will review it.')
                 :'Saved the report, but the correction could not be written — Belén will apply it.';
      if(!okAmend)rep.ratify=null;
      window.dispatchEvent(new Event('dc-remote'));
    }
    /* tell the approvers it is there — the queue used to be something Belén had to
       remember to go and look at */
    try{notifySend(clockApprovers(),'notice','🕘 '+me.name+' — clock request for '+fmtHuman(day.value)+': '+human,'hr.html#pending');}catch(e){}
    btn.disabled=false;
    renderReportFold();renderClock&&renderClock();       // rebuild first (this resets the form)…
    const m=document.getElementById('cl_msg');if(m){m.textContent=msg;setTimeout(()=>{const m2=document.getElementById('cl_msg');if(m2)m2.textContent='';},8000);} // …then show the confirmation on the fresh element
  };
}
/* pre-claims fallback (dispatch_hr11_claims.sql not run yet) — the old free-text flow */

function threadHtml(r){

    (r.thread||[]).map(m=>'<div style="margin-bottom:4px"><b>'+esc(m.by)+'</b> <span style="color:var(--muted);font-size:11px">'+fmtStamp(m.at)+'</span><br>'+deIso(esc(m.text))+'</div>').join('')+'</div>';

function reportChip(r){
  if(r.ratify==='pending')return '<span class="chip" style="background:var(--blue)">Applied — Belén reviewing</span>';
  if(r.ratify==='accepted')return '<span class="chip" style="background:var(--green)">Accepted</span>';
  if(r.ratify==='denied')return '<span class="chip" style="background:var(--red)">Denied — reversed</span>';
  if(r.status==='needs_info')return '<span class="chip" style="background:#C77800">Sent back — needs their answer</span>';
  return r.status==='resolved'?'<span class="chip" style="background:var(--green)">Resolved</span>'
    :r.status==='answered'?'<span class="chip" style="background:var(--blue)">Answered</span>'
    :'<span class="chip" style="background:var(--amber)">Open</span>';
}
function renderMyReports(){
  const me=DB.currentUser,box=document.getElementById('myReports');
  if(!me||!box)return;
  const mine=DB.tcreports.filter(r=>r.personId==me.id).sort((a,b)=>b.id-a.id).slice(0,6);
  if(!mine.length){box.innerHTML='';return;}
  box.innerHTML='<div style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:4px">My reports</div>'+
    mine.map(r=>{
      /* sent back to me: say so loudly, with the question, and let me correct the request
         itself instead of arguing in a reply thread nobody re-reads */
      const back=r.status==='needs_info';
      const q=back?[...(r.thread||[])].reverse().find(m=>/^↩/.test(m.text||'')):null;
      return '<div style="margin-bottom:10px'+(back?';border-left:3px solid var(--orange);padding-left:9px':'')+'"><b>'+fmtHuman(r.day)+'</b> '+reportChip(r)+
      (back?'<div style="background:#FFF7EE;border:1px solid #F3D9B8;border-radius:8px;padding:8px 11px;margin:5px 0;font-size:13px">'
            +'↩ <b>Sent back to you</b>'+(q?': “'+esc((q.text||'').replace(/^↩\s*/,''))+'”':'')
            +'<div style="margin-top:7px"><button class="btn primary" style="font-size:12px" data-redo="'+r.id+'">✏ Correct it and send again</button></div></div>':'')+
      threadHtml(r)+
      (r.status!=='resolved'?'<input id="rr_'+r.id+'" placeholder="reply…" style="width:70%;font-size:12px;padding:4px 8px"> <button class="btn" style="font-size:11px;padding:3px 9px" data-rr="'+r.id+'">Send</button>':'')+'</div>';}).join('');
  box.querySelectorAll('[data-redo]').forEach(b=>b.onclick=()=>{
    const r=DB.tcreports.find(x=>x.id==b.dataset.redo);if(!r)return;
    editingReportId=r.id;
    prefillClaim(r);
  });
  box.querySelectorAll('[data-rr]').forEach(b=>b.onclick=()=>{
    const r=DB.tcreports.find(x=>x.id==b.dataset.rr);const inp=document.getElementById('rr_'+r.id);
    if(!inp.value.trim())return;
    r.thread=(r.thread||[]).concat([{by:me.name,at:new Date().toISOString(),text:inp.value.trim()}]);
    if(r.status==='answered'||r.status==='needs_info')r.status='open';
    try{notifySend(clockApprovers(),'notice','🕘 '+me.name+' replied about '+fmtHuman(r.day)+': “'+inp.value.trim()+'”','hr.html#pending');}catch(e){}
    DB.save();renderMyReports();});
}

/* ================= 📆 my month (fold; ported from hr.html) ================= */
function monthTable(personId){
  const y=tcM.getFullYear(),m=tcM.getMonth();
  const last=new Date(y,m+1,0).getDate(),today=toISO(new Date());
  let h='<table><tr><th>Day</th><th>Punches</th><th class="num">Worked</th><th class="num">Expected</th><th class="num">Diff</th></tr>';
  let wSum=0,eSum=0,any=false;
  for(let d=1;d<=last;d++){
    const iso=toISO(new Date(y,m,d));
    if(iso>today)break;
    const exp=tcExpectedDay(personId,iso);
    const info=tcDayInfo(personId,iso);
    if(exp<=0&&!info.entries.length)continue;
    any=true;wSum+=info.total;eSum+=exp*60;
    const diff=info.total-exp*60;
    h+='<tr><td>'+fmtHumanShort(iso)+'</td><td>'+(info.entries.length?info.entries.map(entryLabel).join(' · '):'<span style="color:var(--red)">no punches</span>')+'</td>'+
      '<td class="num">'+(info.total?fmtMin(info.total):'—')+'</td><td class="num">'+(exp||'—')+'</td>'+
      '<td class="num" style="color:'+(diff<-15?'var(--red)':diff>15?'var(--green)':'var(--muted)')+'">'+(info.total?((diff>=0?'+':'−')+fmtMin(Math.abs(diff))):'')+'</td></tr>';
  }
  if(!any)h+='<tr><td colspan="5" class="empty">Nothing this month.</td></tr>';
  h+='<tr class="total"><td>Total</td><td></td><td class="num">'+fmtMin(wSum)+'</td><td class="num">'+fmtMin(eSum)+'</td><td class="num">'+((wSum-eSum>=0?'+':'−')+fmtMin(Math.abs(wSum-eSum)))+'</td></tr>';
  return h+'</table>';
}
function renderMonthFold(){
  const box=document.getElementById('monthFoldBody');if(!box)return;
  if(!DB.tcReady()){box.innerHTML='<p class="hint" style="margin-top:8px">Not active yet — run dispatch_hr3.sql in Supabase, then reload.</p>';return;}
  box.innerHTML=
    '<div class="mnav" style="margin-top:8px"><button class="btn" id="tm_prev">‹</button><b id="tm_lab"></b><button class="btn" id="tm_next">›</button></div>'+
    '<div class="mx" id="myMonth"></div>'+
    '<p class="hint" style="margin-top:8px">* = entry added afterwards. Amended punches stop counting but stay in the permanent archive with who/when/why.</p>';
  renderMyMonth();
  document.getElementById('tm_prev').onclick=()=>{tcM.setMonth(tcM.getMonth()-1);renderMyMonth();};
  document.getElementById('tm_next').onclick=()=>{tcM.setMonth(tcM.getMonth()+1);renderMyMonth();};
}
function renderMyMonth(){
  const me=DB.currentUser;if(!me)return;
  const lab=['January','February','March','April','May','June','July','August','September','October','November','December'][tcM.getMonth()]+' '+tcM.getFullYear();
  const el=document.getElementById('tm_lab');if(el)el.textContent=lab;
  const mm=document.getElementById('myMonth');if(mm)mm.innerHTML=monthTable(me.id);
}

  box.innerHTML=
    '<div style="display:flex;gap:14px;align-items:center;margin:8px 0 10px">'+avatarHtml(me,64)+
      '<div><div style="font-weight:700;font-size:15px;color:var(--charcoal)">'+esc(me.name)+'</div>'+
      '<label class="btn" style="font-size:11px;padding:3px 8px;cursor:pointer;display:inline-block;margin-top:4px">Change photo<input type="file" id="pf_photo" accept="image/*" style="display:none"></label>'+
      (me.photo?' <button class="btn" id="pf_rmphoto" style="font-size:11px;padding:3px 8px">Remove</button>':'')+
      '<span id="pf_pmsg" style="font-size:11px;color:var(--green);margin-left:6px"></span></div></div>'+
    '<div class="kv"><span class="k">Job title</span><span class="v">'+me.role+'</span></div>'+
    '<div class="kv"><span class="k">Access</span><span class="v">'+(ACCESS_LABEL[me.access||'member']||me.access)+'</span></div>'+
    '<div class="kv"><span class="k">Email</span><span class="v">'+(me.email||'—')+'</span></div>'+
    '<div class="kv"><span class="k">Work phone</span><span class="v"><input id="pf_phone" value="'+(me.phone||'').replace(/"/g,'&quot;')+'" placeholder="add your work phone" style="border:1px solid var(--line);border-radius:6px;padding:3px 7px;font:inherit;text-align:right;width:150px"> <button class="btn" id="pf_savephone" style="font-size:11px;padding:3px 8px">Save</button></span></div>'+
    '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+
    '<a class="btn" href="person.html?id='+me.id+'">My full timeline</a>'+
    (typeof changePasswordUI==='function'&&USE_SUPABASE?'<button class="btn" id="cpw">Change password</button>':'')+
    '</div>';
  const cp=document.getElementById('cpw');if(cp)cp.onclick=()=>changePasswordUI();
  document.getElementById('pf_photo').onchange=e=>{const f=e.target.files[0];if(!f)return;
    resizeImage(f,url=>{if(!url){alert('Could not read that image.');return;}me.photo=url;DB.save();renderProfFold();});};
  const rmp=document.getElementById('pf_rmphoto');if(rmp)rmp.onclick=()=>{me.photo=null;DB.save();renderProfFold();};
  document.getElementById('pf_savephone').onclick=()=>{me.phone=document.getElementById('pf_phone').value.trim();DB.save();
    document.getElementById('pf_savephone').textContent='Saved ✓';setTimeout(()=>{const b=document.getElementById('pf_savephone');if(b)b.textContent='Save';},2000);};
}

boot(render);
window.addEventListener('dc-remote',render);
