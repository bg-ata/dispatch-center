<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>RENMAD Dispatch Center — Notifications</title>
<style>
  :root{--orange:#FF4A00;--charcoal:#2B2B2B;--ink:#3a3a3a;--muted:#7c7c78;--bg:#f3f2ee;--card:#fff;--line:#e3e1da;--red:#D32230;--green:#3E8C28;--amber:#C77800;--blue:#185FA5;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
  .app{padding:16px 22px 80px;max-width:980px;margin:0 auto}
  .nav{display:flex;align-items:center;gap:3px;margin-bottom:8px}
  .nav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:12.5px;padding:5px 8px;border-radius:8px}
  .nav a.on{background:var(--orange);color:#fff}
  .nav .brandlet{margin-left:auto;font-size:13px;color:var(--muted)}
  h1{margin:6px 0 2px;font-size:22px;font-weight:700;color:var(--charcoal)}
  .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
  button{font:inherit;cursor:pointer}
  .btn{padding:7px 13px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--charcoal)}
  .btn.primary{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:600}
  .btn:hover{filter:brightness(.97)}
  select,input,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;color:var(--ink)}
  .warn{background:#FFF3E8;border:1px solid #F3C49B;color:#8a4a12;font-size:13px;padding:12px 16px;border-radius:10px;margin-bottom:12px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .panel h2{margin:0 0 3px;font-size:15px;color:var(--charcoal)}
  .hint{font-size:12px;color:var(--muted);margin:0 0 10px}
  /* ---- the two views of the bell: Notifications | Requests (hash tabs, house pattern) ---- */
  .viewtabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:2px 0 14px;background:#fff}
  .viewtabs button{border:none;background:#fff;color:var(--muted);font-weight:600;font-size:13px;padding:8px 16px;min-height:38px}
  .viewtabs button.on{background:var(--charcoal);color:#fff}
  .viewtabs .tbadge{display:inline-block;min-width:17px;text-align:center;background:var(--orange);color:#fff;border-radius:9px;font-size:10.5px;font-weight:800;padding:1px 5px;margin-left:6px;vertical-align:1px}
  /* ---- notifications ---- */
  .comprow{display:flex;gap:14px;flex-wrap:wrap}
  .comprow label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:4px;text-transform:uppercase;letter-spacing:.4px}
  .everyone{flex-direction:row !important;align-items:center;text-transform:none !important;letter-spacing:0 !important;font-size:13px !important;color:var(--ink) !important;gap:6px !important;cursor:pointer}
  .comprow textarea{flex:1;min-width:240px;min-height:96px;resize:vertical}
  .secthead{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--charcoal);margin:16px 0 8px}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;display:flex;gap:11px;align-items:flex-start}
  .msg.unread{border-left:4px solid var(--orange);font-weight:600}
  .msg .kchip{font-size:15px;border-radius:9px;padding:4px 8px;color:#fff;flex:none;line-height:1}
  .msg .txt{flex:1;min-width:0}
  .msg .body{white-space:pre-wrap;word-break:break-word}
  .msg .mline{font-size:11.5px;color:var(--muted);font-weight:400;margin-top:3px}
  .msg .mline a{color:var(--blue);font-weight:600;text-decoration:none}
  .msg .mline a:hover{text-decoration:underline}
  .listbar{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
  .listbar h2{margin:0;font-size:15px;color:var(--charcoal)}
  .empty{color:var(--muted);font-style:italic;padding:16px 4px}
  .senderr{font-size:12.5px;color:var(--red);min-height:16px;margin-top:6px}
  .sendok{color:var(--green)}
  /* ---- requests (ported from tickets.html) ---- */
  .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .toolbar label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
  .tk{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .tk .head{display:flex;gap:10px;align-items:center;padding:11px 14px;cursor:pointer;flex-wrap:wrap}
  .tk .head:hover{background:#faf9f6}
  .tk .title{font-weight:700;color:var(--charcoal);flex:1;min-width:180px}
  .chip{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;border-radius:10px;padding:2px 9px;display:inline-block;white-space:nowrap}
  .chip.line{background:#fff !important;border:1px solid var(--line);color:var(--muted)}
  .meta{font-size:12px;color:var(--muted);white-space:nowrap}
  .tk .body{border-top:1px solid #f0eee9;padding:13px 16px;background:#fcfbf9}
  .desc{font-size:13.5px;color:var(--ink);white-space:pre-wrap;margin:0 0 10px}
  .cmt{border-left:3px solid var(--line);padding:6px 10px;margin:7px 0;font-size:13px;background:#fff;border-radius:0 8px 8px 0}
  .cmt .w{font-size:11.5px;color:var(--muted);margin-bottom:2px}
  .cmt.sys{border-left-color:#c9c6bd;color:var(--muted);font-style:italic;background:none}
  .cbox{display:flex;gap:8px;margin-top:10px}
  .cbox input{flex:1}
  .admin{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
  .admin label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px;text-transform:uppercase;letter-spacing:.4px}
  .cnt{font-size:12px;color:var(--muted);margin:0 0 8px}
  @media(max-width:680px){
    .comprow{flex-direction:column}
    .comprow textarea{min-width:0}
    .viewtabs{width:100%;display:flex}
    .viewtabs button{flex:1}
    .tk .head{padding:13px 12px}
    .cbox{flex-direction:column}
    .cbox .btn{min-height:44px}
  }
</style>
</head>
<body>
<div class="app">
  <div id="nav"></div>
  <h1 id="pageH1">🔔 Notifications</h1>
  <p class="sub" id="pageSub"></p>
  <div class="viewtabs" id="viewtabs"></div>
  <div id="warnbox"></div>
  <!-- notifications view -->
  <div id="view-notif">
    <div id="composer"></div>
    <div id="listwrap"></div>
  </div>
  <!-- requests view (the team request box — moved here from Tools so questions and their
       answers live in the same place the 🔔 badge points to) -->
  <div id="view-req" style="display:none">
    <div class="toolbar">
      <button class="btn primary" id="newBtn" style="padding:9px 16px">💡 New request</button>
      <label>Status<select id="f_status"><option value="open">Open (new + planned + in progress)</option><option value="all">All</option><option value="new">New</option><option value="planned">Planned</option><option value="inprogress">In progress</option><option value="done">Done</option><option value="declined">Declined</option></select></label>
      <label>Type<select id="f_type"><option value="all">All</option></select></label>
      <label>Area<select id="f_area"><option value="all">All</option></select></label>
    </div>
    <p class="cnt" id="cnt"></p>
    <div id="list"></div>
  </div>
</div>
<script src="store.js?v=106"></script>
<script>
document.getElementById('nav').innerHTML=navBar('inbox');
function refreshNav(){document.getElementById('nav').innerHTML=navBar('inbox');try{decorateNav();}catch(e){}}

/* ================= the two views ================= */
const SUBS={notif:'Answers to your requests, team notices and time-off decisions — everything the Dispatch Center wants you to see, in one place. Opening this page marks what is here as seen, so the 🔔 badge only ever counts what has arrived since.',
            arch:'Read notifications older than two months. Nothing is deleted — they just stop crowding the inbox.',
            req:'The team request box for the Dispatch Center itself — bugs, clunky bits, change requests and ideas. Everyone can open one and comment; Belén & Carlos set status and priority. Check the list before opening a new one — maybe it’s already here.'};
const TITLES={notif:'🔔 Notifications',arch:'🗄 Archive',req:'💡 Requests'};
function activeView(){const h=location.hash;return h==='#requests'?'req':(h==='#archive'?'arch':'notif');}
function setView(v){location.hash=(v==='req'?'#requests':v==='arch'?'#archive':'#notifications');}
window.addEventListener('hashchange',()=>render());
function renderTabs(){
  let v=activeView();
  let unread=0,newReq=0,old=0;
  try{unread=inboxUnread();}catch(e){}
  try{old=inboxAway().length;}catch(e){}   // "as this visit sees it" — see _seenThisVisit below
  try{if(DB.can('req.triage','edit')&&DB.tickReady())newReq=DB.tickets.filter(t=>t.status==='new').length;}catch(e){}
  /* the 🗄 folder only exists once something has actually aged into it (rulebook: no empty tab) */
  if(v==='arch'&&!old)v='notif';
  document.getElementById('viewtabs').innerHTML=
    '<button class="'+(v==='notif'?'on':'')+'" data-v="notif">🔔 Notifications'+(unread?'<span class="tbadge">'+unread+'</span>':'')+'</button>'+
    (old?'<button class="'+(v==='arch'?'on':'')+'" data-v="arch">🗄 Archive <span class="tbadge" style="background:#9b978d">'+old+'</span></button>':'')+
    '<button class="'+(v==='req'?'on':'')+'" data-v="req">💡 Requests'+(newReq?'<span class="tbadge">'+newReq+'</span>':'')+'</button>';
  document.querySelectorAll('#viewtabs [data-v]').forEach(b=>b.onclick=()=>setView(b.dataset.v));
  document.getElementById('pageH1').textContent=TITLES[v];
  document.getElementById('pageSub').textContent=SUBS[v];
  document.getElementById('view-notif').style.display=v==='req'?'none':'';
  document.getElementById('view-req').style.display=v==='req'?'':'none';
  document.title='RENMAD Dispatch Center — '+TITLES[v].replace(/^\S+\s/,'');
  return v;
}
function render(){
  const v=renderTabs();
  const warn=document.getElementById('warnbox');
  if(v==='req'){
    if(!DB.tickReady()){warn.innerHTML='<div class="warn">The requests module is not switched on yet — Belén needs to run <b>dispatch_tickets.sql</b> in Supabase. Nothing else is affected.</div>';document.getElementById('list').innerHTML='';return;}
    warn.innerHTML='';renderTickets();
  }else{
    if(!DB.inboxReady()){warn.innerHTML='<div class="warn">Notifications need one database step — run <b>dispatch_me_inbox.sql</b> in the Supabase SQL editor.</div>';return;}
    warn.innerHTML='';renderInbox(v==='arch');
  }
}

/* ================= 🔔 notifications ================= */
function fmtWhen(c){ // 'YYYY-MM-DD HH:MM' → 'DD/MM/YYYY HH:MM'
  if(!c)return '';
  const d=c.slice(0,10).split('-'),t=c.slice(11,16);
  if(d.length!==3)return esc(c);
  return d[2]+'/'+d[1]+'/'+d[0]+(t?' '+t:'');
}
function renderComposer(){
  const box=document.getElementById('composer');
  if(!(DB.isAdmin()||DB.isHR())){box.innerHTML='';return;}
  const me=DB.currentUser;
  const opts=DB.people.filter(p=>!isTeamAccount(p)&&(!me||p.id!=me.id))
    .map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');
  box.innerHTML='<div class="panel"><h2>📢 Send a notice</h2>'
    +'<p class="hint">Lands in people’s 🔔 inbox — for alarms and things the team must read.</p>'
    +'<div class="comprow">'
    +'<div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">To</span>'
    +'<label class="everyone"><input type="checkbox" id="c_all"> Everyone</label>'
    +'<select multiple size="6" id="c_who">'+opts+'</select></div>'
    +'<label style="flex:1;min-width:240px">Message<textarea id="c_txt" maxlength="500" placeholder="What does the team need to know?"></textarea></label>'
    +'</div>'
    +'<div style="margin-top:10px"><button class="btn primary" id="c_send">Send</button></div>'
    +'<div class="senderr" id="c_msg"></div></div>';
  const all=document.getElementById('c_all'),who=document.getElementById('c_who');
  all.onchange=()=>{who.disabled=all.checked;};
  document.getElementById('c_send').onclick=()=>{
    const m=document.getElementById('c_msg');m.className='senderr';m.textContent='';
    const txt=(document.getElementById('c_txt').value||'').trim();
    if(!txt){m.textContent='Write the notice first.';return;}
    const ids=[...who.selectedOptions].map(o=>+o.value);
    if(!all.checked&&!ids.length){m.textContent='Pick who gets it — or tick “Everyone”.';return;}
    const n=notifySend(all.checked?'all':ids,'notice',txt,'');
    m.className='senderr sendok';m.textContent='✓ Sent to '+n+' '+(n===1?'person':'people');
    document.getElementById('c_txt').value='';
    render();
  };
}
/* only follow safe destinations: a relative in-app path or an http(s) URL — never
   javascript:/data: etc. (a crafted inbox row could otherwise run script on click) */
function safeLink(u){u=(''+u).trim();
  if(/^https?:\/\//i.test(u))return true;
  if(/^[a-z][a-z0-9+.\-]*:/i.test(u))return false;   // any other scheme → block
  return true;                                        // relative path
}
function msgHtml(m,fresh){
  const k=INBOX_KINDS[m.kind]||INBOX_KINDS.notice;
  return '<div class="msg'+(fresh?' unread':'')+'">'
    +'<span class="kchip" style="background:'+k.color+'" title="'+esc(k.label)+'">'+k.icon+'</span>'
    +'<div class="txt"><div class="body">'+esc(m.text)+'</div>'
    +'<div class="mline">'+esc(m.fromName||'')+' · '+fmtWhen(m.created)
    +(m.link&&safeLink(m.link)?' · <a href="'+esc(m.link)+'">Open →</a>':'')+'</div></div></div>';
}
/* Seeing them IS reading them (Belén, 31 Jul). We mark the list read a beat after it is
   actually on screen — never while the tab is in the background — but the ones that were
   new when you arrived keep their orange "New" flag for the rest of the visit, so the page
   does not blank out under your eyes the moment you look at it. */
const _seenThisVisit=new Set();
let _seenTimer=null;
const _new=m=>_seenThisVisit.has(String(m.id));
/* the two folders as this VISIT sees them: anything that was new when you arrived stays in
   the inbox until you leave, even if reading it just aged it past the two-month line —
   nothing may vanish from under your eyes in the second you look at it. */
function inboxHere(){return inboxMine().filter(m=>!inboxArchived(m)||_new(m));}
function inboxAway(){return inboxMine().filter(m=>inboxArchived(m)&&!_new(m));}
function scheduleSeen(){
  clearTimeout(_seenTimer);_seenTimer=null;
  if(!inboxHere().some(m=>!m.isRead))return;
  if(document.hidden){document.addEventListener('visibilitychange',()=>{if(!document.hidden)scheduleSeen();},{once:true});return;}
  _seenTimer=setTimeout(()=>{_seenTimer=null;
    const ids=inboxHere().filter(m=>!m.isRead).map(m=>m.id);
    ids.forEach(id=>_seenThisVisit.add(String(id)));
    if(inboxMarkSeen(ids)){renderTabs();refreshNav();}   // badge only; the list stays put
  },1200);
}
function renderInbox(archive){
  const W=document.getElementById('listwrap');
  const old=inboxAway();
  if(archive){
    document.getElementById('composer').innerHTML='';   // 📢 send-a-notice belongs to the inbox, not the archive
    let h='<div class="listbar"><h2>🗄 Archive</h2><span class="hint" style="margin:0">'+old.length+' notification'+(old.length===1?'':'s')+' older than two months</span></div>';
    h+=old.length?old.map(m=>msgHtml(m,false)).join(''):'<p class="empty">Nothing has aged out yet.</p>';
    h+='<p class="hint" style="margin-top:12px"><a href="#notifications" style="color:var(--blue);font-weight:600;text-decoration:none">← Back to the inbox</a></p>';
    W.innerHTML=h;return;
  }
  renderComposer();
  const mine=inboxHere();
  const isFresh=m=>!m.isRead||_new(m);
  const fresh=mine.filter(isFresh),earlier=mine.filter(m=>!isFresh(m));
  let h='<div class="listbar"><h2>My inbox</h2></div>';
  if(!mine.length)h+='<p class="empty">Nothing here — you’re up to date 🎉</p>';
  else{
    if(fresh.length)h+='<div class="secthead" style="color:var(--orange)">New</div>'+fresh.map(m=>msgHtml(m,true)).join('');
    if(earlier.length)h+='<div class="secthead">Earlier</div>'+earlier.map(m=>msgHtml(m,false)).join('');
  }
  h+='<p class="hint" style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">'
    +'🗄 Read notifications move to the <b>Archive</b> after two months — nothing is ever deleted. '
    +(old.length?'<a href="#archive" style="color:var(--blue);font-weight:600;text-decoration:none">Open the archive ('+old.length+') →</a>'
                :'Nothing has aged out yet.')+'</p>';
  W.innerHTML=h;
  scheduleSeen();
}

/* ================= 💡 requests (ported verbatim from tickets.html; answer links point here) ================= */
const REQ_LINK='inbox.html#requests';
let openId=null; // which ticket is expanded
const MONn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtCreated(c){ // 'YYYY-MM-DD HH:MM' → '10 Jul'
  if(!c)return '';const d=ymd(c.slice(0,10));return d.getDate()+' '+MONn[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');
}
function prioRank(t){ // untriaged first (admins see what needs a look), then high → normal → low
  if(t.status==='new'&&!t.priority)return 0;
  return t.priority&&TICKET_PRIORITY[t.priority]?TICKET_PRIORITY[t.priority].rank:2.5;
}
function sysNote(t,who,text){ (t.thread=t.thread||[]).push({who:who.id,when:toISO(new Date()),sys:text}); }
function renderTickets(){
  const fs=document.getElementById('f_status').value,ft=document.getElementById('f_type').value,fa=document.getElementById('f_area').value;
  /* fill the type/area filters (keep current selection) */
  const tSel=document.getElementById('f_type');
  if(tSel.options.length===1)tSel.innerHTML='<option value="all">All</option>'+Object.keys(TICKET_TYPES).map(k=>'<option value="'+k+'">'+TICKET_TYPES[k].short+'</option>').join('');
  const areas=[...new Set(DB.tickets.map(t=>t.area).filter(Boolean))].sort();
  const aSel=document.getElementById('f_area'),aCur=aSel.value;
  aSel.innerHTML='<option value="all">All</option>'+areas.map(a=>'<option '+(a===aCur?'selected':'')+'>'+esc(a)+'</option>').join('');
  let list=DB.tickets.slice();
  if(fs==='open')list=list.filter(t=>['new','planned','inprogress'].includes(t.status));
  else if(fs!=='all')list=list.filter(t=>t.status===fs);
  if(ft!=='all')list=list.filter(t=>t.type===ft);
  if(fa!=='all')list=list.filter(t=>t.area===fa);
  list.sort((a,b)=>prioRank(a)-prioRank(b)||(a.created||'').localeCompare(b.created||''));
  document.getElementById('cnt').textContent=list.length+' request'+(list.length===1?'':'s')+(fs==='open'?' open':'')+' · '+DB.tickets.length+' total';
  const L=document.getElementById('list');
  if(!list.length){L.innerHTML='<p class="empty">Nothing here'+(DB.tickets.length?' with these filters.':' yet — be the first: hit “💡 New request”.')+'</p>';return;}
  L.innerHTML=list.map(t=>{
    const p=DB.person(t.personId)||{name:'?',id:0};
    const ty=TICKET_TYPES[t.type]||TICKET_TYPES.idea, st=TICKET_STATUS[t.status]||TICKET_STATUS.new;
    const pr=t.priority&&TICKET_PRIORITY[t.priority];
    const nc=(t.thread||[]).filter(c=>!c.sys).length;
    let h='<div class="tk" data-id="'+t.id+'"><div class="head" data-open="'+t.id+'">'
      +'<span class="chip" style="background:'+ty.color+'">'+ty.short+'</span>'
      +'<span class="title">'+esc(t.title)+'</span>'
      +(pr?'<span class="chip" style="background:'+pr.color+'">'+pr.label+'</span>':(t.status==='new'?'<span class="chip line">untriaged</span>':''))
      +'<span class="chip line">'+esc(t.area||'General')+'</span>'
      +'<span class="meta">'+avatarHtml(p,20)+' '+esc(p.name.split(' ')[0])+' · '+fmtCreated(t.created)+(nc?' · 💬 '+nc:'')+'</span>'
      +'<span class="chip" style="background:'+st.color+'">'+st.label+'</span>'
      +'</div>';
    if(openId==t.id)h+=renderBody(t,p);
    return h+'</div>';
  }).join('');
  L.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{openId=openId==el.dataset.open?null:+el.dataset.open;render();});
  wireBody();
}
function renderBody(t,p){
  const me=DB.currentUser, adm=DB.can('req.triage','edit'), mine=me&&t.personId==me.id;
  let h='<div class="body">';
  if(t.description)h+='<p class="desc">'+esc(t.description)+'</p>';
  h+='<div style="font-size:11.5px;color:var(--muted)">opened by '+esc(p.name)+' · '+fmtCreated(t.created)+'</div>';
  (t.thread||[]).forEach(c=>{
    const w=DB.person(c.who);
    if(c.sys)h+='<div class="cmt sys">'+esc((w?w.name.split(' ')[0]:'?')+' · '+fmtCreated(c.when)+' — ')+esc(c.sys)+'</div>';
    else h+='<div class="cmt"><div class="w">'+esc(w?w.name:'?')+' · '+fmtCreated(c.when)+'</div>'+esc(c.text)+'</div>';
  });
  if(me)h+='<div class="cbox"><input id="cm_'+t.id+'" maxlength="500" placeholder="Add a comment — a +1, more detail, a workaround…"><button class="btn" data-cmt="'+t.id+'">Comment</button></div>';
  if(adm){
    h+='<div class="admin"><label>Status<select id="st_'+t.id+'">'+Object.keys(TICKET_STATUS).map(k=>'<option value="'+k+'" '+(k===t.status?'selected':'')+'>'+TICKET_STATUS[k].label+'</option>').join('')+'</select></label>'
      +'<label>Priority<select id="pr_'+t.id+'"><option value="">—</option>'+Object.keys(TICKET_PRIORITY).map(k=>'<option value="'+k+'" '+(k===t.priority?'selected':'')+'>'+TICKET_PRIORITY[k].label+'</option>').join('')+'</select></label>'
      +'<button class="btn primary" data-adm="'+t.id+'">Save triage</button>'
      +'<label style="flex-direction:row;align-items:center;gap:5px;text-transform:none;letter-spacing:0;font-size:12px;cursor:pointer" title="Sends a 🔔 notification to everyone — use it when a fix or change affects the whole team"><input type="checkbox" id="nt_'+t.id+'"> 📣 also notify the whole team</label></div>';
  }else if(mine&&['new','planned','inprogress'].includes(t.status)){
    h+='<div class="admin"><button class="btn" data-close="'+t.id+'">✓ Close my request (solved / no longer needed)</button></div>';
  }
  return h+'</div>';
}
function wireBody(){
  const me=DB.currentUser;
  document.querySelectorAll('.tk .body').forEach(b=>b.onclick=e=>e.stopPropagation());
  document.querySelectorAll('[data-cmt]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();
    const t=DB.tickets.find(x=>x.id==btn.dataset.cmt);const inp=document.getElementById('cm_'+t.id);
    const txt=(inp.value||'').trim();if(!txt)return;
    (t.thread=t.thread||[]).push({who:me.id,when:toISO(new Date()),text:txt});
    /* 🔔 tell the requester someone replied (not when they comment on their own) */
    if(t.personId!=me.id)notifySend(t.personId,'ticket','New reply on your request “'+t.title+'”',REQ_LINK);
    DB.save();render();});
  document.querySelectorAll('[data-adm]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();
    const t=DB.tickets.find(x=>x.id==btn.dataset.adm);
    const ns=document.getElementById('st_'+t.id).value,np=document.getElementById('pr_'+t.id).value||null;
    const bits=[];
    const statusChanged=ns!==t.status;
    if(statusChanged)bits.push('status → '+(TICKET_STATUS[ns]||{}).label);
    if(np!==t.priority)bits.push('priority → '+(np?TICKET_PRIORITY[np].label:'—'));
    const ntEl=document.getElementById('nt_'+t.id),notifyAll=!!(ntEl&&ntEl.checked);
    if(!bits.length&&!notifyAll)return;
    if(bits.length){t.status=ns;t.priority=np;sysNote(t,me,bits.join(', '));}
    /* 🔔 tell the requester their request moved (unless the admin is the requester) */
    if(statusChanged&&me.id!=t.personId)notifySend(t.personId,'ticket','Your request “'+t.title+'” is now '+TICKET_STATUS[ns].label,REQ_LINK);
    /* 📣 optionally broadcast to the whole team */
    if(notifyAll)notifySend('all','ticket','“'+t.title+'” — '+TICKET_STATUS[ns].label,REQ_LINK);
    DB.save();render();});
  document.querySelectorAll('[data-close]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();
    const t=DB.tickets.find(x=>x.id==btn.dataset.close);
    if(!confirm('Close this request?'))return;
    t.status='done';sysNote(t,me,'closed by the author');
    DB.save();render();});
  document.querySelectorAll('.cbox input').forEach(inp=>inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){const btn=inp.parentElement.querySelector('[data-cmt]');if(btn)btn.click();}}));
}
document.getElementById('newBtn').onclick=()=>quickTicketUI();
['f_status','f_type','f_area'].forEach(id=>document.getElementById(id).onchange=render);
boot(render);
window.addEventListener('dc-remote',render);
</script>
